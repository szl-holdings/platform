# Score Workload Manifest — ${{ values.domainName }} UI
# Generated by golden path: new-domain-ui
# Platform team owns the resolver; developer owns this spec.

apiVersion: score.dev/v1b1
metadata:
  name: ${{ values.domainSlug }}

service:
  ports:
    http:
      port: 80
      targetPort: 5173
      protocol: TCP

containers:
  ${{ values.domainSlug }}:
    image: .
    command: ["node", "server.js"]
    variables:
      NODE_ENV: "${NODE_ENV}"
      PORT: "${PORT}"
      VITE_API_URL: "${VITE_API_URL}"
    readinessProbe:
      httpGet:
        path: /${{ values.domainSlug }}/
        port: 5173
      initialDelaySeconds: 3
      periodSeconds: 10
    resources:
      limits:
        memory: "256Mi"
        cpu: "250m"
      requests:
        memory: "64Mi"
        cpu: "50m"

# Platform annotations — do not modify; set by platform team resolver
# szl.io/domain: ${{ values.domainSlug }}
# szl.io/owner: ${{ values.ownerGroup }}
# szl.io/system: ${{ values.system }}
# szl.io/workload-type: website
# szl.io/preview-path: /${{ values.domainSlug }}/
# szl.io/policy-labels: [authenticated, spa]
