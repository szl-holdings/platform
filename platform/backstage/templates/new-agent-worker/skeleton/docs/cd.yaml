apiVersion: szl.io/v1
kind: ContinuousDelivery
metadata:
  name: ${{ values.agentSlug }}-worker-cd
  service: ${{ values.agentSlug }}-worker
  domain: ${{ values.domain }}

strategy:
  type: rolling
  max_surge: 1
  max_unavailable: 0
  rollback_on_error_rate: 10

environments:
  - name: dev
    auto_deploy: true
    branch: main
    approval_required: false
  - name: staging
    auto_deploy: true
    branch: main
    approval_required: false
  - name: production
    auto_deploy: false
    branch: main
    approval_required: true
    approvers: [${{ values.ownerGroup }}, platform-team]

artifacts:
  image: ghcr.io/szl-holdings/${{ values.agentSlug }}-worker
  tag_strategy: git-sha-short

notifications:
  slack: "#${{ values.domain }}-deployments"
