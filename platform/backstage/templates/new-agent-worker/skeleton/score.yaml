# Score Workload Manifest — ${{ values.agentName }} Worker
# Generated by golden path: new-agent-worker
# Platform team owns the resolver; developer owns this spec.

apiVersion: score.dev/v1b1
metadata:
  name: ${{ values.agentSlug }}-worker

containers:
  ${{ values.agentSlug }}-worker:
    image: .
    command: ["node", "dist/index.js"]
    variables:
      NODE_ENV: "${NODE_ENV}"
      OTEL_SERVICE_NAME: "${{ values.agentSlug }}-worker"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    resources:
      limits:
        memory: "512Mi"
        cpu: "1000m"
      requests:
        memory: "256Mi"
        cpu: "200m"

resources:
  queue:
    type: queue
    class: default
    metadata:
      annotations:
        szl.io/queue-name: ${{ values.agentSlug }}-work
        szl.io/environment-secret: QUEUE_CONNECTION_STRING

# Platform annotations — do not modify; set by platform team resolver
