# Score Workload Manifest — ${{ values.domainName }} API
# Generated by golden path: new-domain-api
# Platform team owns the resolver; developer owns this spec.
# See /platform/score/patterns/ for resolver patterns.

apiVersion: score.dev/v1b1
metadata:
  name: ${{ values.domainSlug }}-api

service:
  ports:
    http:
      port: 80
      targetPort: ${{ values.port }}
      protocol: TCP

containers:
  ${{ values.domainSlug }}-api:
    image: .
    command: ["node", "dist/index.js"]
    variables:
      NODE_ENV: "${NODE_ENV}"
      PORT: "${{ values.port }}"
      OTEL_SERVICE_NAME: "${{ values.domainSlug }}-api"
      SESSION_SECRET: "${SESSION_SECRET}"
      POLICY_ENFORCEMENT_MODE: "${POLICY_ENFORCEMENT_MODE}"
    readinessProbe:
      httpGet:
        path: /ready
        port: ${{ values.port }}
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /health
        port: ${{ values.port }}
      initialDelaySeconds: 10
      periodSeconds: 30
    resources:
      limits:
        memory: "256Mi"
        cpu: "500m"
      requests:
        memory: "128Mi"
        cpu: "100m"

resources:
  db:
    type: postgres
    class: default
    metadata:
      annotations:
        szl.io/environment-secret: DATABASE_URL
  cache:
    type: redis
    class: default
    metadata:
      annotations:
        szl.io/environment-secret: REDIS_URL

# Platform annotations — do not modify; set by platform team resolver
