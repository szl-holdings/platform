    szl.io/openapi-spec: lib/api-spec/openapi.yaml
  tags:
    - rest
    - openapi
    - platform
spec:
  type: openapi
  lifecycle: production
  owner: group:platform-team
  system: system:api-gateway
  definition: |
    openapi: "3.1.0"
    info:
      title: SZL REST API v1
      version: "1.0.0"
      description: "See lib/api-spec for full OpenAPI definition. This stub registers the API in Backstage."
    paths: {}
