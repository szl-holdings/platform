apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: szl-rest-v1
  title: SZL REST API v1
  description: Central REST API gateway — OpenAPI 3.1 spec in lib/api-spec. Consumed by all frontend SPAs and mobile app.
