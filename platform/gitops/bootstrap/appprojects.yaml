---
# SZL Holdings — Argo CD AppProjects
# One project per domain + one platform project for shared substrate.
#
# RBAC design:
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Role          │ Dev         │ Stage       │ Prod                        │
# ├───────────────┼─────────────┼─────────────┼─────────────────────────────┤
# │ domain-admin  │ full sync   │ full sync   │ get only (no sync/override) │
# │ platform-team │ full sync   │ full sync   │ full sync (gate for prod)   │
# │ szl-engineers │ get only    │ get only    │ get only                    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Prod promotions MUST go through platform-team. This is enforced by:
#   1. Argo CD AppProject RBAC (below) — deny sync/override for domain roles on prod apps
#   2. Argo CD Application syncPolicy for prod apps uses automated: {} (manual sync)
#   3. GitHub CODEOWNERS + branch protection for main → requires platform-team review
#
# Domains: vessels, terra, counsel, carlota, aegis, lyte, alloy, platform
---
# ── Platform project (shared substrate) ─────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: szl-platform
  namespace: argocd
  annotations:
    szl.io/domain: "platform"
    szl.io/owns: "crossplane, argocd-config, observability, api-server, alloy-apps"
spec:
  description: "SZL Platform shared substrate — Crossplane, Argo CD config, observability, API server, Alloy fabric"
  sourceRepos:
    - https://github.com/szl-holdings/monorepo
    - https://charts.crossplane.io/stable
    - https://argoproj.github.io/argo-helm
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: crossplane-system
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: szl-platform-dev
      server: https://kubernetes.default.svc
    - namespace: szl-platform-stage
      server: https://kubernetes.default.svc
    - namespace: szl-platform-prod
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "apiextensions.crossplane.io"
      kind: CompositeResourceDefinition
    - group: "apiextensions.crossplane.io"
      kind: Composition
    - group: "apiextensions.crossplane.io"
      kind: EnvironmentConfig
    - group: "pkg.crossplane.io"
      kind: Provider
    - group: "pkg.crossplane.io"
      kind: Function
    - group: "pkg.crossplane.io"
      kind: DeploymentRuntimeConfig
    - group: "kubernetes.crossplane.io"
      kind: ProviderConfig
    - group: "azure.upbound.io"
      kind: ProviderConfig
    - group: "argoproj.io"
      kind: AppProject
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: platform-admin
      description: "Full sync access for platform-team (all environments)"
      policies:
        - p, proj:szl-platform:platform-admin, applications, *, szl-platform/*, allow
        - p, proj:szl-platform:platform-admin, repositories, *, *, allow
      groups:
        - platform-team
    - name: platform-readonly
      description: "Read-only access for all engineers"
      policies:
        - p, proj:szl-platform:platform-readonly, applications, get, szl-platform/*, allow
      groups:
        - szl-engineers
---
# ── Vessels project (Maritime Intelligence) ───────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: szl-vessels
  namespace: argocd
  annotations:
    szl.io/domain: "vessels"
    szl.io/owner: "domain-vessels"
spec:
  description: "Vessels — Maritime Intelligence domain pack"
  sourceRepos:
    - https://github.com/szl-holdings/monorepo
  destinations:
    - namespace: szl-vessels-dev
      server: https://kubernetes.default.svc
    - namespace: szl-vessels-stage
      server: https://kubernetes.default.svc
    - namespace: szl-vessels-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "szl.io"
      kind: DomainService
    - group: "szl.io"
      kind: InternalUI
    - group: "szl.io"
      kind: EventPipeline
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
  roles:
    # domain-vessels: dev+stage full sync; prod read-only (sync denied explicitly)
    - name: vessels-admin
      description: "Full sync for dev/stage; read-only for prod. Use platform-admin role for prod sync."
      policies:
        - p, proj:szl-vessels:vessels-admin, applications, *, szl-vessels/*-dev, allow
        - p, proj:szl-vessels:vessels-admin, applications, *, szl-vessels/*-stage, allow
        - p, proj:szl-vessels:vessels-admin, applications, get, szl-vessels/*-prod, allow
        - p, proj:szl-vessels:vessels-admin, applications, sync, szl-vessels/*-prod, deny
        - p, proj:szl-vessels:vessels-admin, applications, override, szl-vessels/*-prod, deny
        - p, proj:szl-vessels:vessels-admin, applications, action, szl-vessels/*-prod, deny
      groups:
        - domain-vessels
    # platform-team: full sync for all environments including prod
    - name: platform-admin
      description: "Full sync for all environments — used for prod promotions"
      policies:
        - p, proj:szl-vessels:platform-admin, applications, *, szl-vessels/*, allow
      groups:
        - platform-team
    - name: vessels-readonly
      policies:
        - p, proj:szl-vessels:vessels-readonly, applications, get, szl-vessels/*, allow
      groups:
        - szl-engineers
