---
# Dev Environment — Domain Pack Applications
# Domains: vessels, terra, counsel, carlota, aegis/sentra, lyte
# Source: monorepo main branch (continuous delivery from main)
# Gate: None — dev auto-syncs on every main commit
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vessels-dev
  namespace: argocd
  annotations:
    szl.io/environment: "dev"
    szl.io/domain: "vessels"
spec:
  project: szl-vessels
  source:
    repoURL: https://github.com/szl-holdings/monorepo
    targetRevision: main
    path: platform/gitops/apps/dev/manifests/vessels
  destination:
    server: https://kubernetes.default.svc
    namespace: szl-vessels-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
