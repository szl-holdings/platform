---
# Stage Environment — Domain Pack Applications
# Gate: dev-healthy-10m + platform-team LGTM
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vessels-stage
  namespace: argocd
  annotations:
    szl.io/environment: "stage"
    szl.io/domain: "vessels"
    szl.io/promotion-gate: "dev-healthy-10m"
spec:
  project: szl-vessels
  source:
    repoURL: https://github.com/szl-holdings/monorepo
    targetRevision: main
    path: platform/gitops/apps/stage/manifests/vessels
  destination:
    server: https://kubernetes.default.svc
    namespace: szl-vessels-stage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
