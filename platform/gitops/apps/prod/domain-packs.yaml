---
# Production Environment — Domain Pack Applications
# Gate: stage-healthy-30m + manual approval + OPA gate (Phase 4) + Temporal approval (Phase 4)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vessels-prod
  namespace: argocd
  annotations:
    szl.io/environment: "prod"
    szl.io/domain: "vessels"
    szl.io/promotion-gate: "stage-healthy-30m + manual-approval"
spec:
  project: szl-vessels
  source:
    repoURL: https://github.com/szl-holdings/monorepo
    targetRevision: main
    path: platform/gitops/apps/prod/manifests/vessels
  destination:
    server: https://kubernetes.default.svc
    namespace: szl-vessels-prod
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
