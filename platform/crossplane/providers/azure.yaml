# ── Provider Config: Workload Identity (stage + prod) ────────────────────────
# Uses Azure AD Workload Identity federated with the Kubernetes service account.
# No client secrets are stored in this file — credential binding happens via
# the azure-workload-identity webhook (mutating admission controller).
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: azure-provider-config
  annotations:
    szl.io/auth-mode: "workload-identity"
    szl.io/secret-mode: "none-embedded"
spec:
  credentials:
    source: OIDCTokenFile
    env:
      name: AZURE_FEDERATED_TOKEN_FILE
  clientID:
    env:
      name: AZURE_CLIENT_ID
  tenantID:
    env:
      name: AZURE_TENANT_ID
  subscriptionID:
    env:
      name: AZURE_SUBSCRIPTION_ID
---
# ── Provider Config: Service Principal (dev + CI — BLOCKER) ──────────────────
# Used only in dev/CI where workload identity is unavailable.
# Credentials are sourced from a Kubernetes Secret (populated from Key Vault in CI,
# from Replit Secrets in local dev — never committed to this repo).
# Replace with workload-identity config as managed identity is extended to lower envs.
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: azure-provider-config-dev
  annotations:
    szl.io/auth-mode: "service-principal"
    szl.io/blocker: "replace-with-workload-identity"
    szl.io/remediation-owner: "platform-team"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: azure-sp-credentials
      key: credentials
