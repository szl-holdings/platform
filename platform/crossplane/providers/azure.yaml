---
# Crossplane Azure Provider Configuration
# Provider: upbound/provider-azure (family)
# This file declares the provider and provider config needed to apply the SZL composites.
# Authentication: Workload Identity (preferred) or Service Principal (fallback — see blocker below)
#
# BLOCKER: Managed Identity cannot yet replace static credentials for development environments
# (Replit runs outside Azure). Service Principal credentials are used for dev/CI;
# managed identity is the target for stage and prod.
# Remediation owner: platform-team
# Tracked: infra/landing-zone-plan.md §6 (Identity Blockers)
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure
  annotations:
    szl.io/managed-by: "crossplane"
    szl.io/docs: "platform/crossplane/README.md"
spec:
  package: xpkg.upbound.io/upbound/provider-family-azure:v1.4.0
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 2
