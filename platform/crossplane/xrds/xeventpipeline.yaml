---
# XEventPipeline — Composite Resource Definition
# Archetype : Event bus topic + subscription pair (domain event publisher / consumer)
# Resolves  : Score workload type "event-consumer"
# Owner     : platform-team
# Governed by: /platform/policy/ (OPA gate — Phase 4)
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xeventpipelines.szl.io
  annotations:
    szl.io/plane: "resource"
    szl.io/workload-archetype: "event-consumer"
    szl.io/managed-by: "crossplane"
    szl.io/docs: "docs/reference-architecture-szl.md#plane-3--resource"
spec:
  group: szl.io
  names:
    kind: XEventPipeline
    plural: xeventpipelines
  claimNames:
    kind: EventPipeline
    plural: eventpipelines
  defaultCompositionRef:
    name: xeventpipeline-azure-servicebus
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - environment
                - domain
                - criticality
                - costCenter
                - owner
                - networkExposure
                - secretSourceMode
                - observabilityTier
                - backupProfile
                - topicName
                - subscriptions
              properties:
                # ── Governance metadata ───────────────────────────────────────
                environment:
                  type: string
                  enum: [dev, stage, prod]
                domain:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,30}$'
                criticality:
                  type: string
                  enum: [critical, high, standard, low]
                costCenter:
                  type: string
                  pattern: '^[A-Z0-9-]{2,20}$'
                owner:
                  type: string
                networkExposure:
                  type: string
                  enum: [public, internal, private]
                secretSourceMode:
                  type: string
                  enum: [key-vault, workload-identity, replit-secrets]
                observabilityTier:
                  type: string
                  enum: [full, standard, minimal]
                backupProfile:
                  type: string
                  description: "Message retention: daily-30d = 30-day retention on DLQ; none = 1-day default"
                  enum: [daily-30d, daily-7d, none]
                # ── Pipeline shape ─────────────────────────────────────────────
                topicName:
                  type: string
                  description: "Service Bus topic name (e.g. domain-events)"
                  pattern: '^[a-z][a-z0-9-]{0,49}$'
                subscriptions:
                  type: array
                  description: "One subscription entry per consumer workload"
                  minItems: 1
                  items:
                    type: object
                    required: [name, consumerWorkload]
                    properties:
                      name:
                        type: string
                        description: "Subscription name (must be unique within topic)"
                      consumerWorkload:
                        type: string
                        description: "XAgentWorker or XDomainService claim name that consumes this subscription"
                      filterExpression:
                        type: string
                        description: "SQL filter expression on message properties (leave blank for all)"
                      maxDeliveryCount:
                        type: integer
                        default: 3
                      lockDurationSeconds:
                        type: integer
                        default: 60
                namespaceName:
                  type: string
                  description: "Service Bus namespace (defaults to platform-shared namespace)"
                messageTtlHours:
                  type: integer
                  description: "Message time-to-live in hours"
                  default: 24
                  minimum: 1
                  maximum: 8760
                deadLetterEnabled:
                  type: boolean
                  description: "Enable dead-letter queue on all subscriptions"
                  default: true
                keyVaultName:
                  type: string
                  description: "Key Vault name where connection strings are stored"
                policyLabels:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                namespaceFqdn:
                  type: string
                  description: "Service Bus namespace FQDN"
                connectionStringSecretName:
                  type: string
                  description: "Key Vault secret name for namespace connection string"
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
