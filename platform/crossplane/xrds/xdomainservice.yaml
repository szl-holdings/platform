---
# XDomainService — Composite Resource Definition
# Archetype : REST API service (HTTP-exposed, database-backed, policy-gated)
# Resolves  : Score workload type "api-service"
# Owner     : platform-team
# Governed by: /platform/policy/ (OPA gate — Phase 4)
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdomainservices.szl.io
  annotations:
    szl.io/plane: "resource"
    szl.io/workload-archetype: "api-service"
    szl.io/managed-by: "crossplane"
    szl.io/docs: "docs/reference-architecture-szl.md#plane-3--resource"
spec:
  group: szl.io
  names:
    kind: XDomainService
    plural: xdomainservices
  claimNames:
    kind: DomainService
    plural: domainservices
  defaultCompositionRef:
    name: xdomainservice-azure-aca
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - environment
                - domain
                - criticality
                - costCenter
                - owner
                - networkExposure
                - secretSourceMode
                - observabilityTier
                - backupProfile
              properties:
                # ── Governance metadata ───────────────────────────────────────
                environment:
                  type: string
                  description: "Target environment: dev | stage | prod"
                  enum: [dev, stage, prod]
                domain:
                  type: string
                  description: "Business domain (e.g. vessels, terra, counsel, platform)"
                  pattern: '^[a-z][a-z0-9-]{0,30}$'
                criticality:
                  type: string
                  description: "Service criticality: critical | high | standard | low"
                  enum: [critical, high, standard, low]
                costCenter:
                  type: string
                  description: "Cost center tag for billing attribution"
                  pattern: '^[A-Z0-9-]{2,20}$'
                owner:
                  type: string
                  description: "Owning team slug (maps to Backstage group)"
                networkExposure:
                  type: string
                  description: "Network exposure mode: public | internal | private"
                  enum: [public, internal, private]
                secretSourceMode:
                  type: string
                  description: "Secret retrieval mode: key-vault | workload-identity | replit-secrets"
                  enum: [key-vault, workload-identity, replit-secrets]
                observabilityTier:
                  type: string
                  description: "Observability tier: full | standard | minimal"
                  enum: [full, standard, minimal]
                backupProfile:
                  type: string
                  description: "Backup/retention profile: daily-30d | daily-7d | none"
                  enum: [daily-30d, daily-7d, none]
                # ── Workload shape ────────────────────────────────────────────
                containerImage:
                  type: string
                  description: "Container image reference (ACR path without tag)"
                containerPort:
                  type: integer
                  description: "Container listen port"
                  default: 3000
                minReplicas:
                  type: integer
                  description: "Minimum replica count (0 = scale-to-zero)"
                  default: 0
                  minimum: 0
                  maximum: 10
                maxReplicas:
                  type: integer
                  description: "Maximum replica count"
                  default: 5
                  minimum: 1
                  maximum: 30
                # ── Resource bindings ─────────────────────────────────────────
                database:
                  type: object
                  description: "PostgreSQL binding (omit if not required)"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    skuTier:
                      type: string
                      enum: [Burstable, GeneralPurpose, MemoryOptimized]
                      default: Burstable
                    storageGB:
                      type: integer
                      default: 32
                cache:
                  type: object
                  description: "Redis cache binding (omit if not required)"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    skuName:
                      type: string
                      enum: [Basic, Standard, Premium]
                      default: Basic
                keyVaultName:
                  type: string
                  description: "Key Vault name for secret retrieval (required when secretSourceMode=key-vault)"
                # ── Policy hooks (populated by OPA gate — Phase 4) ────────────
                policyLabels:
                  type: array
                  description: "Policy labels enforced on this composite (read-only after admission)"
                  items:
                    type: string
            status:
              type: object
              properties:
                containerAppFqdn:
                  type: string
                  description: "Provisioned Container App FQDN"
                databaseConnectionSecret:
                  type: string
                  description: "Secret name containing DATABASE_URL (Key Vault secret name)"
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
