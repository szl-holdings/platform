---
# XDataConnector — Composite Resource Definition
# Archetype : Managed data pipeline connector (blob storage, external API, reverse-ETL)
# Resolves  : Score resource bindings of type "external-api" / "blob" / "data-source"
# Owner     : platform-team
# Governed by: /platform/policy/ (OPA gate — Phase 4)
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdataconnectors.szl.io
  annotations:
    szl.io/plane: "resource"
    szl.io/workload-archetype: "data-connector"
    szl.io/managed-by: "crossplane"
    szl.io/docs: "docs/reference-architecture-szl.md#plane-3--resource"
spec:
  group: szl.io
  names:
    kind: XDataConnector
    plural: xdataconnectors
  claimNames:
    kind: DataConnector
    plural: dataconnectors
  defaultCompositionRef:
    name: xdataconnector-azure-blob-apim
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - environment
                - domain
                - criticality
                - costCenter
                - owner
                - networkExposure
                - secretSourceMode
                - observabilityTier
                - backupProfile
                - connectorType
              properties:
                # ── Governance metadata ───────────────────────────────────────
                environment:
                  type: string
                  enum: [dev, stage, prod]
                domain:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,30}$'
                criticality:
                  type: string
                  enum: [critical, high, standard, low]
                costCenter:
                  type: string
                  pattern: '^[A-Z0-9-]{2,20}$'
                owner:
                  type: string
                networkExposure:
                  type: string
                  enum: [public, internal, private]
                secretSourceMode:
                  type: string
                  enum: [key-vault, workload-identity, replit-secrets]
                observabilityTier:
                  type: string
                  enum: [full, standard, minimal]
                backupProfile:
                  type: string
                  enum: [daily-30d, daily-7d, none]
                # ── Identity binding ──────────────────────────────────────────
                workloadIdentityPrincipalId:
                  type: string
                  description: |
                    Object ID (principalId) of the workload's managed identity that should
                    receive Key Vault read access via the AccessPolicy composed resource.
                    Set this after the consuming workload's managed identity is provisioned.
                    Until set, the AccessPolicy objectId is "pending-identity-provisioning"
                    and will be rejected by Azure — intentional; forces explicit binding.
                # ── Connector shape ───────────────────────────────────────────
                connectorType:
                  type: string
                  description: |
                    Connector type. Supported values:
                      blob-storage          — Azure Blob Storage container + lifecycle policy
                      external-api-proxy    — APIM backend for external API proxying
                      document-intelligence — Azure Document Intelligence (Form Recognizer)
                    Note: database-replica and reverse-etl are on the roadmap (Phase 6+).
                    Add new enum values here only when a composition branch implements them.
                  enum: [blob-storage, external-api-proxy, document-intelligence]
                blobStorage:
                  type: object
                  description: "Azure Blob Storage config (required when connectorType=blob-storage)"
                  properties:
                    containerName:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
                    retentionDays:
                      type: integer
                      default: 30
                    publicAccess:
                      type: string
                      enum: [None, Blob, Container]
                      default: None
                    versioning:
                      type: boolean
                      default: true
                externalApi:
                  type: object
                  description: "External API proxy config (required when connectorType=external-api-proxy)"
                  properties:
                    upstreamBaseUrl:
                      type: string
                      description: "Base URL of the upstream API (e.g. https://api.openai.com)"
                    keyVaultSecretName:
                      type: string
                      description: "Key Vault secret name holding the API key (never embed the value)"
                    rateLimitRpm:
                      type: integer
                      description: "Rate limit in requests per minute (enforced via API Management)"
                      default: 60
                documentIntelligence:
                  type: object
                  description: "Azure Document Intelligence config (required when connectorType=document-intelligence)"
                  properties:
                    modelId:
                      type: string
                      description: "Document Intelligence model identifier"
                      default: prebuilt-document
                    keyVaultSecretName:
                      type: string
                privateNetworkAttachment:
                  type: object
                  description: "Private endpoint attachment (populated by composition when networkExposure=private)"
                  properties:
                    vnetName:
                      type: string
                    subnetName:
                      type: string
                keyVaultName:
                  type: string
                  description: "Key Vault name for secret retrieval"
                policyLabels:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                resourceId:
                  type: string
                  description: "Azure resource ID of the provisioned data connector"
                connectionSecretName:
                  type: string
                  description: "Key Vault secret name containing the connection string/key"
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
