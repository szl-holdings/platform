---
# XAgentWorker — Composite Resource Definition
# Archetype : Async AI agent / background worker (queue-triggered or cron-triggered)
# Resolves  : Score workload type "worker"
# Owner     : alloy-team
# Governed by: /platform/policy/ (OPA gate — Phase 4)
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xagentworkers.szl.io
  annotations:
    szl.io/plane: "resource"
    szl.io/workload-archetype: "worker"
    szl.io/managed-by: "crossplane"
    szl.io/docs: "docs/reference-architecture-szl.md#plane-3--resource"
spec:
  group: szl.io
  names:
    kind: XAgentWorker
    plural: xagentworkers
  claimNames:
    kind: AgentWorker
    plural: agentworkers
  defaultCompositionRef:
    name: xagentworker-azure-aca-job
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - environment
                - domain
                - criticality
                - costCenter
                - owner
                - networkExposure
                - secretSourceMode
                - observabilityTier
                - backupProfile
                - triggerType
              properties:
                # ── Governance metadata ───────────────────────────────────────
                environment:
                  type: string
                  enum: [dev, stage, prod]
                domain:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,30}$'
                criticality:
                  type: string
                  enum: [critical, high, standard, low]
                costCenter:
                  type: string
                  pattern: '^[A-Z0-9-]{2,20}$'
                owner:
                  type: string
                networkExposure:
                  type: string
                  enum: [public, internal, private]
                secretSourceMode:
                  type: string
                  enum: [key-vault, workload-identity, replit-secrets]
                observabilityTier:
                  type: string
                  enum: [full, standard, minimal]
                backupProfile:
                  type: string
                  enum: [daily-30d, daily-7d, none]
                # ── Worker-specific shape ─────────────────────────────────────
                triggerType:
                  type: string
                  description: "How the worker is triggered"
                  enum: [queue, cron, event, http]
                cronSchedule:
                  type: string
                  description: "Cron expression (required when triggerType=cron). UTC."
                  example: "0 */6 * * *"
                containerImage:
                  type: string
                  description: "Container image reference (ACR path without tag)"
                maxConcurrentExecutions:
                  type: integer
                  description: "Maximum concurrent job executions"
                  default: 1
                  minimum: 1
                  maximum: 20
                emitsProof:
                  type: boolean
                  description: "Whether this worker emits proof-chain events (wires lib/proof-chain)"
                  default: false
                # ── Resource bindings ─────────────────────────────────────────
                queue:
                  type: object
                  description: "Service Bus queue binding (required when triggerType=queue or event)"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    queueName:
                      type: string
                    deadLetterQueueName:
                      type: string
                    maxDeliveryCount:
                      type: integer
                      default: 3
                database:
                  type: object
                  description: "PostgreSQL binding for state persistence"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    skuTier:
                      type: string
                      enum: [Burstable, GeneralPurpose, MemoryOptimized]
                      default: Burstable
                keyVaultName:
                  type: string
                  description: "Key Vault name for AI API key retrieval"
                externalApis:
                  type: array
                  description: "External AI API identifiers (openai | anthropic | etc.)"
                  items:
                    type: string
                policyLabels:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                jobFqdn:
                  type: string
                  description: "Container App Jobs resource ID"
                proofChainEndpoint:
                  type: string
                  description: "Proof-chain emit endpoint (populated when emitsProof=true)"
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
