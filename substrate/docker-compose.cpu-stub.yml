version: "3.9"

# ─── CPU-Stub Overlay ─────────────────────────────────────────────────────────
# Overlay this file over docker-compose.gpu.yml on machines without an NVIDIA GPU.
# All API contracts are identical; inference and worker responses use deterministic
# stub implementations instead of real GPU execution.
#
# Usage:
#   docker compose -f docker-compose.gpu.yml -f docker-compose.cpu-stub.yml up
#
# The engine auto-detects GPU availability; in stub mode:
#   - /health reports engine=oLLM/Substrate (stub)
#   - /ready returns ready=true once the process is up
#   - Inference responses are labelled as stubs (isDemo: true via the bridge)

services:

  substrate-inference:
    deploy:
      resources:
        reservations: {}
        limits:
          memory: "${INFERENCE_MEMORY_LIMIT:-4g}"
    environment:
      SUBSTRATE_MAX_CONCURRENT: "2"

  substrate-py-workers:
    deploy:
      resources:
        reservations: {}
        limits:
          memory: "${WORKER_MEMORY_LIMIT:-2g}"
    environment:
      SUBSTRATE_RETRIEVAL_ALLOW_SYNTHETIC: "1"
      SUBSTRATE_EMBEDDINGS_ALLOW_DEV_MODEL: "1"
