# SZL unified inference gateway — ONE OpenAI-compatible endpoint fronting every node.
# Doctrine v11. Open-weight + free first; sovereign GPU is real metal; paid is last resort.
# Call it like OpenAI:  POST http://<host>:4000/v1/chat/completions  model: "szl-auto"
model_list:
  # ---- Sovereign GPU (own metal, Ollama over Tailscale) ----
  - model_name: sovereign-gpu
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://100.125.77.31:11434/v1
      api_key: "ollama"

  # ---- FREE hosted tiers (zero-cost, tokens we already have) ----
  - model_name: github-models
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: https://models.github.ai/inference
      api_key: os.environ/GITHUB_MODELS_TOKEN
  - model_name: hf
    litellm_params:
      model: openai/meta-llama/Llama-3.1-8B-Instruct
      api_base: https://router.huggingface.co/v1
      api_key: os.environ/HF_TOKEN
  - model_name: groq
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
  - model_name: nvidia-nim
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-8b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # ---- Paid (last resort) ----
  - model_name: openai-gpt4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # ---- Unified aliases ----
  # FREE-FIRST (cost-optimized) — matches the fortress dead-man chain ordering
  - model_name: szl-auto
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: https://models.github.ai/inference
      api_key: os.environ/GITHUB_MODELS_TOKEN
  # SOVEREIGN-FIRST (for governed a11oy turns where sovereign:true must hold)
  - model_name: szl-sovereign
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://100.125.77.31:11434/v1
      api_key: "ollama"

litellm_settings:
  drop_params: true
  fallbacks:
    - szl-auto: ["hf", "groq", "nvidia-nim", "sovereign-gpu", "openai-gpt4o"]
    - szl-sovereign: ["github-models", "hf", "groq", "nvidia-nim", "openai-gpt4o"]
    - github-models: ["hf", "groq", "nvidia-nim", "sovereign-gpu"]
