version: 2.1

orbs:
  node: circleci/node@6.3.0

# ---------------------------------------------------------------------------
# Reusable executors
# ---------------------------------------------------------------------------
executors:
  node24:
    docker:
      - image: cimg/node:24.4
    resource_class: medium


# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  install-pnpm:
    description: Enable corepack and activate pnpm 10
    steps:
      - run:
          name: Enable pnpm via corepack
          command: |
            corepack enable
            corepack prepare pnpm@10 --activate
            pnpm --version

  restore-pnpm-cache:
    description: Restore pnpm store cache
    steps:
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-

  save-pnpm-cache:
    description: Save pnpm store cache
    steps:
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  install-deps:
    description: Install dependencies with frozen lockfile
    steps:
      - install-pnpm
      - restore-pnpm-cache
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --prefer-offline
      - save-pnpm-cache

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  lint:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: pnpm run lint

  typecheck:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Typecheck
          command: pnpm run typecheck

  unit-test:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Unit tests
          command: pnpm run test
      - store_test_results:
          path: coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Build all workspace packages
          command: pnpm -r --if-present run build
      - run:
          name: Build @workspace/a11oy
          command: pnpm --filter @workspace/a11oy run build
      - run:
          name: Build @workspace/sentra
          command: pnpm --filter @workspace/sentra run build
      - run:
          name: Build @workspace/terra
          command: pnpm --filter @workspace/terra run build
      - run:
          name: Build @workspace/carlota-jo
          command: pnpm --filter @workspace/carlota-jo run build
      - run:
          name: Build @workspace/counsel
          command: pnpm --filter @workspace/counsel run build
      - run:
          name: Build @workspace/vessels
          command: pnpm --filter @workspace/vessels run build

  secret-scan:
    executor: node24
    steps:
      - checkout:
          # Full history needed for Gitleaks diff scan on PRs
          path: .
      - run:
          name: Install Gitleaks
          command: |
            GITLEAKS_VERSION="8.21.2"
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz gitleaks
            sudo mv gitleaks /usr/local/bin/gitleaks
            gitleaks version
      - run:
          name: Run Gitleaks — detect committed secrets
          command: |
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1

# ---------------------------------------------------------------------------
# Workflow — mirrors the GitHub Actions CI pipeline
# ---------------------------------------------------------------------------
workflows:
  ci:
    jobs:
      - lint:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - typecheck:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - unit-test:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - build:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - secret-scan:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
