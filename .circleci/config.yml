version: 2.1

orbs:
  node: circleci/node@6.3.0

# ---------------------------------------------------------------------------
# Reusable executors
# ---------------------------------------------------------------------------
executors:
  node24:
    docker:
      - image: cimg/node:24.4
    resource_class: medium

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  install-pnpm:
    description: Enable Corepack and activate exact pnpm 10.26.1
    steps:
      - run:
          name: Enable pnpm via corepack
          command: |
            set -euo pipefail
            source scripts/activate-pnpm.sh
            test "$(pnpm --version)" = "10.26.1"
            echo "export PNPM_HOME=\"${PNPM_HOME}\"" >> "${BASH_ENV}"
            echo 'export PATH="${PNPM_HOME}:${PATH}"' >> "${BASH_ENV}"

  restore-pnpm-cache:
    description: Restore pnpm store cache
    steps:
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-

  save-pnpm-cache:
    description: Save pnpm store cache
    steps:
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  install-deps:
    description: Install dependencies with frozen lockfile
    steps:
      - install-pnpm
      - restore-pnpm-cache
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --prefer-offline
      - save-pnpm-cache

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  lint:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: pnpm run lint

  typecheck:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Typecheck
          command: pnpm run typecheck

  unit-test:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Unit tests
          command: pnpm run test
      - store_test_results:
          path: coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Build all workspace packages through Turbo
          command: pnpm run build

  integration-test:
    executor: node24
    steps:
      - checkout
      - install-deps
      - run:
          name: Build current backend applications
          command: |
            pnpm exec turbo run build \
              --filter=@workspace/alloy-runtime-api \
              --filter=@workspace/alloy-embedding-api \
              --filter=@workspace/alloy-ingestion-orchestrator
      - run:
          name: Test current backend applications
          command: |
            pnpm exec turbo run test \
              --filter=@workspace/alloy-runtime-api \
              --filter=@workspace/alloy-embedding-api \
              --filter=@workspace/alloy-ingestion-orchestrator
          environment:
            CI: "true"
            NODE_ENV: test
      - run:
          name: Start Alloy Runtime API compiled preflight locally
          command: |
            set -euo pipefail
            mkdir -p /tmp/backend-logs
            pnpm --filter @workspace/alloy-runtime-api run start 2>&1 \
              | tee /tmp/backend-logs/alloy-runtime-api.log
          background: true
          environment:
            NODE_OPTIONS: --no-strip-types
            NODE_ENV: development
            PORT: "4010"
      - run:
          name: Start Alloy Embedding API compiled preflight locally
          command: |
            set -euo pipefail
            mkdir -p /tmp/backend-logs
            pnpm --filter @workspace/alloy-embedding-api run start 2>&1 \
              | tee /tmp/backend-logs/alloy-embedding-api.log
          background: true
          environment:
            AEF_AUTH_BYPASS: "true"
            AEF_STORE_BACKEND: in-memory
            NODE_OPTIONS: --no-strip-types
            NODE_ENV: development
            PORT: "8766"
      - run:
          name: Start Alloy Ingestion Orchestrator compiled preflight locally
          command: |
            set -euo pipefail
            mkdir -p /tmp/backend-logs
            pnpm --filter @workspace/alloy-ingestion-orchestrator run start 2>&1 \
              | tee /tmp/backend-logs/alloy-ingestion-orchestrator.log
          background: true
          environment:
            NODE_OPTIONS: --no-strip-types
            NODE_ENV: development
            ORCHESTRATOR_AUTH_BYPASS: "true"
            PORT: "3003"
      - run:
          name: Probe current backend applications locally
          command: |
            set -euo pipefail

            probe_service() {
              local service="$1"
              local port="$2"
              local log_path="/tmp/backend-logs/${service}.log"

              for attempt in $(seq 1 60); do
                if curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz" > /dev/null \
                  && curl --fail --silent --show-error "http://127.0.0.1:${port}/readyz" > /dev/null; then
                  echo "${service} passed local liveness and readiness probes after ${attempt}s"
                  return 0
                fi
                sleep 1
              done

              echo "${service} did not become ready on port ${port}"
              tail -n 100 "${log_path}" 2>/dev/null || true
              return 1
            }

            probe_service alloy-runtime-api 4010
            probe_service alloy-embedding-api 8766
            probe_service alloy-ingestion-orchestrator 3003
      - run:
          name: Dump local backend logs
          when: always
          command: |
            for log_path in /tmp/backend-logs/*.log; do
              if [ -f "${log_path}" ]; then
                echo "=== ${log_path} (last 100 lines) ==="
                tail -n 100 "${log_path}"
              fi
            done
      - store_artifacts:
          path: /tmp/backend-logs
          destination: backend-logs

  secret-scan:
    executor: node24
    steps:
      - checkout:
          # Full history needed for Gitleaks diff scan on PRs
          path: .
      - run:
          name: Install Gitleaks
          command: |
            set -euo pipefail
            GITLEAKS_VERSION="8.21.2"
            GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
            GITLEAKS_TEMP="$(mktemp -d)"
            GITLEAKS_PATH="${GITLEAKS_TEMP}/${GITLEAKS_ARCHIVE}"
            trap 'rm -rf -- "${GITLEAKS_TEMP}"' EXIT

            curl --fail --location --silent --show-error --retry 3 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
              --output "${GITLEAKS_PATH}"
            printf '%s  %s\n' "${GITLEAKS_SHA256}" "${GITLEAKS_PATH}" | sha256sum --check --strict
            tar -xzf "${GITLEAKS_PATH}" -C "${GITLEAKS_TEMP}" gitleaks
            sudo install -m 0755 "${GITLEAKS_TEMP}/gitleaks" /usr/local/bin/gitleaks
            test "$(gitleaks version)" = "${GITLEAKS_VERSION}"
      - run:
          name: Run Gitleaks — detect committed secrets
          command: |
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1

# ---------------------------------------------------------------------------
# Workflow — mirrors the GitHub Actions CI pipeline
# ---------------------------------------------------------------------------
workflows:
  ci:
    jobs:
      - lint:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - typecheck:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - unit-test:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - build:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - integration-test:
          requires:
            - build
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - secret-scan:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
