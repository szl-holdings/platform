packages:
  - apps/*
  - artifacts/*
  - '!artifacts/imperium'
  - '!artifacts/stephen-site'
  - lib/*
  - lib/integrations/*
  - packages/*
  - services/*
  - workers/*
  - scripts
  - platform/temporal
  - platform/agent-gateway

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-query': 5.100.14
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.13.9
  '@types/node': 25.3.5
  '@types/react': 19.2.15
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.2
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: 0.45.2
  framer-motion: 12.35.1
  lucide-react: 0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  react-hook-form: ^7.55.0
  recharts: 2.15.4
  tailwind-merge: 3.5.0
  tailwindcss: ^4.3.0
  tsx: 4.22.4
  typescript: ^6.0.3
  vite: ^8.0.16
  vitest: 4.1.7
  zod: 3.25.76
  zustand: ^5.0.5

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - esbuild  # GHSA-gv7w-rqvm-qjhr security patch (0.28.1)
  - '@esbuild/*'  # esbuild platform binaries for 0.28.1
  - tsx      # required to allow esbuild 0.28.x
  - '@replit/*'
  - stripe-replit-sync
  - vite
  - nodemailer
  - picomatch
  - lodash
  - '@tootallnate/once'
  - '@opentelemetry/propagator-jaeger'
  - brace-expansion
  - fast-uri
  - js-yaml
  - linkify-it
  - postcss
  - sharp
  - expo-glass-effect
  - expo-image-picker
  - expo-document-picker
  - expo-location
  - expo-sensors
  - expo-symbols

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - isolated-vm
  - msw
  - onnxruntime-node
  - sharp
  - unrs-resolver

