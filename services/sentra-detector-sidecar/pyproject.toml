[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentra-detector-sidecar"
version = "0.1.0"
description = "Sentra Detector Sidecar — FastAPI host for Python-authored detectors that share the canonical @szl-holdings/sentra-detector-sdk contract."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
