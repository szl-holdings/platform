[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyte-metrics-store"
version = "1.0.0"
description = "Lyte Metrics Store — retrieval service backing the Substrate Opportunity Audit / Operational Drift workflows"
license = { text = "LicenseRef-SZL-Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "structlog>=26.1.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyte_metrics_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
