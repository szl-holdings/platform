[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyte-metrics-store"
version = "1.0.0"
description = "Lyte Metrics Store — retrieval service backing the Substrate Opportunity Audit / Operational Drift workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyte_metrics_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
