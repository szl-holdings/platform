# Substrate Python Worker Fleet — nginx load-balancer config
#
# Round-robins POST /claim across the worker pool. This checked-in open-source
# nginx sketch has no active health-check module: /ready is only a pass-through
# aggregate probe, and transport failures are observed passively. An actual
# deployment must supply its own readiness controller or use Caddy/Kubernetes.
#
# Layout assumed:
#   - 3 workers running on ports 8090, 8091, 8092 (matches python-workers.md)
#   - This nginx process listens on port 8080 and is what the TS engine
#     points SUBSTRATE_PYTHON_WORKER_URL at:
#       SUBSTRATE_PYTHON_WORKER_URL=http://substrate-py-lb:8080
#
# Intended for nginx 1.25+ syntax. The nginx-plus `health_check` directive and
# third-party active-check modules are deliberately not assumed or configured.
#
# Usage:
#   nginx -c $(pwd)/services/substrate-py-workers/deploy/nginx.conf -g 'daemon off;'

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/substrate-py-lb.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  # ── Upstream pool ─────────────────────────────────────────────────────────
  # Round-robin is the default. `max_fails=2 fail_timeout=10s` means a worker
  # with repeated transport failures can be marked unavailable temporarily.
  # This is not equivalent to actively polling /ready.
  upstream substrate_py_workers {
    server py-worker-1:8090 max_fails=2 fail_timeout=10s;
    server py-worker-2:8091 max_fails=2 fail_timeout=10s;
    server py-worker-3:8092 max_fails=2 fail_timeout=10s;

    # Keep idle upstream connections warm to reduce per-claim latency.
    keepalive 16;
  }

  # ── Frontend ──────────────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name substrate-py-lb;

    # Stage claims — round-robin to the fleet.
    # Long timeouts because heavy-compute stages (OCR, geospatial) can run
    # for tens of seconds. Tune to match WORKER_DRAIN_TIMEOUT_S upstream.
    location = /claim {
      proxy_pass http://substrate_py_workers/claim;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Protocol-Version $http_x_protocol_version;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Tenant-ID $http_x_tenant_id;

      proxy_connect_timeout 5s;
      proxy_send_timeout    120s;
      proxy_read_timeout    120s;

      # POST /claim is not durably idempotent across workers. A timeout or
      # connection error after an accepted request has an ambiguous outcome,
      # so never replay it to another upstream automatically.
      proxy_next_upstream off;
      proxy_next_upstream_tries 1;
    }

    # Aggregate /ready — used by an upstream LB / Kubernetes readiness probe.
    # Returns 200 only if at least one worker behind us is ready.
    location = /ready {
      proxy_pass http://substrate_py_workers/ready;
      proxy_connect_timeout 2s;
      proxy_read_timeout    2s;
      proxy_next_upstream error timeout http_503;
      proxy_next_upstream_tries 3;
    }

    # Aggregate /health — liveness for the LB itself.
    location = /health {
      return 200 '{"status":"ok","component":"substrate-py-lb"}';
      add_header Content-Type application/json;
    }

    # Pass-through for /metrics and /workers (admin / coordinator).
    location ~ ^/(metrics|workers)$ {
      proxy_pass http://substrate_py_workers;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Tenant-ID $http_x_tenant_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout    5s;
    }
  }
}
