# Substrate Python Worker Fleet — Kubernetes Service + Deployment
#
# This is the Kubernetes-native equivalent of the nginx / Caddy LB configs.
# kube-proxy round-robins traffic across all Pods that pass the readiness
# probe. The /ready endpoint returns 503 when a worker is draining or at
# capacity, which removes it from the Service's Endpoints list automatically.
#
# The TS engine points SUBSTRATE_PYTHON_WORKER_URL at the Service DNS name:
#   SUBSTRATE_PYTHON_WORKER_URL=http://substrate-py-workers.default.svc.cluster.local:8080

apiVersion: v1
kind: Service
metadata:
  name: substrate-py-workers
  labels:
    app: substrate-py-workers
spec:
  type: ClusterIP
  selector:
    app: substrate-py-workers
  ports:
    - name: http
      port: 8080
      targetPort: 8090
      protocol: TCP
  # Distribute claims evenly. sessionAffinity must be None so the LB
  # round-robins instead of pinning a (runId, stageId) to one Pod.
  sessionAffinity: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-py-workers
  labels:
    app: substrate-py-workers
spec:
  # Illustrative fixed fleet size only. tests/test_concurrent.py exercises an
  # in-process concurrency helper, not this manifest or a deployed fleet. No
  # checked-in coordinator currently evaluates /metrics or changes replicas.
  replicas: 3
  selector:
    matchLabels:
      app: substrate-py-workers
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Availability-oriented rollout: bring up a new Pod before tearing down
      # the old one. This does not establish duplicate-free claim execution;
      # callers and proxies must not retry an ambiguous POST /claim.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: substrate-py-workers
    spec:
      # WORKER_DRAIN_TIMEOUT_S default is 60s; give the Pod 75s to finish
      # in-flight stages before kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 75
      containers:
        - name: worker
          image: substrate-py-workers:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: HOST
              value: "0.0.0.0"
            - name: SUBSTRATE_PYTHON_WORKER_ENV
              value: "production"
            # The same secret must be injected into the TypeScript authority.
            # This manifest references it; it never creates or stores it.
            - name: SUBSTRATE_PYTHON_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: substrate-py-workers
                  key: api-key
            # A worker credential is valid only for this configured tenant.
            - name: SUBSTRATE_PYTHON_WORKER_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: substrate-py-workers
                  key: tenant-id
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_MAX_CONCURRENCY
              value: "4"
            - name: WORKER_DRAIN_TIMEOUT_S
              value: "60"
          # Liveness — restart if the process is wedged.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness — drives Endpoints membership. /ready returns 503
          # when draining or at capacity, which is exactly what we want
          # the Service load-balancer to react to.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          lifecycle:
            preStop:
              # Give the readiness probe one cycle to observe the rollout.
              # This is a best-effort routing aid, not a durable claim fence.
              exec:
                command: ["sh", "-c", "sleep 5"]
