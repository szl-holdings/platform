# Substrate Python Worker Fleet — Kubernetes Service + Deployment
#
# This is the Kubernetes-native equivalent of the nginx / Caddy LB configs.
# kube-proxy round-robins traffic across all Pods that pass the readiness
# probe. The /ready endpoint returns 503 when a worker is draining or at
# capacity, which removes it from the Service's Endpoints list automatically.
#
# The TS engine points SUBSTRATE_PYTHON_WORKER_URL at the Service DNS name:
#   SUBSTRATE_PYTHON_WORKER_URL=http://substrate-py-workers.default.svc.cluster.local:8080

apiVersion: v1
kind: Service
metadata:
  name: substrate-py-workers
  labels:
    app: substrate-py-workers
spec:
  type: ClusterIP
  selector:
    app: substrate-py-workers
  ports:
    - name: http
      port: 8080
      targetPort: 8090
      protocol: TCP
  # Distribute claims evenly. sessionAffinity must be None so the LB
  # round-robins instead of pinning a (runId, stageId) to one Pod.
  sessionAffinity: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-py-workers
  labels:
    app: substrate-py-workers
spec:
  # Start at 3 replicas — matches the load-test fleet size proven in
  # tests/test_concurrent.py. The autoscaling coordinator (see
  # docs/substrate/python-workers.md §Autoscaling) can adjust between
  # MIN_WORKERS and MAX_WORKERS based on /metrics.
  replicas: 3
  selector:
    matchLabels:
      app: substrate-py-workers
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime rollouts: bring up a new Pod before tearing down the
      # old one. The old Pod's SIGTERM triggers ClaimLoop.drain() which
      # flips /ready to 503 → removed from Endpoints → no new claims.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: substrate-py-workers
    spec:
      # WORKER_DRAIN_TIMEOUT_S default is 60s; give the Pod 75s to finish
      # in-flight stages before kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 75
      containers:
        - name: worker
          image: substrate-py-workers:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_MAX_CONCURRENCY
              value: "4"
            - name: WORKER_DRAIN_TIMEOUT_S
              value: "60"
          # Liveness — restart if the process is wedged.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness — drives Endpoints membership. /ready returns 503
          # when draining or at capacity, which is exactly what we want
          # the Service load-balancer to react to.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          lifecycle:
            preStop:
              # Give the readiness probe one cycle to mark this Pod NotReady
              # before the SIGTERM lands, so no new claims race in during
              # the Endpoints update propagation window.
              exec:
                command: ["sh", "-c", "sleep 5"]
