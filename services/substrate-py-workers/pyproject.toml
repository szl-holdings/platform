[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate-py-workers"
version = "1.0.0"
description = "SZL Holdings — Substrate Python Worker Fleet for heavy retrieval, OCR, geospatial, and eval grading"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "structlog>=24.1.0",
    "anyio>=4.4.0",
    "psutil>=5.9.0",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.10",
    "Pillow>=11.3.0",
    "pdf2image>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
