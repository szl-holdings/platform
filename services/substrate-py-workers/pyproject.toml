[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate-py-workers"
version = "1.0.0"
description = "SZL Holdings — Substrate Python Worker Fleet for heavy retrieval, OCR, geospatial, and eval grading"
license = { text = "LicenseRef-SZL-Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "structlog>=26.1.0",
    "anyio>=4.15.1",
    "psutil>=7.2.2",
    "pdfminer.six>=20260107",
    "pytesseract>=0.3.13",
    "Pillow>=12.3.0",
    "pdf2image>=1.17.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
    "anyio[trio]>=4.15.1",
]
ovis = [
    "accelerate==1.15.0",
    "huggingface-hub>=0.34,<2",
    "qwen-omni-utils==0.0.9",
    "safetensors>=0.5,<1",
    "torch==2.14.0",
    "transformers==5.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
