[project]
name = "alloy-fabric-ingest-control"
version = "0.0.0"
description = "Python port of the Alloy Embedding Fabric ingestion control service (same HTTP contract as ../src/server.ts). Draft; production remains on HOLD."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1.0.0",
  "uvicorn[standard]>=0.52.4,<1.0.0",
  "pydantic>=2.13.5,<3.0.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28.1,<1.0.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
