modules:
  jira:projectPage:
    - key: szl-alloy-project-page
      function: alloy-project-page
      title: Alloy Workflows
      description: View and trigger SZL Alloy automation workflows from within your Jira project

  jira:issuePanel:
    - key: szl-alloy-issue-panel
      function: alloy-issue-panel
      title: Alloy Signals
      description: Surface SZL Lyte signals and PRISM risk scores linked to this issue

  jira:issueAction:
    - key: szl-trigger-workflow-action
      function: trigger-alloy-workflow
      title: Trigger Alloy Workflow
      description: Fire an Alloy automation workflow using this issue as the trigger signal

  webtrigger:
    - key: szl-alloy-webhook-receiver
      function: alloy-webhook-receiver
      description: Receives Alloy workflow completion events and updates Jira issues

  trigger:
    - key: szl-issue-status-sync
      function: issue-status-sync
      events:
        - jira:issue_updated
        - jira:issue_created
      description: Sync Jira issue status changes back to Alloy as workflow signals

function:
  - key: alloy-project-page
    handler: src/project-page.handler
  - key: alloy-issue-panel
    handler: src/issue-panel.handler
  - key: trigger-alloy-workflow
    handler: src/trigger-workflow.handler
  - key: alloy-webhook-receiver
    handler: src/webhook-receiver.handler
  - key: issue-status-sync
    handler: src/issue-status-sync.handler

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - "*.szlholdings.com"
        - "*.replit.dev"

app:
  id: ari:cloud:ecosystem::app/szl-holdings-alloy-forge
  name: SZL Holdings — Alloy Integration
  description: Connect Jira to SZL Holdings Alloy workflow automation and Lyte intelligence platform
  vendor:
    name: SZL Holdings
    url: https://szlholdings.com
  support:
    url: https://szlholdings.com/support
    email: support@szlholdings.com
  documentation:
    url: https://szlholdings.com/docs/integrations/jira
  privacy_policy:
    url: https://szlholdings.com/privacy
  terms_of_service:
    url: https://szlholdings.com/terms
  categories:
    - project-management
    - automation
    - reporting
  icon: src/assets/icon.png

runtime:
  name: nodejs18.x

storage:
  product:
    - jira
