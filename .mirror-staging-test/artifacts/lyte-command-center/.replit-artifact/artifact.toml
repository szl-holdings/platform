kind = "web"
previewPath = "/lyte-command-center/"
title = "Lyte Command Center"
version = "1.0.0"
id = "artifacts/lyte-command-center"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/lyte-command-center/" ]
localPort = 19290

[services.development]
run = "pnpm --filter @workspace/lyte-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lyte-command-center", "run", "build" ]
publicDir = "artifacts/lyte-command-center/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19290"
BASE_PATH = "/lyte-command-center/"
