kind = "web"
  previewPath = "/lexicon/"
  title = "LEXICON — License Intelligence Catalog"
  version = "1.0.0"
  id = "artifacts/lyte-command-center"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/lexicon/" ]
  localPort = 9090

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/lexicon && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/lexicon", "run", "build" ]
  publicDir = "artifacts/lexicon/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  VITE_PORT = "8097"
  BASE_PATH = "/lexicon/"
