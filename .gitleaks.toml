# ─────────────────────────────────────────────────────────────────────────────
# SZL Holdings — Gitleaks Configuration
#
# Gitleaks scans every commit in a pull request for high-confidence credential
# patterns and blocks the merge if any are found.
#
# This file extends the built-in gitleaks default rule set (which covers 150+
# provider-specific patterns) and layers on project-specific allowlists to
# suppress well-understood false positives.
#
# Docs: https://github.com/gitleaks/gitleaks
# ─────────────────────────────────────────────────────────────────────────────

title = "SZL Holdings — Secret Scanning Policy"

# ── Extend the upstream default rule set ─────────────────────────────────────
# The default set is maintained by the gitleaks team and covers OpenAI, AWS,
# GitHub, GCP, Stripe, Twilio, Resend, and 140+ other providers.
[extend]
useDefault = true

# ── Global allowlist ──────────────────────────────────────────────────────────
# Entries here suppress matches across ALL rules.
# Policy: prefer targeted regex suppressions over broad path/directory skips.
# Only add a path entry when a regex cannot cleanly describe the false positive.
[allowlist]
  description = "Global false-positive suppressions for SZL Holdings"

  # ── Files / directories that are safe to skip entirely ──────────────────────
  paths = [
    # Lock files contain package hashes, not secrets.
    "pnpm-lock.yaml",
    "package-lock.json",
    "yarn.lock",

    # The internal scanner script contains regex patterns for detection;
    # those patterns are not credentials.
    "scripts/qa/scan-secrets.js",

    # This config file itself contains allowlist regex fragments.
    ".gitleaks.toml",

    # Generated test/build output — never contain real source credentials.
    "playwright-report",
    "test-results",
    "coverage",

    # Replit platform env-var definition file. Values here are dev-environment
    # variables managed by the Replit platform (not production credentials).
    # Production secrets are stored in Replit Secrets and never committed.
    "\\.replit",

    # Generated staging-test mirror of the monorepo. Any finding in the mirror
    # is always a duplicate of a finding in the original source path, so
    # suppressions on the originals are sufficient.
    "\\.mirror-staging-test",

    # .env.example files are developer-facing template files with explicit
    # placeholder values. They are never real credentials.
    "\\.env\\.example$",

    # ── Specific source files with named false positives ─────────────────────

    # Certification readiness route: `requirementKey` is a domain data field
    # (e.g. 'ownership_51', 'citizenship') in requirement record objects, not
    # an API credential.
    "artifacts/api-server/src/routes/certification-readiness\\.ts",

    # Seed script for certification data: same requirementKey field pattern.
    "artifacts/api-server/src/scripts/seed-capital-cert\\.ts",

    # React cognitive-memory page: uses `key:` as a JavaScript object field
    # name in an array of memory capsule descriptors, not as an API key.
    "artifacts/command/src/pages/cognitive/memory\\.tsx",

    # Developer portal UI: renders truncated example API key values for
    # developer documentation purposes. Values are clearly placeholder strings.
    "artifacts/szl-holdings/src/pages/distribution-os/developer-api\\.tsx",
    "artifacts/szl-holdings/src/alloy-platform/pages/Developer\\.tsx",

    # localStorage namespace constant ("szl-deal-submissions-v1").
    # KV store bucket names, not API credentials.
    "artifacts/szl-holdings/src/lib/dealSubmissions\\.ts",

    # Vessels BoL HMAC module: current code uses an explicitly labeled
    # dev-only fallback. Historical commits in this file are also safe
    # (the value was always a dev-only constant, not a real production secret).
    "artifacts/api-server/src/routes/vessels-modules\\.ts",

    # Live-server integration test: LIVE_TOKEN reads from the
    # INTEGRATION_TEST_TOKEN environment variable and defaults to "".
    # No hardcoded token value is present in source.
    "tests/api/server-live\\.test\\.ts",
  ]

  # ── Regex patterns that are always safe ─────────────────────────────────────
  # These patterns match documentation examples, placeholder values, and CI
  # fixture strings that look like real credentials but are not.
  regexes = [
    # Generic placeholder strings used in .env.example and docs
    "your[-_]?(?:api[-_]?)?(?:key|secret|token|password|credential)(?:[-_]?here)?",
    "placeholder",
    "changeme",
    "replace[-_]?me",
    "example[-_]?only",

    # Stripe test-mode keys (not live)
    "sk_test_[a-zA-Z0-9]+",
    "pk_test_[a-zA-Z0-9]+",
    "rk_test_[a-zA-Z0-9]+",
    "whsec_test_[a-zA-Z0-9]+",

    # AWS example / documentation account IDs used in ARN examples
    "AKIAIOSFODNN7EXAMPLE",
    "AKIA0000000000EXAMPLE",

    # GitHub token examples from documentation (26 hex chars after prefix — not
    # a real 36-char personal token)
    "ghp_[a-f0-9]{26}",

    # OpenAI placeholder keys that appear in docs / templates
    "sk-proj-[A-Za-z0-9_-]{20}XXXXXXXXXX",
    "sk-[Xx]{20,}",

    # Resend placeholder keys used in .env.example
    "re_[Xx]{24,}",
    "re_0000[a-zA-Z0-9]{20}",

    # JWT example from README / docs — recognisable by all-zero payload
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\\.",

    # Postgres DSN used in integration tests (local CI service; not production)
    "postgresql://postgres:postgres@localhost",

    # Replit deployment URLs — not secrets
    "REPLIT_DEV_DOMAIN",
    "replit\\.app",
    "replit\\.dev",

    # Dev-environment API keys carried under the szl_dev_ prefix.
    # Production keys use szl_live_ and are never committed to source.
    "szl_dev_[a-zA-Z0-9]+",

    # Internal token format used in the Replit dev environment (.replit file).
    # The prefix "szl-" followed by 64 hex chars identifies dev-only tokens.
    "szl-[0-9a-f]{64}",

    # Dev-only HMAC fallback in vessels-modules.ts — the constant name itself
    # includes "-dev-only" to document its non-production nature.
    "vessels-bol-chain-secret-dev-only",

    # Known dev substrate signing key canary value in startup-validation.ts.
    # Deliberately kept in source so the validator can warn when the default
    # value is still in use (i.e. no real key has been configured).
    "5228884b12bc50c3be1c0f8345d5f5475baf5bc2ccb265d5e9bc02674c04258a",

    # Synthetic MLS listing keys in lib/services/src/adapters/reso-mls.ts.
    # These are fixture data records (mls-rbny-2024001, etc.), not real keys.
    "mls-[a-z]+-[0-9]+",

    # Azure Key Vault Secrets User built-in role definition ID.
    # This is a Microsoft-published public GUID, not a secret.
    # Ref: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
    "4633458b-17de-408a-b874-0445c86b69e6",

    # Truncated example tokens shown in developer portal UI for developers.
    # Clearly non-real (ellipsis notation: "a3f9e2c4b1d8...", "szl_live_a1b2...").
    "a3f9e2c4b1d8",
    "szl_live_a1b2c3d4e5f6",

    # Shell env-var references in curl documentation examples — the value comes
    # from the shell environment and is never a hardcoded secret.
    "Bearer \\$[A-Z_][A-Z0-9_]*",

    # Mapbox placeholder token value in .env.example files — base64 encoding of
    # the literal strings "your-username" and "your-token", not a real token.
    "pk\\.eyJ1IjoieW91ci11c2VybmFtZSIsImEiOiJ5b3VyLXRva2VufQ",

    # localStorage bucket name constants (e.g. "szl-deal-submissions-v1").
    # These are storage namespace strings, not API credentials.
    "szl-[a-z-]+-v[0-9]+",
  ]

  # ── Commit-level stop-list ────────────────────────────────────────────────
  # These commit SHAs are known historical commits that pre-date this policy.
  # Any new leaked secrets must be rotated AND the commit re-evaluated.
  commits = []

# ── Custom rule: detect high-entropy base64 private keys ─────────────────────
# The default gitleaks set already covers PEM blocks; this is an additional
# defence for unusual wrapping formats.
[[rules]]
  id          = "private-key-bare"
  description = "Bare high-entropy private key block (non-standard wrapping)"
  regex       = '''(?i)-----BEGIN[ A-Z]*PRIVATE KEY[ A-Z]*-----'''
  tags        = ["key", "credential"]

  [rules.allowlist]
    paths = [
      # .env.example deliberately contains a commented-out example block
      "\\.env\\.example",
      # documentation may quote key format without real key content
      "SECRETS_SETUP\\.md",
    ]

# ── Custom rule: Expo / EAS token ────────────────────────────────────────────
[[rules]]
  id          = "expo-eas-token"
  description = "Expo EAS / Expo account token"
  regex       = '''eas_[a-zA-Z0-9_-]{40,}'''
  tags        = ["expo", "credential"]

# ── Custom rule: Resend production key ───────────────────────────────────────
# The built-in Resend rule can fire on test keys; this scoped rule targets only
# production-style keys (mixed case, min 28 chars, not matching the allowlist
# placeholder pattern above).
[[rules]]
  id          = "resend-production-key"
  description = "Resend production API key"
  regex       = '''re_[a-zA-Z0-9]{28,}'''
  tags        = ["resend", "credential"]

  [rules.allowlist]
    regexes = [
      "re_[Xx]{24,}",
      "re_0000[a-zA-Z0-9]{20}",
    ]

# ── curl-auth-header rule: suppress documentation example endpoints ───────────
# The built-in curl-auth-header rule fires on markdown documentation files that
# contain example curl commands with Bearer token placeholders. Override the
# rule to add an allowlist for known documentation files where the Bearer value
# is visibly an example (localhost URL, example.com host, [host] placeholder).
[[rules]]
  id          = "curl-auth-header"
  description = "Authorization header with Bearer token"
  regex       = '''(?i)(Authorization\s*[:=]\s*["']?\s*Bearer\s+)([a-zA-Z0-9\-._~+/]+=*)'''
  secretGroup = 2
  tags        = ["auth", "credential"]

  [rules.allowlist]
    # Documentation files that contain example curl commands with placeholder tokens.
    paths = [
      "docs/aef/README\\.md",
      "docs/aef/implementation-plan\\.md",
      "ops/benchmark/api-integration-quickstart\\.md",
      "ops/benchmark/api-idempotency-and-events\\.md",
    ]
    # Bearer tokens that are clearly placeholder/example values.
    regexes = [
      # Shell environment variable reference — not a real token
      "Bearer \\$[A-Z_][A-Z0-9_]*",
      # Truncated example shown with ellipsis — not a real token
      "a3f9e2c4b1d8",
      "szl_live_a1b2c3d4e5f6",
    ]
