# SZL Holdings — Sentra Zarf package
# Authored by: Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings
# Status: Real package. Per Plane 1 of the mesh plan (§04). Intended for commit
#         to the external szl-holdings/sentra repository at path deploy/zarf.yaml.

kind: ZarfPackageConfig
metadata:
  name: sentra
  version: 1.0.0-alpha
  description: |
    Cyber Resilience Command. Payload-anchored financial-exposure model,
    posture API, and incident command surface. Apache-2.0 / NOTICE per
    SZL Doctrine V6 license allowlist.
  url: https://github.com/szl-holdings/sentra
  authors: "Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings"
  architecture: amd64

components:
  - name: sentra-runtime
    required: true
    description: Sentra runtime container + posture API service.
    images:
      - ghcr.io/szl-holdings/sentra:v1.0.0-alpha
    manifests:
      - name: sentra
        namespace: sentra
        files:
          - manifests/sentra-namespace.yaml
          - manifests/sentra-deployment.yaml
          - manifests/sentra-service.yaml
