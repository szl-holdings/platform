# SZL Holdings — Top-level UDS bundle (LOCAL-BUILD VARIANT)
# Authored by: Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings
# Status: Demo default. This is the variant the Tuesday packet ships as the
#         Day-1 happy path so a Defense Unicorns engineer can run
#         `uds-cli bundle create` straight from this directory without
#         requiring the szl-holdings GHCR packages to be reachable.
#
#         For the production path (GHCR-published packages at
#         ghcr.io/szl-holdings/packages/{a11oy,sentra,amaru}:1.0.0-alpha),
#         see the sibling `uds-bundle.yaml`.
#
# Build:  uds-cli bundle create . --confirm
#         (uds-cli will run `zarf package create` against each sibling
#         deploy/ directory at bundle-build time — no GHCR round-trip.)
# Deploy: uds-cli bundle deploy uds-bundle-szl-mesh-amd64-0.1.0.tar.zst --confirm
# Verify: uds-cli bundle inspect uds-bundle-szl-mesh-amd64-0.1.0.tar.zst

kind: UDSBundle
metadata:
  name: szl-mesh
  version: 0.1.0
  description: |
    A11oy + Sentra + Amaru composed as a single UDS bundle, with an
    in-bundle hash-chained attestations sidecar verifiable offline
    (no registry round-trip) per §05 Fix A.

    Local-build variant: the three Zarf packages are built from the
    sibling deploy/ directories at bundle-create time. Use this for the
    Andrew demo and any offline / pre-publication workflow.
  authors: "Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings"
  architecture: amd64

packages:
  - name: a11oy
    path: ../a11oy/deploy
    optionalComponents:
      - a11oy-attestations

  - name: sentra
    path: ../sentra/deploy

  - name: amaru
    path: ../amaru/deploy
