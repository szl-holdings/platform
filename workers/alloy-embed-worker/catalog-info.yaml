apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: alloy-embed-worker
  title: Alloy Embed Worker
  description: Async embedding worker — dequeues documents from the ingestion pipeline, generates embeddings via the embedding API, and writes vectors to the vector store.
  annotations:
    github.com/project-slug: szl-holdings/monorepo
    backstage.io/techdocs-ref: dir:.
    szl.io/scorecard-score: '1.2'
    szl.io/golden-path-deviation: "Async worker — no HTTP health endpoint required; uses queue trigger"
    szl.io/runbook: infra/runbooks/alloy-embed-worker.md
  tags:
    - alloy
    - embedding
    - worker
    - typescript
spec:
  type: worker
  lifecycle: experimental
  owner: group:alloy-team
  system: system:aef-embedding
  domain: domain:alloy
  dependsOn:
    - component:alloy-embedding-api
    - resource:postgresql-dev
    - resource:azure-service-bus
  consumesApis:
    - api:alloy-embed-v1
