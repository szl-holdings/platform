# A11oy — current local deployable-container stack.
# Run from the repository root:
#   docker compose --env-file .env -f ops/local/docker-compose.yml up --build
#
# This file intentionally contains only images backed by Dockerfiles that are
# present and validated in this checkout. It does not resurrect the retired
# @workspace/api-server or @workspace/szl-holdings packages.

x-common-env: &common-env
  NODE_ENV: production

services:
  alloy-runtime-api:
    build:
      context: ../..
      dockerfile: apps/alloy-runtime-api/Dockerfile
    image: a11oy/alloy-runtime-api:local
    environment:
      <<: *common-env
      PORT: 4010
      ALLOY_API_KEY: ${ALLOY_API_KEY:?set ALLOY_API_KEY in the local .env file}
      ALLOY_API_TENANT_ID: ${ALLOY_API_TENANT_ID:?set ALLOY_API_TENANT_ID in the local .env file}
    ports:
      - "4010:4010"
    restart: unless-stopped

  vessels:
    build:
      context: ../..
      dockerfile: artifacts/vessels/Dockerfile
    image: a11oy/vessels:local
    ports:
      - "4002:8080"
    restart: unless-stopped

  terra:
    build:
      context: ../..
      dockerfile: artifacts/terra/Dockerfile
    image: a11oy/terra:local
    ports:
      - "4003:8080"
    restart: unless-stopped

  carlota-jo:
    build:
      context: ../..
      dockerfile: artifacts/carlota-jo/Dockerfile
    image: a11oy/carlota-jo:local
    ports:
      - "4005:8080"
    restart: unless-stopped

networks:
  default:
    name: szl-holdings-network
