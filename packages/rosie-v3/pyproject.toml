[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-rosie-v3"
version = "0.1.0"
description = "Rosie v3 companion: reasoning companion organ + flat single-file build."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar / SZL Holdings", email = "yachay@szlholdings.dev" }]
keywords = ["szl", "doctrine-v11", "rosie-v3"]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/platform"

[tool.setuptools]
packages = ["szl_rosie_companion"]

