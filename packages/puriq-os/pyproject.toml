[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-puriq-os"
version = "0.1.0"
description = "PURIQ agentic loop OS: Yuyay-13 gate, Λ aggregator, Hukulla tripwires, Khipu emit, replay-hash."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar / SZL Holdings", email = "yachay@szlholdings.dev" }]
keywords = ["szl", "doctrine-v11", "puriq-os"]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/platform"

[tool.setuptools]
packages = ["puriq_os"]

