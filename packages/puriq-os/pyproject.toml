[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-puriq-os"
version = "14.0.0"
description = "PURIQ-OS — the fully-agentic empire operating-system runtime (Doctrine v14)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lutar, Stephen P.", email = "stephenlutar2@gmail.com" }]
keywords = ["agentic", "cybernetics", "puriq", "khipu", "yuyay", "hukulla"]
dependencies = [
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["puriq_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
