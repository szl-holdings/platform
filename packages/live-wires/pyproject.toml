[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-live-wires"
version = "0.1.0"
description = "Live-Wires: real-time 3D wires transport (SSE fan-out) across the flagship constellation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar / SZL Holdings", email = "yachay@szlholdings.dev" }]
keywords = ["szl", "doctrine-v11", "live-wires"]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/platform"

[tool.setuptools]
packages = ["live_wires"]

