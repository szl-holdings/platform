[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-unay"
version = "1.0.0"
description = "UNAY: receipt-keyed semantic memory store (sqlite, honest sqlite-vss / cosine-fallback)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar / SZL Holdings", email = "yachay@szlholdings.dev" }]
keywords = ["szl", "doctrine-v11", "unay", "memory", "receipts"]
dependencies = []

[project.optional-dependencies]
vss = ["sqlite-vss>=0.1.2"]

[project.urls]
Homepage = "https://github.com/szl-holdings/platform"

[tool.setuptools]
packages = ["unay"]

# Doctrine v11 — 749 declarations / 14 unique axioms / 163 sorries.
# doctrine_locked_at = c7c0ba17. Λ = Conjecture 1 (NOT a theorem). SLSA L1 (honest).
# Reed-Solomon != holographic; event-sourcing != time travel.
