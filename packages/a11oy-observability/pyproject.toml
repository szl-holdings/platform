[project]
name = "a11oy-observability"
version = "0.1.0"
description = "Provenanced business observability as a NATIVE a11oy capability — sign every event, prove the chain via Lean, replay decisions years later."
license = { text = "Apache-2.0" }
authors = [{ name = "Yachay", email = "yachay@szlholdings.dev" }]
requires-python = ">=3.10"
readme = "README.md"
keywords = ["observability", "provenance", "dsse", "otel", "khipu", "a11oy", "compliance"]
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://huggingface.co/spaces/SZLHOLDINGS/a11oy"
Repository = "https://github.com/szl-holdings/platform"

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
