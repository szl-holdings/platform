[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-throttle"
version = "0.1.0"
description = "FastAPI rate-limiting + CORS + Khipu-audited rejections for SZL flagships"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar Jr (SZL Holdings)" }]
keywords = ["fastapi", "rate-limit", "cors", "khipu", "szl", "doctrine-v11"]
dependencies = [
  "starlette>=0.37.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27", "fastapi>=0.111"]

[tool.setuptools.packages.find]
where = ["src"]
