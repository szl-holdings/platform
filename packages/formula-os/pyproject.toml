[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-formula-os"
version = "0.1.0"
description = "Formula-OS: registry, evaluator, numeric harness, prover bridge, citation tracker for SZL math corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen P. Lutar / SZL Holdings", email = "yachay@szlholdings.dev" }]
keywords = ["szl", "doctrine-v11", "formula-os"]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/platform"

[tool.setuptools]
packages = ["formula_os"]

