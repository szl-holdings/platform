version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/apps/*"
      - "/apps/substrate-inference/engine/*"
      - "/packages/*"
      - "/scripts/*"
      - "/services/*"
      - "/substrate"
      - "/workers/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/apps/*"
      - "/artifacts/*"
      - "/services/*"
      - "/workers/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns:
          - "*"

  # npm / Node dependencies
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/artifacts/*"
      - "/lib/*"
      - "/lib/services/connectors/*"
      - "/packages/*"
      - "/scripts"
      - "/services/*"
      - "/services/vsp-otel/stubs/*"
      - "/workers/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns:
          - "*"
