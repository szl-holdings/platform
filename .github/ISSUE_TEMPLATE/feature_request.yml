name: Feature Request
description: Suggest a capability improvement or new feature for the SZL Holdings platform
title: "[FEATURE] "
labels:
  - enhancement
assignees:
  - stephenlutar2-hash
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Platform / Component
      description: Which platform or component would this feature affect?
      multiple: true
      options:
        - Lyte — Business Observability
        - Aegis — Defense & Intelligence
        - Terra — Real Estate Intelligence
        - Vessels — Maritime Intelligence
        - PRISM Counsel — Legal Command
        - Carlota Jo — Advisory
        - IMPERIUM — Cloud Sovereignty
        - Command Portal — Ecosystem Hub
        - SZL Holdings — Corporate
        - CORTEX — Mobile Command
        - Stephen Lutar — Founder Site
        - API Server / Shared Infrastructure
        - New platform / vertical
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical — Blocking a key use case
        - High — Significant operational impact
        - Medium — Meaningful improvement
        - Low — Nice-to-have or polish
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe the operational need.
      placeholder: As a [role], I need to [capability] because [reason]...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see built. Be as specific as you can.
      placeholder: The feature should allow...
    validations:
      required: true

  - type: input
    id: user-role
    attributes:
      label: User / Role Context
      description: Who would benefit from this feature? What role are they in?
      placeholder: e.g., Portfolio analyst, Executive, Operator
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or alternative approaches exist today?
      placeholder: Currently, the workaround is to...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Architecture notes, design sketches, external references, or related issues.
    validations:
      required: false
