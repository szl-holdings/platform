# SPDX-License-Identifier: Apache-2.0
name: Fold Vessels health probe into Killinchu once

"on":
  push:
    branches: [fix/vessels-folded-health-probe-20260904]
    paths:
      - scripts/apply_folded_vessels_probe.py
      - .github/workflows/zz-fold-vessels-health-probe-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fold-vessels-health-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Require exact branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/vessels-folded-health-probe-20260904
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply the exact folded-capability migration
        run: python3 scripts/apply_folded_vessels_probe.py

      - name: Prove controller, issue lifecycle, and Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/warm_flagships.py \
            .github/scripts/test_warm_flagships.py \
            packages/edge-organs/edge_organs/wasi_rikuq.py
          python3 .github/scripts/test_warm_flagships.py
          python3 .github/scripts/warm_flagships.py \
            --organ vessels \
            --attempts 3 \
            --confirmations 2 \
            --timeout 25 \
            --interval 1 \
            --report /tmp/vessels-folded-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/vessels-folded-health.json').read_text())
          assert report['probe_url'] == 'https://szlholdings-killinchu.hf.space/api/vessels/healthz'
          assert report['state'] == 'HEALTHY', report
          assert [row['http_status'] for row in report['attempts']].count(200) >= 2
          print('live folded Vessels capability health: PASS')
          PY
          git diff --check

      - name: Commit durable repair and remove one-shot controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/warm_flagships.py \
            .github/scripts/test_warm_flagships.py \
            packages/edge-organs/edge_organs/wasi_rikuq.py
          git add -f .github/workflows/warm-flagships.yml
          git rm scripts/apply_folded_vessels_probe.py
          git rm -f .github/workflows/zz-fold-vessels-health-probe-once.yml
          git diff --cached --check
          git commit --signoff -m "fix(platform): probe Vessels through Killinchu"
          git push origin "HEAD:${GITHUB_REF_NAME}"
