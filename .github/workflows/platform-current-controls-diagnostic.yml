name: Platform Final Controls — Bounded Verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/platform-current-controls-diagnostic.yml
      - artifacts/vessels/Dockerfile
      - .gitleaksignore
      - scripts/check-clean-clone.mjs
      - .github/workflows/update-lockfile-vite.yml
      - .github/workflows/forge-hf-activate.yml
      - replit-sync/forge_hf_activate.py
      - replit-sync/README_FORGE_HF_ACTIVATE.md

permissions:
  contents: read

concurrency:
  group: platform-final-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-controls:
    name: Security, truth, and retirement controls
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Execute current dependency and secret controls
        run: |
          set -euo pipefail
          mkdir -p reports/platform-final-controls

          set +e
          pnpm audit --audit-level high --json \
            > reports/platform-final-controls/pnpm-audit.json 2>&1
          audit_exit=$?
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('reports/platform-final-controls/pnpm-audit.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          vulnerabilities = payload.get('metadata', {}).get('vulnerabilities', {})
          summary = {
              severity: int(vulnerabilities.get(severity, 0) or 0)
              for severity in ('critical', 'high', 'moderate', 'low')
          }
          Path('reports/platform-final-controls/pnpm-audit-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if summary['critical'] or summary['high']:
              raise SystemExit('Critical or High dependency vulnerability remains')
          PY
          echo "pnpm audit transport exit: $audit_exit; parsed Critical/High gate passed"

          pnpm run security:vuln \
            > reports/platform-final-controls/vulnerability-report.log 2>&1
          cp security/vuln-report.md \
            reports/platform-final-controls/vuln-report.md

          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path reports/platform-final-controls/current-tree-gitleaks.json \
            > reports/platform-final-controls/current-tree-gitleaks.log 2>&1
      - name: Prove retired one-shots remain absent
        run: node scripts/check-clean-clone.mjs
      - name: Regenerate deterministic local and remote truth
        run: |
          set -euo pipefail
          pnpm truth:generate -- --verify-local
          pnpm truth:generate -- --verify-local --verify-remote
          pnpm claims:validate
          pnpm claims:drift
          node tools/truth/check-claims.ts --base "${{ github.event.pull_request.base.sha }}"
          cp artifacts/SOURCE_OF_TRUTH.json \
            reports/platform-final-controls/SOURCE_OF_TRUTH.json
          git diff -- artifacts/SOURCE_OF_TRUTH.json \
            > reports/platform-final-controls/source-of-truth.diff || true
      - name: Upload immutable source-control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-final-source-controls-${{ github.run_id }}
          path: reports/platform-final-controls
          if-no-files-found: error
          retention-days: 30

  vessels-image:
    name: Build and exercise the Vessels image without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build exact current image
        run: |
          set -euo pipefail
          mkdir -p reports/platform-final-controls
          docker build \
            --file artifacts/vessels/Dockerfile \
            --tag vessels-final-controls:${GITHUB_SHA} \
            . 2>&1 | tee reports/platform-final-controls/vessels-build.log
      - name: Inspect and exercise the local image
        run: |
          set -euo pipefail
          image="vessels-final-controls:${GITHUB_SHA}"
          docker image inspect "$image" \
            > reports/platform-final-controls/vessels-image-inspect.json
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 "$image")"
          echo "$container_id" > reports/platform-final-controls/container-id.txt
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/healthz \
              > reports/platform-final-controls/healthz.txt; then
              break
            fi
            sleep 1
          done
          test "$(cat reports/platform-final-controls/healthz.txt)" = 'ok'
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/ \
            > reports/platform-final-controls/index.html
          grep -qi '<!doctype html' reports/platform-final-controls/index.html
          docker logs "$container_id" \
            > reports/platform-final-controls/vessels-container.log 2>&1 || true
      - name: Upload immutable image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-final-vessels-${{ github.run_id }}
          path: reports/platform-final-controls
          if-no-files-found: error
          retention-days: 30
