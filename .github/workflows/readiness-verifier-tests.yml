name: Readiness verifier tests

on:
  push:
    branches: [main]
    paths:
      - 'platform/agents/readiness/**'
      - '.github/workflows/readiness-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platform/agents/readiness/**'
      - '.github/workflows/readiness-*.yml'

permissions:
  contents: read

concurrency:
  group: readiness-verifier-tests-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  offline:
    name: Readiness verifier (Python ${{ matrix.python }})
    # Standard hosted runners are free for this public repository. No storage
    # uploads, cache, credentials, deployment, or readiness publication steps.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the stdlib-only fleet contract
        run: python -B -S -m unittest discover -s platform/agents/readiness/_lib -p 'test_*.py'
      - name: Install the tested crypto dependency
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: pynacl==1.6.2
      - name: Require real Ed25519 verification
        run: python -B -c "from nacl.signing import SigningKey, VerifyKey"
      - name: Verify the fleet contract including Ed25519 regressions
        run: python -B -m unittest discover -s platform/agents/readiness/_lib -p 'test_*.py' -v
