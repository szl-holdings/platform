name: Security Audit & SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency vulnerability scan and generate SBOM
        id: sbom
        run: node scripts/qa/generate-sbom.js
        env:
          NODE_ENV: production

      - name: Generate vulnerability report from pnpm audit
        if: always()
        run: node scripts/qa/generate-vuln-report.js

      - name: Upload SBOM and vulnerability report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-${{ github.run_id }}
          path: |
            security/sbom-latest.json
            security/vuln-report.md
          retention-days: 90

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for PR diff scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks — detect committed secrets
        run: |
          # On a pull_request event scan only the commits in the PR; on push/schedule
          # scan the entire current HEAD tree.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --redact \
              --verbose \
              --exit-code 1
          else
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1
          fi

      - name: Secondary scan — project-specific patterns (belt-and-suspenders)
        run: node scripts/qa/scan-secrets.js .
        env:
          NODE_ENV: ci

  lockfile-integrity:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Verify lockfile is up to date
        run: pnpm install --frozen-lockfile --dry-run

  license-report:
    name: License Compliance Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate license compliance report
        run: node scripts/qa/generate-license-report.js

      - name: Upload license report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: license-report-${{ github.run_id }}
          path: security/license-report.md
          retention-days: 90

  security-tests:
    name: Security Tests (api-server vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run api-server security test suite
        run: pnpm --filter @workspace/api-server test
        env:
          NODE_ENV: test

  security-gate:
    name: Security Gate (blocking)
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, lockfile-integrity, license-report, security-tests]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all security jobs passed
        run: |
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.lockfile-integrity.result }}" != "success" ]] || \
             [[ "${{ needs.license-report.result }}" != "success" ]] || \
             [[ "${{ needs.security-tests.result }}" != "success" ]]; then
            echo "One or more security checks failed:"
            echo "  dependency-scan: ${{ needs.dependency-scan.result }}"
            echo "  secret-scan: ${{ needs.secret-scan.result }}"
            echo "  lockfile-integrity: ${{ needs.lockfile-integrity.result }}"
            echo "  license-report: ${{ needs.license-report.result }}"
            echo "  security-tests: ${{ needs.security-tests.result }}"
            exit 1
          fi
          echo "All security checks passed"
