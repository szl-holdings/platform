name: Security Audit & SBOM

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Verify fflate dependency convergence
        run: |
          node --test scripts/qa/check-fflate-resolution.test.mjs
          pnpm run security:fflate

      - name: Run dependency vulnerability scan and generate SBOM
        id: sbom
        run: |
          node --test scripts/qa/generate-sbom.test.mjs
          node scripts/qa/generate-sbom.js
        env:
          NODE_ENV: production

      - name: Initialize current-run vulnerability failure artifact
        id: vulnerability-preflight
        if: always()
        run: node scripts/qa/write-vuln-preflight-report.mjs

      - name: Generate vulnerability report from pnpm audit
        if: always() && steps.vulnerability-preflight.outcome == 'success'
        run: |
          node --test scripts/qa/generate-vuln-report.test.js scripts/qa/dependency-patches.test.mjs scripts/qa/third-party-licenses.test.mjs
          node scripts/qa/generate-vuln-report.js

      - name: Upload current-run SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.sbom.outcome == 'success'
        with:
          name: sbom-${{ github.run_id }}
          path: security/sbom-latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload current-run vulnerability report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.vulnerability-preflight.outcome == 'success'
        with:
          name: vulnerability-report-${{ github.run_id }}
          path: security/vuln-report.md
          if-no-files-found: error
          retention-days: 90

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for PR diff scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          GITLEAKS_PATH="${RUNNER_TEMP}/${GITLEAKS_ARCHIVE}"

          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "${GITLEAKS_PATH}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${GITLEAKS_PATH}" | sha256sum --check --strict
          tar -xzf "${GITLEAKS_PATH}" -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "${GITLEAKS_VERSION}"

      - name: Run Gitleaks — detect committed secrets

        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node --test scripts/ci/report-gitleaks-findings.test.mjs
          report_path="$RUNNER_TEMP/gitleaks-redacted.json"
          safe_report_path="$RUNNER_TEMP/gitleaks-findings-metadata.json"
          scan_args=(detect --source . --config .gitleaks.toml --redact --exit-code 1
            --report-format json --report-path "$report_path")
          # PR and explicit candidate runs scan their changes; default-branch,
          # push, and scheduled runs retain the historical scan.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scan_args+=(--log-opts "$PR_BASE_SHA..$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            # An explicit candidate run checks its changes against the protected
            # default branch. Default-branch and scheduled runs retain the full
            # historical scan below.
            candidate_base="$(git rev-parse "origin/$DEFAULT_BRANCH^{commit}")"
            scan_args+=(--log-opts "$candidate_base..HEAD")
          fi
          scan_status=0
          gitleaks "${scan_args[@]}" || scan_status=$?
          node scripts/ci/report-gitleaks-findings.mjs "$report_path" "$safe_report_path"
          exit "$scan_status"

      - name: Upload safe Gitleaks finding metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-findings-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Secondary scan — project-specific patterns (belt-and-suspenders)
        run: |
          node --test scripts/qa/scan-secrets.test.js
          node scripts/qa/scan-secrets.js .
        env:
          NODE_ENV: ci

  lockfile-integrity:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Verify lockfile is up to date
        run: pnpm install --frozen-lockfile --lockfile-only

  license-report:
    name: License Compliance Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Initialize current-run license failure artifact
        id: license-preflight
        if: always()
        run: node scripts/qa/write-license-preflight-report.mjs

      - name: Generate license compliance report
        if: always() && steps.license-preflight.outcome == 'success'
        run: |
          node --test scripts/qa/third-party-licenses.test.mjs scripts/ci/release-security-workflows.test.mjs
          node scripts/qa/generate-license-report.js

      - name: Upload license report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.license-preflight.outcome == 'success'
        with:
          name: license-report-${{ github.run_id }}
          path: security/license-report.md
          if-no-files-found: error
          retention-days: 90

  security-gate:
    name: Security Gate (blocking)
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, lockfile-integrity, license-report]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all security jobs passed
        run: |
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.lockfile-integrity.result }}" != "success" ]] || \
             [[ "${{ needs.license-report.result }}" != "success" ]]; then
            echo "One or more security checks failed:"
            echo "  dependency-scan: ${{ needs.dependency-scan.result }}"
            echo "  secret-scan: ${{ needs.secret-scan.result }}"
            echo "  lockfile-integrity: ${{ needs.lockfile-integrity.result }}"
            echo "  license-report: ${{ needs.license-report.result }}"
            exit 1
          fi
          echo "All security checks passed"
