name: Security Audit & SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency vulnerability scan and generate SBOM
        id: sbom
        run: node scripts/qa/generate-sbom.js
        env:
          NODE_ENV: production

      - name: Generate vulnerability report from pnpm audit
        if: always()
        run: node scripts/qa/generate-vuln-report.js

      - name: Upload SBOM and vulnerability report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-${{ github.run_id }}
          path: |
            security/sbom-latest.json
            security/vuln-report.md
          retention-days: 90

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for PR diff scan)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks — detect committed secrets

        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On a pull_request event scan only the commits in the PR; on push/schedule
          # scan the entire current HEAD tree.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts "$PR_BASE_SHA..$PR_HEAD_SHA" \
              --redact \
              --verbose \
              --exit-code 1
          else
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1
          fi

      - name: Secondary scan — project-specific patterns (belt-and-suspenders)
        run: node scripts/qa/scan-secrets.js .
        env:
          NODE_ENV: ci

  lockfile-integrity:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Verify lockfile is up to date
        run: pnpm install --frozen-lockfile --lockfile-only

  license-report:
    name: License Compliance Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate license compliance report
        run: node scripts/qa/generate-license-report.js

      - name: Upload license report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-report-${{ github.run_id }}
          path: security/license-report.md
          retention-days: 90

  security-gate:
    name: Security Gate (blocking)
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, lockfile-integrity, license-report]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all security jobs passed
        run: |
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.lockfile-integrity.result }}" != "success" ]] || \
             [[ "${{ needs.license-report.result }}" != "success" ]]; then
            echo "One or more security checks failed:"
            echo "  dependency-scan: ${{ needs.dependency-scan.result }}"
            echo "  secret-scan: ${{ needs.secret-scan.result }}"
            echo "  lockfile-integrity: ${{ needs.lockfile-integrity.result }}"
            echo "  license-report: ${{ needs.license-report.result }}"
            exit 1
          fi
          echo "All security checks passed"
