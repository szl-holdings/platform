name: Commitlint

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate PR commit messages
        run: |
          # On pull_request events, lint only PR commits.
          # On workflow_dispatch (manual), lint just the most recent commit
          # so we don't fail on pre-existing history outside our control.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to   "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          fi
