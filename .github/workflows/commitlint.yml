name: Commitlint

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate PR commit messages
        run: |
          # On pull_request events, lint only PR commits.
          # On workflow_dispatch (manual), lint just the most recent commit
          # so we don't fail on pre-existing history outside our control.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to   "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          fi
