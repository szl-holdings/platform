name: Commitlint

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate PR commit messages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On pull_request events, lint only PR commits.
          # On workflow_dispatch (manual), lint just the most recent commit
          # so we don't fail on pre-existing history outside our control.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint \
              --from "$PR_BASE_SHA" \
              --to   "$PR_HEAD_SHA" \
              --verbose
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          fi
