name: Commitlint

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate PR commit messages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On pull_request events, lint only PR commits.
          # On workflow_dispatch (manual), lint just the most recent commit
          # so we don't fail on pre-existing history outside our control.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint \
              --from "$PR_BASE_SHA" \
              --to   "$PR_HEAD_SHA" \
              --verbose
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          fi
