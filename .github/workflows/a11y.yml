name: Accessibility Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-axe:
    name: A11y axe / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: szl-holdings
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist
            port: 4100
          - name: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist
            port: 4102
          - name: command
            filter: "@workspace/command"
            dist: artifacts/command/dist
            port: 4103
          - name: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist
            port: 4104
          - name: lyte-command-center
            filter: "@workspace/lyte-command-center"
            dist: artifacts/lyte-command-center/dist
            port: 4105
          - name: pulse
            filter: "@workspace/pulse"
            dist: artifacts/pulse/dist
            port: 4106
          - name: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist
            port: 4107
          - name: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist
            port: 4108
          - name: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist
            port: 4109
          - name: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist
            port: 4110
          - name: conduit
            filter: "@workspace/conduit"
            dist: artifacts/conduit/dist
            port: 4111
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build

      - name: Install static file server
        run: npm install -g serve

      - name: Serve ${{ matrix.app.name }} (SPA fallback) on port ${{ matrix.app.port }}
        run: |
          serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} --single &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 15); do
            if curl -sf http://localhost:${{ matrix.app.port }}/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
        shell: bash

      - name: Run axe accessibility scan (WCAG 2.1 AA)
        run: |
          echo "Running axe-core accessibility scan for ${{ matrix.app.name }}..."
          PLAYWRIGHT_BASE_URL=http://localhost:${{ matrix.app.port }} \
          A11Y_ARTIFACT_NAME=${{ matrix.app.name }} \
          pnpm exec playwright test tests/e2e/a11y.spec.ts \
            --grep "Per-Artifact Root Page" \
            --reporter=list \
            --project=chromium || {
              echo "::error::axe violations found in ${{ matrix.app.name }} — see output above."
              echo "Review audit/a11y/findings.md for documented findings and remediation owners."
              exit 1
            }
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.app.port }}
          A11Y_ARTIFACT_NAME: ${{ matrix.app.name }}

      - name: Upload axe results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a11y-${{ matrix.app.name }}
          path: playwright-report/
          retention-days: 14

  a11y-gate:
    name: A11y Gate
    needs: a11y-axe
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce a11y gate
        run: |
          echo "Accessibility gate — WCAG 2.1 AA (wcag2a, wcag2aa, wcag21a, wcag21aa)"
          echo "Tool: @axe-core/playwright — 11 CI-scanned web artifacts (+ aegis via live-proxy only)."
          echo "See audit/a11y/findings.md for the findings register."
          if [[ "${{ needs.a11y-axe.result }}" == "failure" ]]; then
            echo "::error::One or more axe scans failed — zero critical/serious violations required."
            exit 1
          fi
          echo "All axe scans passed."
