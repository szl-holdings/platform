name: Accessibility Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  a11y-axe:
    name: A11y axe / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 4102
          - name: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist/public
            port: 4104
          - name: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist/public
            port: 4107
          - name: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist/public
            port: 4108
          - name: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist/public
            port: 4109
          - name: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist/public
            port: 4110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build
        env:
          # The isolated static server mounts each artifact at `/`. Override the
          # production subpath so every emitted asset URL is reachable here.
          BASE_PATH: /

      - name: Serve ${{ matrix.app.name }} (SPA fallback) on port ${{ matrix.app.port }}
        run: |
          set -euo pipefail
          index_file="${{ matrix.app.dist }}/index.html"
          response_file="/tmp/a11y-${{ matrix.app.name }}-index.html"
          asset_file="/tmp/a11y-${{ matrix.app.name }}-asset.js"
          asset_headers="/tmp/a11y-${{ matrix.app.name }}-asset.headers"

          if [[ ! -s "$index_file" ]]; then
            echo "::error::Missing non-empty Vite app shell: $index_file"
            exit 1
          fi
          if ! grep -Fq '<div id="root"></div>' "$index_file"; then
            echo "::error::Built index is missing the expected React app shell: $index_file"
            exit 1
          fi

          asset_path="$(sed -n 's/.*<script type="module"[^>]*src="\([^"]*\.js\)".*/\1/p' "$index_file" | head -n 1)"
          if [[ ! "$asset_path" =~ ^/[^[:space:]]+\.js$ ]]; then
            echo "::error::Built index does not reference a root-served JavaScript entry asset."
            exit 1
          fi
          asset_source_file="${{ matrix.app.dist }}${asset_path}"
          if [[ ! -s "$asset_source_file" ]]; then
            echo "::error::Referenced JavaScript entry asset is missing or empty: $asset_source_file"
            exit 1
          fi

          pnpm exec serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} --single &
          echo $! > /tmp/serve.pid
          ready=false
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error \
                "http://localhost:${{ matrix.app.port }}/" \
                --output "$response_file" \
              && cmp --silent "$index_file" "$response_file" \
              && curl --fail --silent --show-error \
                --dump-header "$asset_headers" \
                "http://localhost:${{ matrix.app.port }}${asset_path}" \
                --output "$asset_file" \
              && [[ -s "$asset_file" ]] \
              && cmp --silent "$asset_source_file" "$asset_file" \
              && grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' "$asset_headers"; then
              ready=true
              echo "App shell and JavaScript entry asset ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Static server did not return the built app shell and JavaScript entry asset."
            exit 1
          fi
        shell: bash

      - name: Run axe accessibility scan (WCAG 2.1 AA)
        run: |
          echo "Running axe-core accessibility scan for ${{ matrix.app.name }}..."
          PLAYWRIGHT_BASE_URL=http://localhost:${{ matrix.app.port }} \
          A11Y_ARTIFACT_NAME=${{ matrix.app.name }} \
          pnpm exec playwright test tests/e2e/a11y.spec.ts \
            --grep "Per-Artifact Root Page" \
            --reporter=list \
            --project=chromium || {
              echo "::error::axe violations found in ${{ matrix.app.name }} — see output above."
              echo "Review audit/a11y/findings.md for documented findings and remediation owners."
              exit 1
            }
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.app.port }}
          A11Y_ARTIFACT_NAME: ${{ matrix.app.name }}

      - name: Upload axe results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-${{ matrix.app.name }}
          path: playwright-report/
          retention-days: 14

  a11y-gate:
    name: A11y Gate
    needs: a11y-axe
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce a11y gate
        run: |
          result="${{ needs.a11y-axe.result }}"

          echo "Accessibility gate — WCAG 2.1 AA (wcag2a, wcag2aa, wcag21a, wcag21aa)"
          echo "Tool: @axe-core/playwright — 6 CI-scanned web artifacts."
          echo "See audit/a11y/findings.md for the findings register."

          case "$result" in
            success)
              echo "All axe matrix jobs completed and passed."
              ;;
            failure)
              echo "::error::One or more axe matrix jobs failed. Inspect the per-artifact install, build, serve, browser, and scan steps."
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Accessibility evidence is incomplete because the axe matrix was $result."
              exit 1
              ;;
            *)
              echo "::error::Unexpected axe matrix result: $result."
              exit 1
              ;;
          esac
