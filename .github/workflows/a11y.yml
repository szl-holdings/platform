name: Accessibility Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  a11y-axe:
    name: A11y axe / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist
            port: 4102
          - name: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist
            port: 4104
          - name: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist
            port: 4107
          - name: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist
            port: 4108
          - name: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist
            port: 4109
          - name: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist
            port: 4110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build

      - name: Install static file server
        run: npm install -g serve

      - name: Serve ${{ matrix.app.name }} (SPA fallback) on port ${{ matrix.app.port }}
        run: |
          serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} --single &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 15); do
            if curl -sf http://localhost:${{ matrix.app.port }}/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
        shell: bash

      - name: Run axe accessibility scan (WCAG 2.1 AA)
        run: |
          echo "Running axe-core accessibility scan for ${{ matrix.app.name }}..."
          PLAYWRIGHT_BASE_URL=http://localhost:${{ matrix.app.port }} \
          A11Y_ARTIFACT_NAME=${{ matrix.app.name }} \
          pnpm exec playwright test tests/e2e/a11y.spec.ts \
            --grep "Per-Artifact Root Page" \
            --reporter=list \
            --project=chromium || {
              echo "::error::axe violations found in ${{ matrix.app.name }} — see output above."
              echo "Review audit/a11y/findings.md for documented findings and remediation owners."
              exit 1
            }
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.app.port }}
          A11Y_ARTIFACT_NAME: ${{ matrix.app.name }}

      - name: Upload axe results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-${{ matrix.app.name }}
          path: playwright-report/
          retention-days: 14

  a11y-gate:
    name: A11y Gate
    needs: a11y-axe
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce a11y gate
        run: |
          echo "Accessibility gate — WCAG 2.1 AA (wcag2a, wcag2aa, wcag21a, wcag21aa)"
          echo "Tool: @axe-core/playwright — 6 CI-scanned web artifacts."
          echo "See audit/a11y/findings.md for the findings register."
          if [[ "${{ needs.a11y-axe.result }}" == "failure" ]]; then
            echo "::error::One or more axe scans failed — zero critical/serious violations required."
            exit 1
          fi
          echo "All axe scans passed."
