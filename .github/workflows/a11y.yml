name: Accessibility Checks (advisory)

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-axe:
    name: A11y axe / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: szl-holdings
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist
            port: 4100
          - name: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist
            port: 4102
          - name: command
            filter: "@workspace/command"
            dist: artifacts/command/dist
            port: 4103
          - name: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist
            port: 4104
          - name: lyte-command-center
            filter: "@workspace/lyte-command-center"
            dist: artifacts/lyte-command-center/dist
            port: 4105
          - name: pulse
            filter: "@workspace/pulse"
            dist: artifacts/pulse/dist
            port: 4106
          - name: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist
            port: 4107
          - name: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist
            port: 4108
          - name: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist
            port: 4109
          - name: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist
            port: 4110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build

      - name: Install static file server
        run: npm install -g serve

      - name: Serve ${{ matrix.app.name }} (SPA fallback) on port ${{ matrix.app.port }}
        run: |
          serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} --single &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 15); do
            if curl -sf http://localhost:${{ matrix.app.port }}/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
        shell: bash

      - name: Run axe accessibility scan (WCAG 2.1 AA, advisory)
        run: |
          echo "Running axe-core accessibility scan for ${{ matrix.app.name }}..."
          PLAYWRIGHT_BASE_URL=http://localhost:${{ matrix.app.port }} \
          A11Y_ARTIFACT_NAME=${{ matrix.app.name }} \
          pnpm exec playwright test tests/e2e/a11y.spec.ts \
            --grep "Per-Artifact Root Page" \
            --reporter=list \
            --project=chromium || {
              echo "::warning::axe violations found in ${{ matrix.app.name }} — see output above."
              echo "Review audit/a11y/findings.md for documented findings and remediation owners."
              exit 0
            }
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.app.port }}
          A11Y_ARTIFACT_NAME: ${{ matrix.app.name }}

      - name: Upload axe results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a11y-${{ matrix.app.name }}
          path: playwright-report/
          retention-days: 14

  a11y-gate:
    name: A11y Gate (advisory)
    needs: a11y-axe
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Report a11y advisory status
        run: |
          echo "Accessibility checks completed (advisory — not a hard gate)."
          echo "Tool: @axe-core/playwright — WCAG 2.1 AA tags (wcag2a, wcag2aa, wcag21a, wcag21aa)"
          echo "See audit/a11y/findings.md for the full findings register and remediation owners."
          echo ""
          echo "To flip to hard-fail:"
          echo "  1. Remove 'continue-on-error: true' from the a11y-axe and a11y-gate jobs."
          echo "  2. Change 'exit 0' to 'exit 1' in the scan step."
          echo "  3. Add 'a11y-gate' to the ci-gate needs list in .github/workflows/ci.yml."
          if [[ "${{ needs.a11y-axe.result }}" == "failure" ]]; then
            echo "::warning::One or more axe jobs failed — check uploaded playwright-report artifacts."
          fi
