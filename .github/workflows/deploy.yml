name: Deploy (Deprecated)
# DEPRECATED — this workflow has been superseded by:
#   deploy-staging.yml  — auto-deploys to staging on push to main
#   deploy-production.yml — deploys to production via release or manual approval
#
# This file is kept only for historical reference and will not execute any deployment.
# DO NOT re-enable triggers here; use the split workflows instead.

on:
  workflow_dispatch:
    inputs:
      confirm_deprecated:
        description: 'This workflow is deprecated. Use deploy-staging.yml or deploy-production.yml instead.'
        required: true
        default: 'cancel'
        type: choice
        options:
          - cancel

permissions:
  contents: read

jobs:
  deprecated-notice:
    name: Workflow Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::error::This workflow (deploy.yml) is deprecated and has been replaced."
          echo "::notice::For staging deployment: deploy-staging.yml triggers automatically on push to main."
          echo "::notice::For production deployment: use deploy-production.yml (manual dispatch or via published release)."
          exit 1
