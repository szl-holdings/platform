name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Replit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Replit deployment
        env:
          REPLIT_DEPLOY_TOKEN: ${{ secrets.REPLIT_DEPLOY_TOKEN }}
          REPLIT_APP_ID: ${{ secrets.REPLIT_APP_ID }}
        run: |
          if [ -z "$REPLIT_DEPLOY_TOKEN" ] || [ -z "$REPLIT_APP_ID" ]; then
            echo "REPLIT_DEPLOY_TOKEN or REPLIT_APP_ID not configured — skipping deploy trigger."
            echo "Set these secrets in your GitHub repository settings to enable auto-deploy."
            exit 0
          fi

          echo "Triggering Replit deployment for app: $REPLIT_APP_ID"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://replit.com/api/v0/repls/${REPLIT_APP_ID}/deployments" \
            -H "Authorization: Bearer ${REPLIT_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"production"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "Response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deployment triggered successfully (HTTP $http_code)"
          else
            echo "Deployment trigger failed (HTTP $http_code)"
            exit 1
          fi
