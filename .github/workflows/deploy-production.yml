name: Deploy — Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or SHA). Defaults to latest release tag.'
        required: false
        default: ''
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  validate-dispatch:
    name: Validate Manual Dispatch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Require confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Production deployment requires confirmation. Set the 'confirm' input to 'deploy'."
            exit 1
          fi
          echo "Deployment confirmed by ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [validate-dispatch]
    if: |
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && needs.validate-dispatch.result == 'success'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine deploy info
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "Triggered by release: ${{ github.event.release.tag_name }}"
            echo "Release URL: ${{ github.event.release.html_url }}"
          else
            echo "Triggered manually by ${{ github.actor }}"
            echo "Ref: ${{ inputs.ref || github.ref }}"
          fi

      - name: Verify production configuration
        id: verify
        run: |
          if [ -z "${{ secrets.REPLIT_DEPLOY_TOKEN }}" ]; then
            echo "::warning::REPLIT_DEPLOY_TOKEN not configured — production deployment skipped"
            echo "Configure this secret in Settings → Environments → production"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production deployment configuration verified"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production deployment
        if: steps.verify.outputs.skip != 'true'
        run: |
          echo "Triggering Replit production deployment..."
          REPLIT_APP_ID="${{ secrets.REPLIT_APP_ID }}"
          REPLIT_DEPLOY_TOKEN="${{ secrets.REPLIT_DEPLOY_TOKEN }}"

          if [ -n "$REPLIT_APP_ID" ] && [ -n "$REPLIT_DEPLOY_TOKEN" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $REPLIT_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              "https://replit.com/api/v1/repls/$REPLIT_APP_ID/deployments" \
              2>/dev/null || echo "000")

            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "Production deployment triggered successfully (HTTP $RESPONSE)"
            elif [ "$RESPONSE" = "000" ]; then
              echo "::warning::Could not reach Replit API — production deployment may need to be triggered manually"
            else
              echo "::error::Replit production deployment API returned HTTP $RESPONSE"
              exit 1
            fi
          else
            echo "::warning::REPLIT_APP_ID not configured — production deployment skipped"
            echo "To enable automated production deployment, set REPLIT_APP_ID and REPLIT_DEPLOY_TOKEN"
            echo "in Settings → Environments → production"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Production Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "- **Trigger:** Release ${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Trigger:** Manual dispatch by ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Ref:** ${{ inputs.ref || github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Environment:** production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To configure production deployment secrets, see Settings → Environments → production." >> "$GITHUB_STEP_SUMMARY"
