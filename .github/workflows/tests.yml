name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'replit-sync/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install dependencies (skip ONNXRuntime download to avoid postinstall network flake)
        run: |
          ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm run test

  fuzz:
    name: Property fuzz (fast-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - amaru-runtime
          - ouroboros-verifier
          - sentra-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install dependencies (skip ONNXRuntime download to avoid postinstall network flake)
        run: |
          ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile
      - name: Run fast-check property tests for ${{ matrix.pkg }}
        run: pnpm --filter ./packages/${{ matrix.pkg }} run test
