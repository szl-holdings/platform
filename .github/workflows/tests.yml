name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'replit-sync/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  readiness:
    name: Readiness evidence (Python ${{ matrix.python }}, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run readiness regression tests without external services
        run: python -m unittest discover -s platform/agents/readiness/_lib -p 'test_*.py'

  python-workers:
    name: Python worker CPU contracts (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/services/substrate-py-workers/src
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Match the worker Dockerfile's Python minor version. Install the base
      # requirements only; model/GPU extras and OCR system binaries are absent.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/substrate-py-workers/requirements.txt
      - name: Install Python worker test dependencies
        run: python -m pip install --disable-pip-version-check -r services/substrate-py-workers/requirements.txt
      - name: Run full Python worker CPU suite and record skips
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest services/substrate-py-workers/tests -q -ra \
            --junitxml=python-worker-tests.xml 2>&1 | tee python-worker-tests.log
      - name: Upload Python worker test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-worker-tests-${{ github.run_id }}
          path: |
            python-worker-tests.xml
            python-worker-tests.log
          retention-days: 30

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install dependencies (skip ONNXRuntime download to avoid postinstall network flake)
        run: |
          ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm run test

  fuzz:
    name: Property fuzz (fast-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - amaru-runtime
          - ouroboros-verifier
          - sentra-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install dependencies (skip ONNXRuntime download to avoid postinstall network flake)
        run: |
          ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile
      - name: Run fast-check property tests for ${{ matrix.pkg }}
        run: pnpm --filter ./packages/${{ matrix.pkg }} run test
