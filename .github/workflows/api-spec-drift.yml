name: API Spec Drift

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-spec-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-spec-drift:
    name: API Spec Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Statically scans all Express route files and compares against
      # lib/api-spec/openapi.yaml. Fails the build if any route file is
      # entirely absent from the spec or if the spec references paths that
      # have no corresponding route implementation (spec drift).
      # Fix by running `pnpm --filter @workspace/api-server run audit:openapi-routes`
      # locally and updating lib/api-spec/openapi.yaml accordingly.
      - name: Check API route files are reflected in OpenAPI spec
        run: pnpm --filter @workspace/api-server run audit:openapi-routes
