name: Exact-head screenshot evidence

on:
  pull_request:
    paths:
      - .github/workflows/exact-head-screenshot-evidence.yml
      - docs/standards/exact-head-screenshot-evidence.md
      - scripts/ci/capture-series-a-exact-head.mjs
      - scripts/ci/exact-head-screenshot-evidence.test.mjs
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate head SHA
        required: true
        type: string
      target_branch:
        description: Existing same-repository branch that must still point to candidate_sha
        required: true
        type: string
      source_pr:
        description: Pull request whose current same-repository head must equal candidate_sha
        required: true
        type: string
      route:
        description: Absolute A11oy application route to capture
        required: true
        default: /a11oy/
        type: string

permissions:
  contents: read

concurrency:
  group: exact-head-screenshot-evidence-${{ github.event_name }}-${{ inputs.source_pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contract:
    name: Capture contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate controller syntax and policy
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ci/capture-series-a-exact-head.mjs
          node --test scripts/ci/exact-head-screenshot-evidence.test.mjs
          grep -Fq 'GitHub-hosted ephemeral runner is the canonical default' docs/standards/exact-head-screenshot-evidence.md
          grep -Fq 'Copied screenshots' docs/standards/exact-head-screenshot-evidence.md
          grep -Fq 'source_sha' scripts/ci/capture-series-a-exact-head.mjs
          grep -Fq 'workflow_run_id' scripts/ci/capture-series-a-exact-head.mjs
          grep -Fq 'horizontal overflow' scripts/ci/capture-series-a-exact-head.mjs

  capture:
    name: Capture exact-head evidence package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.evidence_upload.outputs['artifact-id'] }}
      artifact_url: ${{ steps.evidence_upload.outputs['artifact-url'] }}
      artifact_digest: ${{ steps.evidence_upload.outputs['artifact-digest'] }}
    permissions:
      contents: read
      pull-requests: read
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_PR: ${{ inputs.source_pr }}
      CAPTURE_ROUTE: ${{ inputs.route }}
      SZL_CONTROLLER_ROOT: ${{ github.workspace }}/controller
      SZL_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      SZL_CANDIDATE_VIRTUAL_STORE: ${{ github.workspace }}/candidate/node_modules/.pnpm
      SZL_CANDIDATE_USER: szl-capture-candidate
    steps:
      - name: Bind runner-scoped paths
        shell: bash
        env:
          SZL_EVIDENCE_ROOT_VALUE: ${{ runner.temp }}/exact-head-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          SZL_CANDIDATE_HOME_VALUE: ${{ runner.temp }}/candidate-home-${{ github.run_id }}-${{ github.run_attempt }}
          SZL_CANDIDATE_CACHE_VALUE: ${{ runner.temp }}/candidate-home-${{ github.run_id }}-${{ github.run_attempt }}/cache
          SZL_CANDIDATE_STORE_VALUE: ${{ runner.temp }}/candidate-home-${{ github.run_id }}-${{ github.run_attempt }}/store
          SZL_PNPM_ROOT_VALUE: ${{ runner.temp }}/candidate-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
          SZL_DEPENDENCY_DIRS_MANIFEST_VALUE: ${{ runner.temp }}/candidate-dependency-dirs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for runner_path in \
            "$SZL_EVIDENCE_ROOT_VALUE" \
            "$SZL_CANDIDATE_HOME_VALUE" \
            "$SZL_CANDIDATE_CACHE_VALUE" \
            "$SZL_CANDIDATE_STORE_VALUE" \
            "$SZL_PNPM_ROOT_VALUE" \
            "$SZL_DEPENDENCY_DIRS_MANIFEST_VALUE"; do
            case "$runner_path" in
              "$RUNNER_TEMP"/*) ;;
              *)
                echo "runner-scoped path escaped RUNNER_TEMP: ${runner_path}" >&2
                exit 1
                ;;
            esac
          done
          {
            printf 'SZL_EVIDENCE_ROOT=%s\n' "$SZL_EVIDENCE_ROOT_VALUE"
            printf 'SZL_CANDIDATE_HOME=%s\n' "$SZL_CANDIDATE_HOME_VALUE"
            printf 'SZL_CANDIDATE_CACHE=%s\n' "$SZL_CANDIDATE_CACHE_VALUE"
            printf 'SZL_CANDIDATE_STORE=%s\n' "$SZL_CANDIDATE_STORE_VALUE"
            printf 'SZL_PNPM_ROOT=%s\n' "$SZL_PNPM_ROOT_VALUE"
            printf 'SZL_DEPENDENCY_DIRS_MANIFEST=%s\n' "$SZL_DEPENDENCY_DIRS_MANIFEST_VALUE"
          } >> "$GITHUB_ENV"

      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$TARGET_BRANCH" != -* ]]
          [[ "$TARGET_BRANCH" != *..* ]]
          [[ "$TARGET_BRANCH" != *//* ]]
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$CAPTURE_ROUTE" =~ ^/a11oy(/[A-Za-z0-9._~/-]*)?$ ]]
          [[ "$CAPTURE_ROUTE" != *..* ]]
          [[ "$CAPTURE_ROUTE" != *//* ]]

      - name: Checkout controller from immutable protected workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Verify authorized pull request and branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}")"
          pr_head="$(jq -er '.head.sha | strings' <<<"$pr_json")"
          pr_branch="$(jq -er '.head.ref | strings' <<<"$pr_json")"
          pr_repository="$(jq -er '.head.repo.full_name | strings' <<<"$pr_json")"
          pr_state="$(jq -er '.state | strings' <<<"$pr_json")"
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$pr_state" = open
          test "$pr_repository" = "$GITHUB_REPOSITORY"
          test "$pr_branch" = "$TARGET_BRANCH"
          test "$pr_head" = "$CANDIDATE_SHA"
          test "$branch_head" = "$CANDIDATE_SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Reject unsafe candidate Git entries before dependency resolution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          test -z "$tracked_status"
          unsafe_entries="$(git ls-files --stage | awk '$1 == "120000" || $1 == "160000" { print $4 }')"
          if [[ -n "$unsafe_entries" ]]; then
            echo "candidate contains a tracked symbolic link or submodule:" >&2
            printf '%s\n' "$unsafe_entries" >&2
            exit 1
          fi

      - name: Setup pnpm
        id: pnpm_setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          dest: ${{ runner.temp }}/candidate-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
          standalone: true
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            candidate/pnpm-lock.yaml
            controller/pnpm-lock.yaml

      - name: Admit candidate-readable pnpm runtime
        shell: bash
        env:
          SZL_PNPM_ACTION_DEST: ${{ steps.pnpm_setup.outputs.dest }}
          SZL_PNPM_ACTION_BIN_DEST: ${{ steps.pnpm_setup.outputs.bin_dest }}
        run: |
          set -euo pipefail
          test "$SZL_PNPM_ACTION_DEST" = "$SZL_PNPM_ROOT"
          case "$SZL_PNPM_ACTION_BIN_DEST" in
            "$SZL_PNPM_ROOT"/*) ;;
            *)
              echo "pnpm action binary directory escaped its runner-scoped root" >&2
              exit 1
              ;;
          esac
          pnpm_path="$SZL_PNPM_ACTION_BIN_DEST/pnpm"
          test "$(command -v pnpm)" = "$pnpm_path"
          test -x "$pnpm_path"
          resolved_root="$(realpath -e "$SZL_PNPM_ROOT")"
          resolved_pnpm="$(realpath -e "$pnpm_path")"
          case "$resolved_pnpm" in
            "$resolved_root"/*) ;;
            *)
              echo "pnpm executable resolved outside its runner-scoped root" >&2
              exit 1
              ;;
          esac
          chmod -R a+rX,go-w "$resolved_root"
          writable_entry="$(find "$resolved_root" ! -type l -perm /022 -print -quit)"
          test -z "$writable_entry"
          test -r "$resolved_pnpm"
          test -x "$resolved_pnpm"
          printf 'SZL_PNPM_EXECUTABLE=%s\n' "$pnpm_path" >> "$GITHUB_ENV"

      - name: Install and lock protected controller tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./controller/package.json').packageManager")" = pnpm@10.26.1
          test "$(command -v pnpm)" = "$SZL_PNPM_EXECUTABLE"
          "$SZL_PNPM_EXECUTABLE" --dir controller install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          "$SZL_PNPM_EXECUTABLE" --dir controller exec playwright install --with-deps chromium
          test "$(git -C "$SZL_CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          controller_status="$(git -C "$SZL_CONTROLLER_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$controller_status"
          chmod -R a-w "$SZL_CONTROLLER_ROOT"

      - name: Prepare isolated candidate dependency roots
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parse } from './controller/node_modules/yaml/dist/index.js';

          const workspace = parse(readFileSync('./candidate/pnpm-workspace.yaml', 'utf8'));
          if (!Array.isArray(workspace?.packages) || workspace.packages.length === 0) {
            throw new Error('candidate workspace must declare package patterns');
          }
          for (const rawPattern of workspace.packages) {
            if (typeof rawPattern !== 'string' || rawPattern.length === 0) {
              throw new Error('candidate workspace package patterns must be nonempty strings');
            }
            const pattern = rawPattern.startsWith('!') ? rawPattern.slice(1) : rawPattern;
            if (
              pattern.length === 0 ||
              pattern.startsWith('/') ||
              pattern.startsWith('~') ||
              pattern.includes('..') ||
              pattern.includes('\\') ||
              pattern.includes('\0')
            ) {
              throw new Error(`candidate workspace pattern escapes its checkout: ${rawPattern}`);
            }
          }
          NODE
          if id "$SZL_CANDIDATE_USER" >/dev/null 2>&1; then
            echo "candidate runtime identity already exists" >&2
            exit 1
          fi
          sudo useradd --system --no-create-home --home-dir /nonexistent \
            --shell /usr/sbin/nologin "$SZL_CANDIDATE_USER"
          candidate_group="$(id -gn "$SZL_CANDIDATE_USER")"
          sudo install -d -o "$SZL_CANDIDATE_USER" -g "$candidate_group" -m 0700 \
            "$SZL_CANDIDATE_HOME" \
            "$SZL_CANDIDATE_HOME/bin" \
            "$SZL_CANDIDATE_HOME/config" \
            "$SZL_CANDIDATE_HOME/data" \
            "$SZL_CANDIDATE_HOME/state" \
            "$SZL_CANDIDATE_HOME/tmp" \
            "$SZL_CANDIDATE_CACHE" \
            "$SZL_CANDIDATE_STORE"
          install -d -m 0700 "$SZL_EVIDENCE_ROOT"
          chmod -R a-w "$SZL_CONTROLLER_ROOT" "$SZL_CANDIDATE_ROOT"

          dependency_dirs=(
            "$SZL_CANDIDATE_HOME/bin"
            "$SZL_CANDIDATE_HOME/config"
            "$SZL_CANDIDATE_HOME/data"
            "$SZL_CANDIDATE_HOME/state"
            "$SZL_CANDIDATE_HOME/tmp"
            "$SZL_CANDIDATE_CACHE"
            "$SZL_CANDIDATE_STORE"
          )
          while IFS= read -r -d '' tracked_path; do
            case "$tracked_path" in
              package.json)
                package_root="$SZL_CANDIDATE_ROOT"
                ;;
              */package.json)
                package_root="$SZL_CANDIDATE_ROOT/${tracked_path%/package.json}"
                ;;
              *)
                continue
                ;;
            esac
            modules_dir="$package_root/node_modules"
            if [[ -e "$modules_dir" || -L "$modules_dir" ]]; then
              echo "candidate dependency directory already exists: ${modules_dir}" >&2
              exit 1
            fi
            sudo install -d -o "$SZL_CANDIDATE_USER" -g "$candidate_group" -m 0700 \
              "$modules_dir"
            dependency_dirs+=("$modules_dir")
          done < <(git -C "$SZL_CANDIDATE_ROOT" ls-files -z)
          if (( ${#dependency_dirs[@]} < 8 )); then
            echo "candidate dependency directory inventory is incomplete" >&2
            exit 1
          fi
          printf '%s\0' "${dependency_dirs[@]}" > "$SZL_DEPENDENCY_DIRS_MANIFEST"
          chmod 0600 "$SZL_DEPENDENCY_DIRS_MANIFEST"

          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_CONTROLLER_ROOT/package.json"
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_CANDIDATE_ROOT/package.json"
          if sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -r "$SZL_EVIDENCE_ROOT"; then
            echo "candidate dependency identity can traverse the evidence root" >&2
            exit 1
          fi
          for protected_root in \
            "$SZL_CONTROLLER_ROOT" \
            "$SZL_CANDIDATE_ROOT" \
            "$SZL_EVIDENCE_ROOT" \
            "$SZL_PNPM_ROOT"; do
            if sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
              test -w "$(dirname "$protected_root")"; then
              echo "candidate dependency identity can rename protected root: ${protected_root}" >&2
              exit 1
            fi
          done
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -x "$SZL_PNPM_EXECUTABLE"
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_PNPM_EXECUTABLE"
          candidate_writable_pnpm_entry="$(
            sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
              find "$SZL_PNPM_ROOT" ! -type l -writable -print -quit
          )"
          if [[ -n "$candidate_writable_pnpm_entry" ]]; then
            echo "candidate identity can write admitted pnpm runtime: ${candidate_writable_pnpm_entry}" >&2
            exit 1
          fi

      - name: Install nonexecuting candidate dependencies as isolated identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./candidate/package.json').packageManager")" = pnpm@10.26.1
          trusted_path="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin"
          test "$(command -v pnpm)" = "$SZL_PNPM_EXECUTABLE"
          pnpm_path="$SZL_PNPM_EXECUTABLE"
          test -x "$pnpm_path"
          resolved_root="$(realpath -e "$SZL_PNPM_ROOT")"
          resolved_pnpm="$(realpath -e "$pnpm_path")"
          case "$resolved_pnpm" in
            "$resolved_root"/*) ;;
            *)
              echo "pnpm executable resolved outside its admitted root" >&2
              exit 1
              ;;
          esac
          candidate_pnpm_version="$(
            sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
              /usr/bin/env -i \
                "PATH=$trusted_path" \
                "HOME=$SZL_CANDIDATE_HOME" \
                "$pnpm_path" --version
          )"
          test "$candidate_pnpm_version" = 10.26.1
          candidate_node_version="$(
            sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
              /usr/bin/env -i \
                "PATH=$trusted_path" \
                node --version
          )"
          [[ "$candidate_node_version" =~ ^v24\. ]]
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            /usr/bin/env -i \
              "PATH=$trusted_path" \
              "HOME=$SZL_CANDIDATE_HOME" \
              "TMPDIR=$SZL_CANDIDATE_HOME/tmp" \
              "XDG_CACHE_HOME=$SZL_CANDIDATE_CACHE" \
              "XDG_CONFIG_HOME=$SZL_CANDIDATE_HOME/config" \
              "XDG_DATA_HOME=$SZL_CANDIDATE_HOME/data" \
              "XDG_STATE_HOME=$SZL_CANDIDATE_HOME/state" \
              "PNPM_HOME=$SZL_CANDIDATE_HOME/bin" \
              CI=1 \
              COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
              "$pnpm_path" \
                "--config.workspace-dir=$SZL_CANDIDATE_ROOT" \
                "--config.lockfile-dir=$SZL_CANDIDATE_ROOT" \
                "--config.store-dir=$SZL_CANDIDATE_STORE" \
                "--config.cache-dir=$SZL_CANDIDATE_CACHE" \
                --config.modules-dir=node_modules \
                "--config.virtual-store-dir=$SZL_CANDIDATE_VIRTUAL_STORE" \
                "--config.userconfig=$SZL_CANDIDATE_HOME/config/npmrc" \
                "--config.globalconfig=$SZL_CANDIDATE_HOME/config/global-npmrc" \
                "--config.state-dir=$SZL_CANDIDATE_HOME/state" \
                "--config.global-dir=$SZL_CANDIDATE_HOME/data/global" \
                "--config.global-bin-dir=$SZL_CANDIDATE_HOME/bin" \
                --config.node-linker=isolated \
                --dir "$SZL_CANDIDATE_ROOT" \
                install \
                --frozen-lockfile \
                --ignore-scripts \
                --ignore-pnpmfile \
                --package-import-method=copy \
                --reporter=append-only

      - name: Verify install boundaries and lock candidate source
        shell: bash
        run: |
          set -euo pipefail
          candidate_group="$(id -gn "$SZL_CANDIDATE_USER")"
          test "$(git -C "$SZL_CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          controller_status="$(git -C "$SZL_CONTROLLER_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$controller_status"
          test "$(git -C "$SZL_CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          tracked_status="$(git -C "$SZL_CANDIDATE_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$tracked_status"
          while IFS= read -r -d '' dependency_dir; do
            case "$dependency_dir" in
              "$SZL_CANDIDATE_ROOT"/node_modules|\
              "$SZL_CANDIDATE_ROOT"/*/node_modules|\
              "$SZL_CANDIDATE_HOME"/*)
                ;;
              *)
                echo "dependency path escaped admitted roots: ${dependency_dir}" >&2
                exit 1
                ;;
            esac
            test -d "$dependency_dir"
            test ! -L "$dependency_dir"
            test "$(stat -c '%U' "$dependency_dir")" = "$SZL_CANDIDATE_USER"
          done < "$SZL_DEPENDENCY_DIRS_MANIFEST"
          while IFS= read -r -d '' dependency_link; do
            dependency_target="$(realpath -e "$dependency_link")"
            case "$dependency_target" in
              "$SZL_CANDIDATE_ROOT"|"$SZL_CANDIDATE_ROOT"/*|\
              "$SZL_CANDIDATE_HOME"|"$SZL_CANDIDATE_HOME"/*)
                ;;
              *)
                echo "candidate dependency link escaped admitted roots: ${dependency_link}" >&2
                exit 1
                ;;
            esac
          done < <(find "$SZL_CANDIDATE_ROOT" "$SZL_CANDIDATE_HOME" -type l -print0)
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_CONTROLLER_ROOT/package.json"
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -x "$SZL_PNPM_EXECUTABLE"
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_PNPM_EXECUTABLE"
          if sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -r "$SZL_EVIDENCE_ROOT"; then
            echo "candidate dependency identity can traverse the evidence root" >&2
            exit 1
          fi

          sudo chmod -R a-w "$SZL_CANDIDATE_ROOT"
          for cache_path in \
            "$SZL_CANDIDATE_ROOT/node_modules/.vite" \
            "$SZL_CANDIDATE_ROOT/node_modules/.vite-temp" \
            "$SZL_CANDIDATE_ROOT/node_modules/.cache" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.vite" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.vite-temp" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.cache"; do
            test ! -L "$cache_path"
          done
          sudo install -d -o "$SZL_CANDIDATE_USER" -g "$candidate_group" -m 0700 \
            "$SZL_CANDIDATE_ROOT/node_modules/.vite" \
            "$SZL_CANDIDATE_ROOT/node_modules/.vite-temp" \
            "$SZL_CANDIDATE_ROOT/node_modules/.cache" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.vite" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.vite-temp" \
            "$SZL_CANDIDATE_ROOT/artifacts/a11oy/node_modules/.cache"
          sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test ! -w "$SZL_CANDIDATE_ROOT/package.json"
          if sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -r "$SZL_EVIDENCE_ROOT"; then
            echo "candidate runtime identity can traverse the evidence root" >&2
            exit 1
          fi
          if sudo --non-interactive --user "$SZL_CANDIDATE_USER" -- \
            test -w "$(dirname "$SZL_EVIDENCE_ROOT")"; then
            echo "candidate runtime identity can rename the evidence root" >&2
            exit 1
          fi

      - name: Verify candidate immediately before capture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$SZL_CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          controller_status="$(git -C "$SZL_CONTROLLER_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$controller_status"
          test "$(git -C "$SZL_CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          tracked_status="$(git -C "$SZL_CANDIDATE_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$tracked_status"

      - name: Capture exact-head evidence
        working-directory: controller
        shell: bash
        env:
          SZL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SZL_SOURCE_PR: ${{ inputs.source_pr }}
          SZL_ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail
          cleanup_candidate() {
            sudo pkill -KILL -u "$SZL_CANDIDATE_USER" >/dev/null 2>&1 || true
          }
          trap cleanup_candidate EXIT
          node scripts/ci/capture-series-a-exact-head.mjs
          cleanup_candidate
          trap - EXIT
          if pgrep -u "$SZL_CANDIDATE_USER" >/dev/null; then
            echo "candidate runtime processes remain after capture" >&2
            exit 1
          fi

      - name: Close source and evidence integrity after candidate teardown
        working-directory: controller
        shell: bash
        env:
          SZL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SZL_SOURCE_PR: ${{ inputs.source_pr }}
          SZL_ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail
          if pgrep -u "$SZL_CANDIDATE_USER" >/dev/null; then
            echo "candidate runtime processes remain before verification" >&2
            exit 1
          fi
          test "$(git -C "$SZL_CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          controller_status="$(git -C "$SZL_CONTROLLER_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$controller_status"
          test "$(git -C "$SZL_CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          tracked_status="$(git -C "$SZL_CANDIDATE_ROOT" status --porcelain=v1 --untracked-files=no)"
          test -z "$tracked_status"
          test "$(stat -c '%a' "$SZL_EVIDENCE_ROOT")" = 700
          node scripts/ci/capture-series-a-exact-head.mjs --verify
          chmod -R a-w "$SZL_EVIDENCE_ROOT"

      - name: Re-read authorized pull request and branch before upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}")"
          pr_head="$(jq -er '.head.sha | strings' <<<"$pr_json")"
          pr_branch="$(jq -er '.head.ref | strings' <<<"$pr_json")"
          pr_repository="$(jq -er '.head.repo.full_name | strings' <<<"$pr_json")"
          pr_state="$(jq -er '.state | strings' <<<"$pr_json")"
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$pr_state" = open
          test "$pr_repository" = "$GITHUB_REPOSITORY"
          test "$pr_branch" = "$TARGET_BRANCH"
          test "$pr_head" = "$CANDIDATE_SHA"
          test "$branch_head" = "$CANDIDATE_SHA"

      - name: Upload immutable capture evidence
        id: evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-head-screenshot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-head-evidence-${{ github.run_id }}-${{ github.run_attempt }}/exact-head-evidence-artifact/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish signed-promotion work item
    if: github.event_name == 'workflow_dispatch'
    needs:
      - contract
      - capture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_PR: ${{ inputs.source_pr }}
      CAPTURE_ROUTE: ${{ inputs.route }}
      ARTIFACT_NAME: exact-head-screenshot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
      ARTIFACT_URL: ${{ needs.capture.outputs.artifact_url }}
      ARTIFACT_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-read authorized pull request and branch before publication
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}")"
          pr_head="$(jq -er '.head.sha | strings' <<<"$pr_json")"
          pr_branch="$(jq -er '.head.ref | strings' <<<"$pr_json")"
          pr_repository="$(jq -er '.head.repo.full_name | strings' <<<"$pr_json")"
          pr_state="$(jq -er '.state | strings' <<<"$pr_json")"
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$pr_state" = open
          test "$pr_repository" = "$GITHUB_REPOSITORY"
          test "$pr_branch" = "$TARGET_BRANCH"
          test "$pr_head" = "$CANDIDATE_SHA"
          test "$branch_head" = "$CANDIDATE_SHA"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_URL" = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Open or update the signed-promotion work item
        shell: bash
        run: |
          set -euo pipefail
          title="chore(series-a): promote exact-head capture for PR #${SOURCE_PR}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          Exact-head screenshot evidence is ready for signed promotion.

          - workflow run: ${run_url}
          - workflow run attempt: \`${GITHUB_RUN_ATTEMPT}\`
          - exact 90-day artifact: [\`${ARTIFACT_NAME}\`](${ARTIFACT_URL}) (ID \`${ARTIFACT_ID}\`)
          - uploaded archive SHA-256: \`${ARTIFACT_DIGEST}\`
          - source PR: #${SOURCE_PR}
          - source head: \`${CANDIDATE_SHA}\`
          - source branch: \`${TARGET_BRANCH}\`
          - route: \`${CAPTURE_ROUTE}\`
          - viewports: 390, 768, 1440, 1920, 2560 pixels
          - machine packet: \`audit/series-a-exact-head-capture.json\`
          - images: \`docs/assets/screenshots/current/\`

          Download and verify the artifact, then promote it through a signed, DCO-complete protected pull request. The workflow intentionally does not create a token-authored pull request whose events cannot trigger the protected check suite.
          EOF
          )"
          matches_text="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[][] | select((has(\"pull_request\") | not) and .title == \"${title}\") | .number")"
          mapfile -t matches < <(printf '%s' "$matches_text")
          if (( ${#matches[@]} > 1 )); then
            echo "multiple open promotion work items have the exact title" >&2
            exit 1
          elif (( ${#matches[@]} == 1 )); then
            gh issue edit "${matches[0]}" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
