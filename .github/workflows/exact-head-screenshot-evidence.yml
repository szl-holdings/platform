name: Exact-head screenshot evidence

on:
  pull_request:
    paths:
      - .github/workflows/exact-head-screenshot-evidence.yml
      - docs/standards/exact-head-screenshot-evidence.md
      - scripts/ci/capture-series-a-exact-head.mjs
      - scripts/ci/exact-head-screenshot-evidence.test.mjs
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate head SHA
        required: true
        type: string
      target_branch:
        description: Existing same-repository branch that must still point to candidate_sha
        required: true
        type: string
      source_pr:
        description: Open same-repository pull request whose head is candidate_sha
        required: true
        type: string
      route:
        description: Absolute application route to capture
        required: true
        default: /a11oy/
        type: string

permissions:
  contents: read

concurrency:
  group: exact-head-screenshot-evidence-${{ github.event_name }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Capture contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate controller syntax and policy
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ci/capture-series-a-exact-head.mjs
          node --test scripts/ci/exact-head-screenshot-evidence.test.mjs
          grep -Fq 'GitHub-hosted ephemeral runner is the canonical default' docs/standards/exact-head-screenshot-evidence.md
          grep -Fq 'Copied screenshots' docs/standards/exact-head-screenshot-evidence.md
          grep -Fq 'source_sha' scripts/ci/capture-series-a-exact-head.mjs
          grep -Fq 'workflow_run_id' scripts/ci/capture-series-a-exact-head.mjs
          grep -Fq 'horizontal overflow' scripts/ci/capture-series-a-exact-head.mjs

  capture:
    name: Capture exact-head evidence package
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_PR: ${{ inputs.source_pr }}
      CAPTURE_ROUTE: ${{ inputs.route }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$TARGET_BRANCH" != -* ]]
          [[ "$TARGET_BRANCH" != *..* ]]
          [[ "$SOURCE_PR" =~ ^[0-9]+$ ]]
          [[ "$CAPTURE_ROUTE" == /* ]]
          [[ "$CAPTURE_ROUTE" != *..* ]]

      - name: Checkout controller from protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: controller
          persist-credentials: false

      - name: Verify target branch still equals authorized candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$CANDIDATE_SHA"

          pr_head="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" \
              --jq '.head.sha'
          )"
          pr_repo="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" \
              --jq '.head.repo.full_name'
          )"
          pr_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" \
              --jq '.state'
          )"
          test "$pr_repo" = "$GITHUB_REPOSITORY"
          test "$pr_state" = 'open'
          test "$pr_head" = "$CANDIDATE_SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install exact dependencies and Chromium
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Capture exact-head evidence
        working-directory: candidate
        shell: bash
        env:
          SZL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SZL_SOURCE_PR: ${{ inputs.source_pr }}
          SZL_ROUTE: ${{ inputs.route }}
          SZL_START_COMMAND: pnpm --filter @workspace/a11oy dev
        run: |
          cp ../controller/scripts/ci/capture-series-a-exact-head.mjs .szl-capture-series-a-exact-head.mjs
          node .szl-capture-series-a-exact-head.mjs

      - name: Verify fresh capture packet
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const packet = JSON.parse(fs.readFileSync('audit/series-a-exact-head-capture.json', 'utf8'));
          if (packet.state !== 'VERIFIED') throw new Error('capture packet is not VERIFIED');
          if (packet.source_sha !== process.env.CANDIDATE_SHA) throw new Error('source SHA mismatch');
          if (!packet.pnpm_version) throw new Error('pnpm version is missing');
          if (!Array.isArray(packet.results) || packet.results.length !== 5) throw new Error('viewport matrix incomplete');
          for (const row of packet.results) {
            const bytes = fs.readFileSync(row.screenshot);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== row.sha256) throw new Error(`digest mismatch: ${row.screenshot}`);
            if (row.device_scale_factor !== 1) throw new Error(`device scale factor mismatch: ${row.name}`);
            if (row.horizontal_overflow) throw new Error(`horizontal overflow: ${row.name}`);
            if (row.console_errors.length || row.page_errors.length) throw new Error(`browser errors: ${row.name}`);
          }
          NODE

      - name: Re-read branch before evidence publication
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$CANDIDATE_SHA"

      - name: Open or update the signed-promotion work item
        shell: bash
        run: |
          set -euo pipefail
          title="chore(series-a): promote exact-head capture for PR #${SOURCE_PR}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          Exact-head screenshot evidence is ready for signed promotion.

          - workflow run and 90-day artifact: ${run_url}
          - source PR: #${SOURCE_PR}
          - source head: \`${CANDIDATE_SHA}\`
          - route: \`${CAPTURE_ROUTE}\`
          - viewports: 390, 768, 1440, 1920, 2560 pixels
          - machine packet: \`audit/series-a-exact-head-capture.json\`
          - images: \`docs/assets/screenshots/current/\`

          Download and verify the artifact, then promote it through a signed, DCO-complete protected pull request. The workflow intentionally does not create a token-authored pull request whose events cannot trigger the protected check suite.
          EOF
          )"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Upload immutable capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-head-screenshot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/audit/series-a-exact-head-capture.json
            candidate/audit/screenshot-catalog.md
            candidate/docs/assets/screenshots/current/*.png
          if-no-files-found: error
          retention-days: 90
