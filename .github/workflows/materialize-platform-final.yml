name: Materialize Signed Platform Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-platform-final.yml

permissions:
  contents: write

concurrency:
  group: materialize-signed-platform-repair
  cancel-in-progress: false

jobs:
  materialize:
    name: Publish one signed exact-tree repair commit
    if: >-
      github.repository == 'szl-holdings/platform' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/platform-current-controls-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: fix/platform-current-controls-v2-signed
      REPOSITORY: ${{ github.repository }}
      SELF_PATH: .github/workflows/materialize-platform-final.yml
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify source and clean target lineage
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)"
          target_sha="$(gh api "repos/$REPOSITORY/branches/$TARGET_BRANCH" --jq .commit.sha)"
          test "$target_sha" = "$main_sha" \
            || { echo "::error::target branch is not rooted at current protected main"; exit 1; }
          git cat-file -e "$main_sha^{commit}"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Build exact file-change manifest excluding this materializer
        id: manifest
        shell: python
        env:
          TARGET_SHA: ${{ steps.lineage.outputs.target_sha }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          target = os.environ['TARGET_SHA']
          self_path = os.environ['SELF_PATH']

          def paths(diff_filter: str) -> list[str]:
              raw = subprocess.check_output([
                  'git', 'diff', '--no-renames', '--name-only', '-z',
                  f'--diff-filter={diff_filter}', f'{target}...HEAD'
              ])
              return [p.decode('utf-8') for p in raw.split(b'\0') if p]

          additions = sorted(path for path in paths('ACMRTUXB') if path != self_path)
          deletions = sorted(path for path in paths('D') if path != self_path)
          overlap = set(additions) & set(deletions)
          if overlap:
              raise SystemExit(f'overlapping additions/deletions: {sorted(overlap)}')
          if not additions and not deletions:
              raise SystemExit('no permanent file changes found')
          missing = [path for path in additions if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'addition paths missing from source tree: {missing}')
          manifest = {
              'schema': 'szl.platform-signed-replacement-manifest/v1',
              'source_head': os.environ['SOURCE_HEAD'],
              'target_parent': target,
              'target_branch': os.environ['TARGET_BRANCH'],
              'additions': additions,
              'deletions': deletions,
              'temporary_materializer_excluded': self_path,
          }
          Path('signed-platform-repair-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"addition_count={len(additions)}\n")
              output.write(f"deletion_count={len(deletions)}\n")

      - name: Validate permanent source before publication
        run: |
          set -euo pipefail
          node scripts/audit/validate-source-of-truth.js
          node scripts/check-clean-clone.mjs
          git diff --check

      - name: Create one GitHub-signed exact-tree commit
        id: commit
        shell: python
        env:
          EXPECTED_TARGET: ${{ steps.lineage.outputs.target_sha }}
        run: |
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path('signed-platform-repair-manifest.json').read_text())
          query = '''
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          '''
          variables = {
              'input': {
                  'branch': {
                      'repositoryNameWithOwner': os.environ['REPOSITORY'],
                      'branchName': os.environ['TARGET_BRANCH'],
                  },
                  'message': {
                      'headline': 'fix(platform): harden Vessels and retire stale controllers',
                      'body': 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>',
                  },
                  'expectedHeadOid': os.environ['EXPECTED_TARGET'],
                  'fileChanges': {
                      'additions': [
                          {
                              'path': path,
                              'contents': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
                          }
                          for path in manifest['additions']
                      ],
                      'deletions': [{'path': path} for path in manifest['deletions']],
                  },
              }
          }
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': query, 'variables': variables}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'szl-platform-signed-replacement/1',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'GraphQL HTTP {exc.code}') from exc
          if payload.get('errors'):
              print(json.dumps(payload['errors'], indent=2))
              raise SystemExit(1)
          commit = payload['data']['createCommitOnBranch']['commit']
          print(json.dumps(commit, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"sha={commit['oid']}\n")

      - name: Verify signed commit and exact tree identity
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          TARGET_SHA: ${{ steps.lineage.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/branches/$TARGET_BRANCH" --jq .commit.sha)" = "$COMMIT_SHA"
          test "$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)" = 'true'
          test "$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.reason)" = 'valid'
          git fetch --no-tags origin "$TARGET_BRANCH"
          git diff --no-renames --exit-code "$COMMIT_SHA" "$SOURCE_HEAD" -- . \
            ':(exclude).github/workflows/materialize-platform-final.yml'
          if gh api "repos/$REPOSITORY/contents/$SELF_PATH?ref=$TARGET_BRANCH" >/dev/null 2>&1; then
            echo '::error::temporary materializer leaked into signed target'
            exit 1
          fi
          printf '%s\n' "$COMMIT_SHA" > signed-platform-repair-sha.txt

      - name: Upload immutable signed-replacement receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-platform-repair-${{ github.run_id }}
          path: |
            signed-platform-repair-manifest.json
            signed-platform-repair-sha.txt
          if-no-files-found: error
          retention-days: 90
