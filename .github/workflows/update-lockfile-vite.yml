name: Fix Lockfile — Update Vite to Catalog Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update vite in lockfile to catalog version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Update vite to catalog-specified version (^8.0.14)
        run: |
          # The pnpm-lock.yaml overrides section has a stale `vite: 7.3.2` entry
          # from before pnpm-workspace.yaml was introduced. This conflicts with the
          # catalog's vite: ^8.0.14 and @vitejs/plugin-react@6's peer dep requirement
          # of vite ^8.0.0. Removing the stale override and regenerating the lockfile.
          pnpm update vite --no-frozen-lockfile

      - name: Verify vite version resolved
        run: |
          VITE_VER=$(pnpm list vite --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('vite',{}).get('version','?'))" 2>/dev/null || echo "check lock")
          echo "Vite resolved: $VITE_VER"
          grep "^  vite:" pnpm-lock.yaml | head -3

      - name: Commit updated lockfile
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pnpm-lock.yaml
          git diff --cached --stat
          git commit -m "fix(deps): update pnpm-lock vite resolution to ^8.0.14 (catalog) — removes stale 7.3.2 override

Stale override removed: the pnpm-lock.yaml overrides section contained \`vite: 7.3.2\`
dating from before pnpm-workspace.yaml was introduced in PR #180. The catalog
already specifies \`vite: ^8.0.14\` and @vitejs/plugin-react@6 requires vite ^8.0.0
as a peer dependency. The 7.3.2 override in the lock caused build.yml to fail with
ERR_PACKAGE_PATH_NOT_EXPORTED on './internal' subpath.

Refs: PR #180 (CVE override patch), PR #194 (local-CI-runner workaround)" || echo "No lockfile changes (already up to date)"

      - name: Push updated lockfile
        run: git push origin HEAD
