name: "Fix Lockfile — Update Vite to Catalog Version"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lockfile:
    name: Update vite in lockfile to catalog version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Update vite to catalog-specified version (^8.0.14)
        run: |
          pnpm update vite --no-frozen-lockfile

      - name: Verify vite version resolved
        run: |
          VITE_VER=$(pnpm list vite --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('vite',{}).get('version','?'))" 2>/dev/null || echo "check lock")
          echo "Vite resolved: $VITE_VER"
          grep "^  vite:" pnpm-lock.yaml | head -3

      - name: Commit updated lockfile
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pnpm-lock.yaml
          git diff --cached --stat
          git commit -m "fix(deps): update pnpm-lock vite to catalog ^8.0.14" \
            || echo "No lockfile changes (already up to date)"

      - name: Push updated lockfile
        run: git push origin HEAD
