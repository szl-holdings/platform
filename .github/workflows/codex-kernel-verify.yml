name: codex-kernel-verify

# Continuous-verification gate for packages/codex-kernel.
#
# The Codex-Kernel release notes (v1.0.0 / v1.0.1) assert that the kernel
# reproduces the published Dresden and SZL governed-ops bundles bit-for-bit.
# This workflow makes that assertion testable on every change: it builds,
# typechecks, tests, asserts the kernel replay invariants, generates an SBOM,
# and runs the doctrine banned-token grep. If the kernel drifts from its
# published hashes, this gate goes red.
#
# Trigger scope is limited to changes that touch the package or this workflow,
# so it acts as a forcing function for the kernel specifically.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/codex-kernel/**'
      - '.github/workflows/codex-kernel-verify.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/codex-kernel/**'
      - '.github/workflows/codex-kernel-verify.yml'

permissions:
  contents: read

concurrency:
  group: codex-kernel-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # Published reference hashes from the Codex-Kernel release bodies + the
  # szl-trust/runs/E4-codex-kernel-2026-04-29 evidence bundle. The kernel
  # must reproduce these exactly.
  DRESDEN_FINAL_STATE_HASH: fe20ecc47445dbd887b5b14ef26ed981
  DRESDEN_LEDGER_DIGEST: 4d0a943cef5b8fa605919db38df5e8e7
  SZL_FINAL_STATE_HASH: ca0910f40dd2e24d9f98437242f9717c

jobs:
  verify:
    name: Build, test, invariants, SBOM, doctrine grep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (kernel)
        run: pnpm --filter @workspace/codex-kernel typecheck

      - name: Lint (kernel)
        run: pnpm --filter @workspace/codex-kernel lint:ci

      - name: Test (kernel) — 29 vitest cases
        run: pnpm --filter @workspace/codex-kernel test

      - name: Kernel invariant — Dresden Venus replay is bit-exact
        run: |
          set -euo pipefail
          rm -rf output
          CODEX_OUTPUT_ROOT="$PWD" pnpm --filter @workspace/codex-kernel codex:run
          summary=output/run_summary.json
          got_hash=$(node -e "console.log(require('./$summary').final_state_hash)")
          got_digest=$(node -e "console.log(require('./$summary').ledger_digest)")
          echo "Dresden final_state_hash: $got_hash (expected $DRESDEN_FINAL_STATE_HASH)"
          echo "Dresden ledger_digest:    $got_digest (expected $DRESDEN_LEDGER_DIGEST)"
          test "$got_hash" = "$DRESDEN_FINAL_STATE_HASH"
          test "$got_digest" = "$DRESDEN_LEDGER_DIGEST"
          CODEX_OUTPUT_ROOT="$PWD" pnpm --filter @workspace/codex-kernel codex:replay
          verdict=$(node -e "const s=require('./$summary'); console.log(s.replay_status||s.replay&&s.replay.verdict||'')")
          echo "replay verdict: $verdict"

      - name: Kernel invariant — SZL governed-ops replay is bit-exact
        run: |
          set -euo pipefail
          rm -rf output
          CODEX_OUTPUT_ROOT="$PWD" pnpm --filter @workspace/codex-kernel codex:run:szl
          got_hash=$(node -e "console.log(require('./output/run_summary.json').final_state_hash)")
          echo "SZL final_state_hash: $got_hash (expected $SZL_FINAL_STATE_HASH)"
          test "$got_hash" = "$SZL_FINAL_STATE_HASH"

      - name: Kernel invariant — 4 operational contracts present
        run: |
          set -euo pipefail
          c=packages/codex-kernel/src/cli/contracts.ts
          for fn in computeTraceIdentity auditSecrets resolveVersionLineage resolveDeploymentContract; do
            grep -q "export function $fn" "$c" || { echo "MISSING contract: $fn"; exit 1; }
            echo "contract present: $fn"
          done

      - name: Doctrine v11 LOCKED 749/14/163 §1 — banned-token grep (kernel diff surface)
        run: |
          set -euo pipefail
          # Whole-word marketing superlatives + retired product names.
          # Tailwind `leading-*` classes are excluded by the word boundary + hyphen.
          pattern='\b(revolutionary|unprecedented|world-class|seamless|industry-leading|cutting-edge|game-changing|breakthrough|premier|best-in-class|immaculate|state-of-the-art|Bo11y|Bolly|Jarvis|Putnam)\b'
          if grep -rInE "$pattern" packages/codex-kernel; then
            echo "Banned token found in packages/codex-kernel — see matches above."
            exit 1
          fi
          echo "No banned tokens in packages/codex-kernel."

      - name: SBOM (CycloneDX) for the kernel
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./packages/codex-kernel
          format: cyclonedx-json
          artifact-name: codex-kernel.sbom.cyclonedx.json
          upload-artifact: true
