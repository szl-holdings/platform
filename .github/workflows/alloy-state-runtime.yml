name: Alloy state-native runtime

on:
  pull_request:
    paths:
      - packages/a11oy-runtime/src/state-native/**
      - packages/a11oy-runtime/test/state-native-runtime.test.mjs
      - packages/a11oy-runtime/schemas/**
      - packages/a11oy-runtime/package.json
      - packages/a11oy-runtime/src/index.ts
      - docs/architecture/alloy-state-native-runtime.md
      - audit/frontier/ALLOY_STATE_NATIVE_RUNTIME_PROOF_2026-08-11.md
      - .github/workflows/alloy-state-runtime.yml
  push:
    branches:
      - main
    paths:
      - packages/a11oy-runtime/src/state-native/**
      - packages/a11oy-runtime/test/state-native-runtime.test.mjs
      - packages/a11oy-runtime/schemas/**
      - packages/a11oy-runtime/package.json
      - packages/a11oy-runtime/src/index.ts
      - docs/architecture/alloy-state-native-runtime.md
      - audit/frontier/ALLOY_STATE_NATIVE_RUNTIME_PROOF_2026-08-11.md
      - .github/workflows/alloy-state-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-state-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify state-native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Record exact toolchain
        run: |
          node --version
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck runtime package
        run: pnpm --filter @workspace/a11oy-runtime typecheck

      - name: Execute state-native conformance tests
        run: pnpm --filter @workspace/a11oy-runtime test

      - name: Execute deterministic state-native demonstration
        run: pnpm --filter @workspace/a11oy-runtime demo:state-native

      - name: Parse schema contracts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'packages/a11oy-runtime/schemas/state-capsule.v1.schema.json',
            'packages/a11oy-runtime/schemas/kernel-execution-receipt.v1.schema.json',
            'packages/a11oy-runtime/schemas/cognitive-epoch.v1.schema.json',
          ];
          for (const path of paths) {
            const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (schema.$schema !== 'https://json-schema.org/draft/2020-12/schema') {
              throw new Error(`${path} is not a JSON Schema 2020-12 contract`);
            }
          }
          console.log(`parsed ${paths.length} schema contracts`);
          NODE
