name: READINESS-OBSERVABILITY

# Proves Wire D trace propagation + required metrics counters.
# Doctrine v11 (LOCKED) 749/14/163. Additive readiness agent — read-only.
# Author: Yachay <yachay@szlholdings.dev>

on:
  schedule:
    - cron: "40 * * * *"   # hourly (UTC)
  workflow_dispatch: {}

permissions: {}

# All eight readiness agents append to one Hub dataset, so they share one
# per-asset lock (HF plan D3). GitHub keeps one running and one pending run per
# group and cancels a pending run only when a third one queues, so the
# schedules are staggered at least 10 minutes apart (no two agents share a slot).
concurrency:
  group: hf-write/dataset/SZLHOLDINGS/readiness-runs
  cancel-in-progress: false

jobs:
  run:
    name: READINESS-OBSERVABILITY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the fleet publish contract (stdlib, offline)
        run: python -m unittest discover -s platform/agents/readiness/_lib -p "test_*.py"

      - name: Install deps
        run: pip install --no-cache-dir huggingface_hub==2.0.0 pynacl

      - name: Run READINESS-OBSERVABILITY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KHIPU_SIGNING_KEY_B64: ${{ secrets.KHIPU_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11OY_URL: ${{ vars.A11OY_URL }}
          AMARU_URL: ${{ vars.AMARU_URL }}
          SENTRA_URL: ${{ vars.SENTRA_URL }}
          KILLINCHU_URL: ${{ vars.KILLINCHU_URL }}
          ROSIE_URL: ${{ vars.ROSIE_URL }}
          OTEL_COLLECTOR_URL: ${{ vars.OTEL_COLLECTOR_URL }}
        run: python platform/agents/readiness/readiness-observability/executor.py
