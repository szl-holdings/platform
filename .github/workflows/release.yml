name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (overrides auto-detection from commit messages)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Parse version components
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Manual dispatch: respect explicit version_bump input when not 'auto'
          MANUAL_BUMP="${{ inputs.version_bump }}"

          if [ -n "$MANUAL_BUMP" ] && [ "$MANUAL_BUMP" != "auto" ] && [ "$MANUAL_BUMP" != "" ]; then
            BUMP_TYPE="$MANUAL_BUMP"
          else
            # Auto-detect from commit messages since last tag
            if [ "$LATEST_TAG" = "v0.0.0" ]; then
              COMMITS=$(git log --pretty=format:"%s" --max-count=50)
            else
              COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
            fi

            if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?!:|BREAKING CHANGE"; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?:"; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION ($BUMP_TYPE bump)"

      - name: Check for duplicate release
        id: check_release
        run: |
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          if [ "$LATEST_TAG" != "v0.0.0" ]; then
            TAG_COMMIT=$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null || echo "")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Latest tag already points to HEAD ($LATEST_TAG) — skipping duplicate release"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.check_release.outputs.skip != 'true'
        id: changelog
        env:
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, os
          from datetime import date

          latest_tag  = os.environ["LATEST_TAG"]
          next_version = os.environ["NEXT_VERSION"]
          repo        = os.environ["REPO"]
          today       = date.today().strftime("%Y-%m-%d")

          # Collect commits since last tag.
          # Fields: subject \x1f short-hash \x1f full-hash \x1f body, separated by \x1e per commit.
          # The body is needed to detect "BREAKING CHANGE:" footers per the conventional-commits spec.
          fmt = "%s%x1f%h%x1f%H%x1f%b%x1e"
          if latest_tag == "v0.0.0":
              result = subprocess.run(
                  ["git", "log", f"--pretty=format:{fmt}", "--max-count=50"],
                  capture_output=True, text=True
              )
          else:
              result = subprocess.run(
                  ["git", "log", f"{latest_tag}..HEAD", f"--pretty=format:{fmt}"],
                  capture_output=True, text=True
              )

          commits = []
          for record in result.stdout.split("\x1e"):
              record = record.strip()
              if not record:
                  continue
              parts = record.split("\x1f", 3)
              if len(parts) >= 3:
                  subject = parts[0].strip()
                  short_h = parts[1].strip()
                  full_h  = parts[2].strip()
                  body    = parts[3].strip() if len(parts) > 3 else ""
                  if subject and full_h:
                      commits.append((subject, short_h, full_h, body))

          # Categorise by conventional-commit prefix (https://www.conventionalcommits.org).
          # Breaking changes: any type with "!" OR "BREAKING CHANGE" / "BREAKING-CHANGE" in subject or body/footer.
          breaking, features, fixes, others = [], [], [], []
          for subject, short_h, full_h, body in commits:
              link  = f"[{short_h}](https://github.com/{repo}/commit/{full_h})"
              entry = f"- {subject} ({link})"
              breaking_subject = re.match(r"^[a-z]+(\(.*\))?!:", subject, re.I)
              breaking_body    = bool(re.search(r"BREAKING[- ]CHANGE", body or "", re.I))
              if breaking_subject or breaking_body or "BREAKING CHANGE" in subject:
                  breaking.append(entry)
              elif re.match(r"^(feat|feature)(\(.*\))?:", subject, re.I):
                  features.append(entry)
              elif re.match(r"^fix(\(.*\))?:", subject, re.I):
                  fixes.append(entry)
              else:
                  others.append(entry)

          # Build RELEASE_NOTES.md (used by GitHub Release body)
          version_bare = next_version.lstrip("v")
          lines = [f"## [{version_bare}] \u2014 {today}", ""]

          if not commits:
              lines.append("- Maintenance release")
          else:
              for label, items in [
                  ("Breaking Changes", breaking),
                  ("Features",         features),
                  ("Bug Fixes",        fixes),
                  ("Other Changes",    others),
              ]:
                  if items:
                      lines += [f"### {label}", ""] + items + [""]

          notes = "\n".join(lines)
          with open("RELEASE_NOTES.md", "w") as f:
              f.write(notes)

          print("Generated release notes:")
          print(notes)
          PYEOF

      - name: Update CHANGELOG.md
        if: steps.check_release.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          next_version = os.environ["NEXT_VERSION"].lstrip("v")

          with open("RELEASE_NOTES.md") as f:
              notes = f.read().strip()

          with open("CHANGELOG.md") as f:
              content = f.read()

          # Guard against duplicate insertion on workflow reruns (e.g. manual re-trigger).
          if f"## [{next_version}]" in content:
              print(f"CHANGELOG.md already contains an entry for [{next_version}] — skipping insertion")
              sys.exit(0)

          # Insert the new release section just before the first versioned ## [x.y.z] entry
          # so it appears below ## [Unreleased] but above the previous release.
          match = re.search(r'\n## \[\d', content)
          if match:
              pos = match.start()
              new_content = content[:pos] + "\n\n" + notes + "\n\n---\n" + content[pos + 1:]
          else:
              # Fallback: append before the footer block
              new_content = content.rstrip() + "\n\n" + notes + "\n"

          # Reset the [Unreleased] section to a clean placeholder so it only
          # reflects work that has NOT yet shipped.  The regex matches everything
          # between the ## [Unreleased] heading and the next separator (---) or
          # next versioned heading (## [x.y.z]), replacing it with a one-liner.
          PLACEHOLDER = "\n\n_Nothing yet — add entries here as work lands._\n\n"
          new_content = re.sub(
              r'(?m)^(## \[Unreleased\]).*?(?=\n---|\n## \[)',
              r'\1' + PLACEHOLDER,
              new_content,
              count=1,
              flags=re.DOTALL,
          )

          with open("CHANGELOG.md", "w") as f:
              f.write(new_content)

          print("CHANGELOG.md updated successfully")
          PYEOF

      - name: Commit CHANGELOG.md
        if: steps.check_release.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit when there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update CHANGELOG.md for ${{ steps.version.outputs.next_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create tag
        if: steps.check_release.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next_version }}"
          git push origin "${{ steps.version.outputs.next_version }}"

      - name: Create GitHub Release
        if: steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.next_version }}
          name: ${{ steps.version.outputs.next_version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true

      - name: Release summary
        if: always()
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_release.outputs.skip }}" = "true" ]; then
            echo "- **Status:** Skipped (no new commits since ${{ steps.version.outputs.latest_tag }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Version:** ${{ steps.version.outputs.next_version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Bump type:** ${{ steps.version.outputs.bump_type }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Previous tag:** ${{ steps.version.outputs.latest_tag }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **CHANGELOG.md:** Updated automatically" >> "$GITHUB_STEP_SUMMARY"
          fi
