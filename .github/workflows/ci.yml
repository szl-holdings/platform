name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Recursive build covers every workspace package with a `build` script.
      - run: pnpm -r --if-present run build
      # Explicit per-app gates for the newer artifacts so a regression in
      # one of them surfaces as a named, easy-to-find CI failure rather
      # than getting buried in the recursive build output.
      - name: Build @workspace/command (Ecosystem Command Portal)
        run: pnpm --filter @workspace/command run build
      - name: Build @workspace/aegis (Aegis Defense & Intelligence)
        run: pnpm --filter @workspace/aegis run build
      - name: Build @workspace/pulse (Pulse Executive Briefing)
        run: pnpm --filter @workspace/pulse run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: szl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run database migrations
        run: pnpm migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
      - name: Build API server
        run: pnpm --filter @workspace/api-server exec node ./build.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
      - name: Start API server in background
        run: |
          pnpm --filter @workspace/api-server run start > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          PORT: 5000
          ALLOY_INTERNAL_TOKEN: ${{ secrets.INTEGRATION_TEST_TOKEN }}
      - name: Wait for API server to be healthy
        run: |
          echo "Waiting for API server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "API server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "=== API server log (last 50 lines) ==="
          tail -n 50 /tmp/api-server.log 2>/dev/null || true
          echo "API server did not become healthy within 30s"
          exit 1
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          NODE_ENV: test
          CI: true
          PORT: 5000
          BASE_URL: http://localhost:5000
          INTEGRATION_TEST_TOKEN: ${{ secrets.INTEGRATION_TEST_TOKEN }}
      - name: Stop API server and dump logs on failure
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            PID=$(cat /tmp/api-server.pid)
            echo "Sending SIGTERM to API server (PID $PID)..."
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -0 "$PID" 2>/dev/null && kill -9 "$PID" 2>/dev/null || true
          fi
          if [ -f /tmp/api-server.log ]; then
            echo "=== API server output (last 100 lines) ==="
            tail -n 100 /tmp/api-server.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-test-results
          path: coverage/
          retention-days: 7

  docs-sync-check:
    name: Docs Sync Check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check canonical docs are in sync with codebase (advisory)
        run: node scripts/docs/check-docs-sync.js

  docs-claims-check:
    name: Docs Claims Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify documented claims match codebase (roles, CSRF, routes, files, tables)
        run: node scripts/docs/check-docs-claims.js

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for diff scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --redact \
              --exit-code 1
          else
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --exit-code 1
          fi

  readiness-gate:
    name: Readiness Gate (smoke:product-mode)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: szl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run database migrations
        run: pnpm migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
      - name: Build API server
        run: pnpm --filter @workspace/api-server exec node ./build.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
      - name: Start API server in background
        run: |
          pnpm --filter @workspace/api-server run start &
          echo $! > /tmp/api-server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          PORT: 5000
      - name: Wait for API server to be healthy
        run: |
          echo "Waiting for API server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "API server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API server did not become healthy within 30s"
          exit 1
      - name: Run product-mode smoke tests
        run: pnpm smoke:product-mode
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          BASE_URL: http://localhost:5000

  proof-chain-checks:
    name: Proof-Chain Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Static check — executeWorkflow calls carry PolicyEvaluation
        run: node scripts/check-proof-chain.js
      - name: Unit tests — policy-engine (all 5 modes + guardrails)
        run: pnpm vitest run --config vitest.config.ts packages/policy-engine/src/policy-engine.test.ts
      - name: Unit tests — action-engine (policy enforcement + lifecycle)
        run: pnpm vitest run --config vitest.config.ts packages/action-engine/src/action-engine.test.ts
      - name: Unit tests — run-trace end-to-end waterfall
        run: pnpm vitest run --config vitest.config.ts packages/trace-graph/src/run-trace-e2e.test.ts
      - name: Unit tests — connector normalization (all 9 adapters)
        run: pnpm vitest run --config vitest.config.ts packages/connectors/src/connector-normalization.test.ts
      - name: Unit tests — telemetry-coverage (all required spans and attributes)
        run: pnpm vitest run --config vitest.config.ts packages/telemetry-standards/src/telemetry-coverage.test.ts
      - name: Integration tests — telemetry E2E (runtime surface span verification)
        run: pnpm vitest run --config vitest.config.ts packages/telemetry-standards/src/telemetry-e2e.test.ts
      - name: Unit tests — recommendation rendering across products (all 5 domains, 8-field proof-chain shape)
        run: pnpm vitest run --config vitest.config.ts packages/ontology/src/recommendation-rendering.test.ts
      - name: Unit tests — proof-chain checker (Gates 1–3 positive/negative fixtures)
        run: pnpm vitest run --config vitest.config.ts scripts/check-proof-chain.test.js
      - name: Restart-survival test — signal mesh end-to-end (seed → flush → restart → hydrate → public API)
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/signal-mesh-restart.test.ts

  route-security-matrix:
    name: Route Security Matrix (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Audits every API route file under artifacts/api-server/src/routes/ and
      # fails the build if any are UNCLASSIFIED — i.e. missing a named auth
      # middleware import, missing inline auth check, not in a group with
      # group-level auth middleware, and not in the public allowlist.
      # Distinct from SAST/dependency-audit so a failure here is unambiguously
      # attributable to a route losing its auth classification.
      # See artifacts/api-server/src/scripts/route-security-matrix.ts
      # and docs/known-gaps.md §3.2.
      - name: Audit API route auth + input validation (--strict)
        run: pnpm --filter @workspace/api-server run audit:route-security:strict

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, integration-test, docs-claims-check, secret-scan, readiness-gate, proof-chain-checks, route-security-matrix]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]] || \
             [[ "${{ needs.docs-claims-check.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.readiness-gate.result }}" != "success" ]] || \
             [[ "${{ needs.proof-chain-checks.result }}" != "success" ]] || \
             [[ "${{ needs.route-security-matrix.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
