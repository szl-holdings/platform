  pin-check:
    name: GitHub Actions Pin Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Scan every workflow file under .github/workflows/ and fail if any
      # `uses:` line references a floating tag (e.g. @v4, @main, @master)
      # instead of a full 40-character commit SHA.
      #
      # Allowed forms:
      #   uses: owner/repo@<40-hex-chars>          (SHA pin)
      #   uses: ./.github/actions/my-local-action  (local composite action)
      #
      # Rejected forms (will cause this job to fail):
      #   uses: actions/checkout@v4
      #   uses: actions/checkout@main
      #   uses: actions/checkout@master
      #   uses: actions/checkout@latest
      #
      # To fix: replace the floating ref with a full SHA and add a comment
      # like  # v4.2.2  so humans know which version it corresponds to.
      # See docs/ci.md for details.
      - name: Check all workflow actions are SHA-pinned
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"
          VIOLATIONS=$(mktemp)

          for file in "$WORKFLOW_DIR"/*.yml "$WORKFLOW_DIR"/*.yaml; do
            [ -f "$file" ] || continue
            while IFS= read -r line; do
              # Pull the ref portion after `uses:`, stripping inline comments
              ref=$(echo "$line" | sed -n 's/.*uses:[[:space:]]*\([^[:space:]#]*\).*/\1/p')
              [ -z "$ref" ] && continue

              # Skip local composite actions (start with ./)
              [[ "$ref" == ./* ]] && continue

              # The portion after the last @ must be exactly 40 lowercase hex
              # characters to be considered a full Git SHA.
              after_at="${ref##*@}"
              if ! echo "$after_at" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error file=$file::Unpinned action — $ref (fix: pin to a full 40-char SHA)" | tee -a "$VIOLATIONS"
              fi
            done < <(grep -E '^\s*(-\s+)?uses:\s+\S' "$file" | grep -v '^\s*#')
          done

          if [ -s "$VIOLATIONS" ]; then
            echo ""
            echo "One or more workflow files contain unpinned action refs."
            echo "See docs/ci.md for the SHA-pinning policy and how to fix."
            rm -f "$VIOLATIONS"
            exit 1
          fi

          rm -f "$VIOLATIONS"
          echo "All action refs are SHA-pinned."

  agent-eval-gate:
    name: Agent Eval Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build pulse-evals
        run: pnpm --filter @szl-holdings/pulse-evals run build
      # EVAL_MODEL_VERSION: set this repo variable (Settings → Variables) to the
      # exact gateway model being promoted, e.g. "gpt-4o" or "claude-3-5-sonnet".
      # Defaults to gpt-4o so CI always pins to a resolvable model, not an opaque
      # SHA label that cannot be bound to gateway routing.
      - name: Eval gate — sentinel-maritime
        run: |
          pnpm tsx scripts/ci-eval-gate.ts \
            --agent-id sentinel-maritime \
            --model-version ${{ vars.EVAL_MODEL_VERSION || 'gpt-4o' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      - name: Eval gate — prism-ai
        run: |
          pnpm tsx scripts/ci-eval-gate.ts \
            --agent-id prism-ai \
            --model-version ${{ vars.EVAL_MODEL_VERSION || 'gpt-4o' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, integration-test, docs-claims-check, secret-scan, readiness-gate, proof-chain-checks, route-security-matrix, brand-strings, cortex-security-tests, env-coverage, design-token-drift, api-spec-drift, pin-check, agent-eval-gate]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]] || \
             [[ "${{ needs.docs-claims-check.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.readiness-gate.result }}" != "success" ]] || \
             [[ "${{ needs.proof-chain-checks.result }}" != "success" ]] || \
             [[ "${{ needs.route-security-matrix.result }}" != "success" ]] || \
             [[ "${{ needs.brand-strings.result }}" != "success" ]] || \
             [[ "${{ needs.cortex-security-tests.result }}" != "success" ]] || \
             [[ "${{ needs.env-coverage.result }}" != "success" ]] || \
             [[ "${{ needs.design-token-drift.result }}" != "success" ]] || \
             [[ "${{ needs.api-spec-drift.result }}" != "success" ]] || \
             [[ "${{ needs.pin-check.result }}" != "success" ]] || \
             [[ "${{ needs.agent-eval-gate.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
