name: CI

# Lint + typecheck gate. Runs on PRs and on push to main so the CI badge
# reflects the result of real checks, not a placeholder.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'replit-sync/**'
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  estate-audit-contract:
    name: Estate source and CI audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reject incomplete, stale, hidden-failure and drifting evidence
        run: python -m unittest discover -s tools -p test_estate_auditor_contract.py -v
      - name: Legacy report compatibility and scoring regressions (offline)
        run: python tools/test_estate_auditor.py
      - name: Reject remote mesh installer execution when Tailscale is absent
        run: bash replit-sync/mesh/test_mesh_join_missing_tailscale.sh

  customer-portal:
    name: Customer portal contracts (Python 3.14, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Match the service Dockerfile's Python minor version.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            services/customer-portal/requirements.txt
            services/customer-portal/requirements-dev.txt
      - name: Install customer-portal runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r services/customer-portal/requirements-dev.txt
      - name: Run customer-portal tests (local test keys, stubbed JWKS, no network)
        run: python -m pytest services/customer-portal/tests -q -ra -p no:cacheprovider

  clean-clone:
    name: Clean clone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Verify clean-clone invariants
        run: node scripts/check-clean-clone.mjs
      - name: Test dependency-free clone guards
        run: node --test --test-reporter=spec --test-reporter=./scripts/ci/clone-guard-reporter.mjs --test-reporter-destination=stdout --test-reporter-destination=stdout scripts/check-package-manager.test.mjs scripts/check-clean-clone.test.mjs scripts/setup-hooks.test.mjs scripts/brand-paths.test.ts scripts/ci/governance-workflows.test.mjs lib/api-spec/scripts/codegen.test.mjs

  lint:
    name: Lint
    needs: clean-clone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint + biome)
        run: pnpm run lint:ci

  typecheck:
    name: Typecheck
    needs: clean-clone
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install dependencies (skip optional onnxruntime download)
        run: ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile
      - name: Typecheck (turbo run typecheck)
        env:
          TURBO_CONCURRENCY: "3"
        run: pnpm run typecheck
