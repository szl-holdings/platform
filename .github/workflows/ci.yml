  design-token-drift:
    name: Design Token Drift Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Scans all 14 governed artifacts for raw hex, inline rgb/hsl, and
      # non-aliased design-system imports. Fails if average compliance score
      # across artifacts drops below the threshold (default 60/100). The full
      # per-artifact breakdown is printed to the CI log.
      # Run `pnpm tokens:drift` locally to regenerate the report and committed
      # data files. Run `pnpm tokens:drift:check` to reproduce the CI gate.
      - name: Check design token compliance across all governed artifacts
        run: pnpm tokens:drift:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: design-token-drift-report
          path: scripts/design-tokens-drift.report.json
          retention-days: 30

  api-spec-drift:
    name: API Spec Drift Check (blocking)
