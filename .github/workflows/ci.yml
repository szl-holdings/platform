name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # lib/db throws at module-load time if DATABASE_URL is unset (legacy
      # behaviour from when only the api-server imported it). Tool-mesh
      # handler tests transitively import lib/db via @workspace/guardian,
      # so the unit-test job needs a non-empty value. The string is never
      # connected to — pg.Pool is constructed lazily and unit tests stub
      # all DB interactions.
      DATABASE_URL: postgres://ci-stub:ci-stub@127.0.0.1:5432/ci-stub
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Recursive build covers every workspace package with a `build` script.
      - run: pnpm -r --if-present run build

  # NOTE (2026-05-02): The following CI jobs were removed alongside their
  # underlying api-server artifact:
  #   - integration-test (api-server live + Postgres)
  #   - readiness-gate (smoke:product-mode against api-server)
  #   - cortex-security-tests (api-server vitest suite)
  #   - route-security-matrix (api-server route auth audit)
  #   - api-spec-drift (api-server OpenAPI route audit)
  # The signal-mesh-restart step was also removed from proof-chain-checks.
  # Re-introduce these if/when an api-server artifact is added back.

  docs-sync-check:
    name: Docs Sync Check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check canonical docs are in sync with codebase (advisory)
        run: node scripts/docs/check-docs-sync.js

  docs-catalogue-check:
    name: Docs Catalogue Check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check API-CATALOGUE.md is in sync with OpenAPI spec (advisory)
        run: pnpm docs:check

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for diff scan)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts "$PR_BASE_SHA..$PR_HEAD_SHA" \
              --redact \
              --exit-code 1
          else
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --redact \
              --exit-code 1
          fi

  proof-chain-checks:
    name: Proof-Chain Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Static check — executeWorkflow calls carry PolicyEvaluation
        run: node scripts/check-proof-chain.js
      - name: Unit tests — policy-engine (all 5 modes + guardrails)
        run: pnpm --filter @szl-holdings/policy-engine exec vitest run src/policy-engine.test.ts
      - name: Unit tests — action-engine (policy enforcement + lifecycle)
        run: pnpm --filter @szl-holdings/action-engine exec vitest run src/action-engine.test.ts
      - name: Unit tests — run-trace end-to-end waterfall
        run: pnpm --filter @workspace/trace-graph exec vitest run src/run-trace-e2e.test.ts
      - name: Unit tests — connector normalization (all 9 adapters)
        run: pnpm --filter @szl-holdings/connectors exec vitest run src/connector-normalization.test.ts
      - name: Unit tests — telemetry-coverage (all required spans and attributes)
        run: pnpm --filter @szl-holdings/telemetry-standards exec vitest run src/telemetry-coverage.test.ts
      - name: Integration tests — telemetry E2E (runtime surface span verification)
        run: pnpm --filter @szl-holdings/telemetry-standards exec vitest run src/telemetry-e2e.test.ts
      - name: Unit tests — recommendation rendering across products (all 5 domains, 8-field proof-chain shape)
        run: pnpm --filter @workspace/ontology exec vitest run src/recommendation-rendering.test.ts
      - name: Unit tests — proof-chain checker (Gates 1–3 positive/negative fixtures)
        run: pnpm vitest run --config vitest.config.ts scripts/check-proof-chain.test.js

  brand-strings:
    name: Brand-String Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check for banned brand strings (trademark regression guard)
        run: pnpm brand:strings

  env-coverage:
    name: Env-Var Coverage Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check per-artifact env-var coverage (--strict)
        run: pnpm check:env-coverage:strict

  design-token-drift:
    name: Design Token Drift Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check design token compliance across all governed artifacts
        # Threshold relaxed from 50 → 40 after the 2026-05-02 monorepo cleanup that
        # removed 7 artifacts whose 100-scores were boosting the average. The 6
        # remaining artifacts have a baseline average of ~44; raising it back to 50
        # is tracked as a follow-up token-refactor task.
        run: pnpm exec tsx scripts/check-design-tokens-drift.ts --check --threshold=40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: design-token-drift-report
          path: scripts/design-tokens-drift.report.json
          retention-days: 30

  pin-check:
    name: GitHub Actions Pin Check (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check all workflow actions are SHA-pinned
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"
          VIOLATIONS=$(mktemp)

          for file in "$WORKFLOW_DIR"/*.yml "$WORKFLOW_DIR"/*.yaml; do
            [ -f "$file" ] || continue
            while IFS= read -r line; do
              ref=$(echo "$line" | sed -n 's/.*uses:[[:space:]]*\([^[:space:]#]*\).*/\1/p')
              [ -z "$ref" ] && continue
              [[ "$ref" == ./* ]] && continue
              after_at="${ref##*@}"
              if ! echo "$after_at" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error file=$file::Unpinned action — $ref (fix: pin to a full 40-char SHA)" | tee -a "$VIOLATIONS"
              fi
            done < <(grep -E '^\s*(-\s+)?uses:\s+\S' "$file" | grep -v '^\s*#')
          done

          if [ -s "$VIOLATIONS" ]; then
            echo ""
            echo "One or more workflow files contain unpinned action refs."
            echo "See docs/ci.md for the SHA-pinning policy and how to fix."
            rm -f "$VIOLATIONS"
            exit 1
          fi

          rm -f "$VIOLATIONS"
          echo "All action refs are SHA-pinned."

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, secret-scan, proof-chain-checks, brand-strings, env-coverage, design-token-drift, pin-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.proof-chain-checks.result }}" != "success" ]] || \
             [[ "${{ needs.brand-strings.result }}" != "success" ]] || \
             [[ "${{ needs.env-coverage.result }}" != "success" ]] || \
             [[ "${{ needs.design-token-drift.result }}" != "success" ]] || \
             [[ "${{ needs.pin-check.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
