name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Recursive build covers every workspace package with a `build` script.
      - run: pnpm -r --if-present run build
      # Explicit per-app gates for the newer artifacts so a regression in
      # one of them surfaces as a named, easy-to-find CI failure rather
      # than getting buried in the recursive build output.
      - name: Build @workspace/command (Ecosystem Command Portal)
        run: pnpm --filter @workspace/command run build
      - name: Build @workspace/pulse (LUMINA Executive Briefing)
        run: pnpm --filter @workspace/pulse run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: szl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run database migrations
        run: pnpm migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
      - name: Build API server
        run: pnpm --filter @workspace/api-server exec node ./build.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
      - name: Start API server in background
        run: |
          pnpm --filter @workspace/api-server run start > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          PORT: 5000
          ALLOY_INTERNAL_TOKEN: ${{ secrets.INTEGRATION_TEST_TOKEN }}
      - name: Wait for API server to be healthy
        run: |
          echo "Waiting for API server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "API server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "=== API server log (last 50 lines) ==="
          tail -n 50 /tmp/api-server.log 2>/dev/null || true
          echo "API server did not become healthy within 30s"
          exit 1
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          NODE_ENV: test
          CI: true
          PORT: 5000
          BASE_URL: http://localhost:5000
          INTEGRATION_TEST_TOKEN: ${{ secrets.INTEGRATION_TEST_TOKEN }}
      # Pins the contract that /api/health stays fast even when the main
      # `db` pool is fully checked out. Saturates the main pool with
      # DB_POOL_MAX held connections, then asserts /api/health responds
      # in < 500 ms and that probeDatabase / probeAuth / probeQueue all
      # complete via the dedicated `healthPool` without error. Guards
      # against a regression where a future change quietly routes the
      # probes back through the main pool. Task #2902.
      - name: Health pool saturation regression test
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/health-pool-saturation.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/szl_test
          SESSION_SECRET: ci-test-session-secret-not-for-production
          NODE_ENV: test
          CI: true
      - name: Stop API server and dump logs on failure
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            PID=$(cat /tmp/api-server.pid)
            echo "Sending SIGTERM to API server (PID $PID)..."
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -0 "$PID" 2>/dev/null && kill -9 "$PID" 2>/dev/null || true
          fi
          if [ -f /tmp/api-server.log ]; then
            echo "=== API server output (last 100 lines) ==="
            tail -n 100 /tmp/api-server.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-test-results
          path: coverage/
          retention-days: 7

  docs-sync-check:
    name: Docs Sync Check (advisory)
