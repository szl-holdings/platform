name: Trivy + Grype filesystem dependency scan

# CI-fix 2026-06-09: anchore/scan-action@v3.6.4 shipped an old grype whose
# vulnerability-DB endpoint now serves a >13-week-old database; grype refuses a
# DB older than 5 days, errored out, and emitted an empty SARIF -> the upload
# step failed with "Invalid SARIF: Unexpected end of JSON input". Bumped to
# anchore/scan-action@v7.4.0 (current grype + current DB schema/endpoint).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'replit-sync/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read
jobs:
  trivy-scan:
    name: Trivy filesystem/SCA scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Don't fail on scan (gate in grype job)
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif

    permissions:
      contents: read
      security-events: write
  grype-gate:
    name: Grype filesystem/SCA gate (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository filesystem with Grype (raw JSON)
        # Grype never suppresses a finding here. The later fail-closed gate keeps
        # every raw result visible and admits only exact, verified local patches.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype-results.json
          grype-version: v0.118.0
          by-cve: false
          config: .grype.yaml

      - name: Seal raw Grype evidence digest
        run: |
          test -s grype-results.json
          sha256sum grype-results.json > grype-results.json.sha256

      - name: Scan repository filesystem with Grype (SARIF)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype-sarif
        if: always()
        with:
          path: "."
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          grype-version: v0.118.0
          by-cve: false
          config: .grype.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify local patches and gate raw Grype evidence
        run: |
          node --test scripts/qa/gate-grype-report.test.mjs scripts/qa/dependency-patches.test.mjs scripts/qa/third-party-licenses.test.mjs scripts/ci/release-security-workflows.test.mjs
          sha256sum --check --strict grype-results.json.sha256
          node scripts/qa/gate-grype-report.mjs

      - name: Publish Grype gate summary
        if: always()
        run: |
          if [[ -s grype-gate-report.md ]]; then
            cat grype-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Grype gate report was not produced; release remains blocked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require nonempty Grype evidence files
        if: always()
        run: |
          test -s grype-results.json
          test -s grype-results.json.sha256
          test -s grype-gate-report.md

      - name: Verify raw Grype evidence digest before upload
        id: verify-grype-evidence-upload
        if: always()
        run: sha256sum --check --strict grype-results.json.sha256

      - name: Upload raw Grype evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.verify-grype-evidence-upload.outcome == 'success'
        with:
          name: grype-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            grype-results.json
            grype-results.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload Grype gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: grype-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: grype-gate-report.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && steps.grype-sarif.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
    permissions:
      contents: read
      security-events: write
