name: Trivy + Grype container vulnerability scan

# CI-fix 2026-06-09: anchore/scan-action@v3.6.4 shipped an old grype whose
# vulnerability-DB endpoint now serves a >13-week-old database; grype refuses a
# DB older than 5 days, errored out, and emitted an empty SARIF -> the upload
# step failed with "Invalid SARIF: Unexpected end of JSON input". Bumped to
# anchore/scan-action@v7.4.0 (current grype + current DB schema/endpoint).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'replit-sync/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read
jobs:
  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Don't fail on scan (gate in grype job)
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

    permissions:
      contents: read
      security-events: write
  grype-gate:
    name: Grype CVE gate (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan with Grype (fail build on HIGH/CRITICAL)
        # .grype.yaml deliberately contains an empty ignore list. Every HIGH or
        # CRITICAL finding is a release blocker; there is no advisory exception path.
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Scan with Grype (SARIF for Security tab)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype-sarif
        if: always()
        with:
          path: "."
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always() && steps.grype-sarif.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
    permissions:
      contents: read
      security-events: write
