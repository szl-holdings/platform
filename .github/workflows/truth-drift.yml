name: Truth Drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_claim_scan:
        description: Scan the full tracked claim corpus, including legacy debt
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  truth-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify generator behavior
        run: node --test tools/truth/*.test.ts

      - name: Verify scanner allowlist justifications
        run: node tools/truth/generate-allowlist-justifications.ts --check

      - name: Regenerate and compare canonical metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/truth/generate-truth.ts --check

      - name: Reject newly introduced claim drift
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/truth/check-claims.ts --base "$BASE_SHA"

      - name: Audit the complete claim corpus
        if: github.event_name == 'workflow_dispatch' && inputs.full_claim_scan
        run: node tools/truth/check-claims.ts --all
