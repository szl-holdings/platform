name: Truth drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-drift:
    name: truth-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10.26.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate measured truth
        env:
          HF_ORG: SZLHOLDINGS
        run: pnpm truth:generate -- --check

      - name: Validate evidence labels and freshness
        run: pnpm claims:validate

      - name: Reject hardcoded metric drift
        run: pnpm claims:drift

      - name: Reject source-of-truth drift
        run: git diff --exit-code -- artifacts/SOURCE_OF_TRUTH.json
