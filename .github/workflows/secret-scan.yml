name: Secret Scan — PR Gate

# Dedicated PR-time Gitleaks gate. Scans only the commits introduced by the
# pull request so the check stays fast and focused on what changed.
#
# A separate daily sweep of the full `main` history runs in
# `secret-scan-scheduled.yml`.  The broader security suite (dependency scan,
# lockfile integrity, license report) runs in `security.yml`.
#
# This job is registered as a required status check in branch protection so a
# PR that introduces a potential secret cannot be merged.
#
# Triage: see `ops/github/secret-scanning-runbook.md`.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-pr:
    name: Gitleaks — PR diff scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository (full history for diff range)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks — scan PR commits only
        id: gitleaks
        run: |
          set +e
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Always succeed this step so SARIF can be uploaded; the
          # `enforce` step below is what actually fails the job.
          exit 0

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('gitleaks.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-pr

      - name: Archive SARIF report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif-pr-${{ github.run_id }}
          path: gitleaks.sarif
          retention-days: 90

      - name: Fail PR if Gitleaks found secrets
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks detected a potential secret in this PR."
          echo "Check the SARIF report in the Security tab (category: gitleaks-pr)"
          echo "or the run artifact 'gitleaks-sarif-pr-${{ github.run_id }}'."
          echo "Triage steps: ops/github/secret-scanning-runbook.md"
          exit 1
