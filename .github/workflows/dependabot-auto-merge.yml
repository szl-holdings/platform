name: Dependabot Auto-Merge (GitHub Actions)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    # Only run for Dependabot PRs that carry the github-actions label
    if: >
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'github-actions')

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@d7267a55f23e5f7a4e61f568d6eaa7a44e0c36c1 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Guard: only proceed for the github-actions package ecosystem
      - name: Verify ecosystem is github-actions
        if: steps.meta.outputs.package-ecosystem != 'github_actions'
        run: |
          echo "Ecosystem is '${{ steps.meta.outputs.package-ecosystem }}', not github_actions — skipping."
          exit 0

      - name: Approve the PR
        if: steps.meta.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge (squash)
        if: steps.meta.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
