name: One-use durable-state race hardening

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  harden:
    if: github.head_ref == 'feat/alloy-durable-state-transport-20260817' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Replace check-then-use paths with descriptor-bound operations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('packages/a11oy-runtime/src/state-native/filesystem-transport.ts')
          source = source_path.read_text()

          replacements = [
              (
                  "import { createHmac, randomUUID } from 'node:crypto';\n"
                  "import { link, lstat, mkdir, open, readFile, realpath, rm } from 'node:fs/promises';",
                  "import { createHmac, randomUUID } from 'node:crypto';\n"
                  "import { constants as fsConstants } from 'node:fs';\n"
                  "import {\n"
                  "  link,\n"
                  "  lstat,\n"
                  "  mkdir,\n"
                  "  open,\n"
                  "  realpath,\n"
                  "  rm,\n"
                  "  unlink,\n"
                  "  type FileHandle,\n"
                  "} from 'node:fs/promises';",
              ),
              (
                  "const RECORD_OVERHEAD_BYTES = 1024 * 1024;\n",
                  "const RECORD_OVERHEAD_BYTES = 1024 * 1024;\n"
                  "const READ_CHUNK_BYTES = 64 * 1024;\n",
              ),
              (
                  "  async #readBounded(path: string): Promise<string | undefined> {\n"
                  "    let metadata;\n"
                  "    try {\n"
                  "      metadata = await lstat(path);\n"
                  "    } catch (error) {\n"
                  "      if (errorCode(error) === 'ENOENT') return undefined;\n"
                  "      throw error;\n"
                  "    }\n"
                  "    assertStateNative(\n"
                  "      metadata.isFile() && !metadata.isSymbolicLink(),\n"
                  "      'SIGNATURE_INVALID',\n"
                  "      'Durable state paths must contain regular files, not links or special files.',\n"
                  "      { path },\n"
                  "    );\n"
                  "    assertStateNative(\n"
                  "      metadata.size <= this.#maxRecordBytes,\n"
                  "      'BUDGET_EXCEEDED',\n"
                  "      'Durable state record exceeds the configured read limit.',\n"
                  "      { path, size: metadata.size, maxRecordBytes: this.#maxRecordBytes },\n"
                  "    );\n"
                  "    return readFile(path, 'utf8');\n"
                  "  }",
                  "  async #readBounded(path: string): Promise<string | undefined> {\n"
                  "    const noFollow =\n"
                  "      typeof fsConstants.O_NOFOLLOW === 'number' ? fsConstants.O_NOFOLLOW : 0;\n"
                  "    let handle: FileHandle | undefined;\n"
                  "    try {\n"
                  "      handle = await open(path, fsConstants.O_RDONLY | noFollow);\n"
                  "    } catch (error) {\n"
                  "      if (errorCode(error) === 'ENOENT') return undefined;\n"
                  "      if (errorCode(error) === 'ELOOP') {\n"
                  "        throw new StateNativeError(\n"
                  "          'SIGNATURE_INVALID',\n"
                  "          'Durable state paths must not be symbolic links.',\n"
                  "          { path },\n"
                  "          { cause: error },\n"
                  "        );\n"
                  "      }\n"
                  "      throw error;\n"
                  "    }\n"
                  "\n"
                  "    try {\n"
                  "      const opened = await handle.stat();\n"
                  "      assertStateNative(\n"
                  "        opened.isFile(),\n"
                  "        'SIGNATURE_INVALID',\n"
                  "        'Durable state paths must contain regular files, not links or special files.',\n"
                  "        { path },\n"
                  "      );\n"
                  "      assertStateNative(\n"
                  "        opened.size <= this.#maxRecordBytes,\n"
                  "        'BUDGET_EXCEEDED',\n"
                  "        'Durable state record exceeds the configured read limit.',\n"
                  "        { path, size: opened.size, maxRecordBytes: this.#maxRecordBytes },\n"
                  "      );\n"
                  "\n"
                  "      const chunks: Buffer[] = [];\n"
                  "      let byteLength = 0;\n"
                  "      while (true) {\n"
                  "        const capacity = Math.min(\n"
                  "          READ_CHUNK_BYTES,\n"
                  "          this.#maxRecordBytes - byteLength + 1,\n"
                  "        );\n"
                  "        const chunk = Buffer.allocUnsafe(capacity);\n"
                  "        const { bytesRead } = await handle.read(chunk, 0, chunk.byteLength, null);\n"
                  "        if (bytesRead === 0) break;\n"
                  "        byteLength += bytesRead;\n"
                  "        assertStateNative(\n"
                  "          byteLength <= this.#maxRecordBytes,\n"
                  "          'BUDGET_EXCEEDED',\n"
                  "          'Durable state record grew beyond the configured read limit.',\n"
                  "          { path, size: byteLength, maxRecordBytes: this.#maxRecordBytes },\n"
                  "        );\n"
                  "        chunks.push(chunk.subarray(0, bytesRead));\n"
                  "      }\n"
                  "\n"
                  "      const afterRead = await handle.stat();\n"
                  "      assertStateNative(\n"
                  "        opened.dev === afterRead.dev &&\n"
                  "          opened.ino === afterRead.ino &&\n"
                  "          opened.size === afterRead.size &&\n"
                  "          opened.mtimeMs === afterRead.mtimeMs,\n"
                  "        'SIGNATURE_INVALID',\n"
                  "        'Durable state record changed while it was read.',\n"
                  "        { path },\n"
                  "      );\n"
                  "\n"
                  "      let current;\n"
                  "      try {\n"
                  "        current = await lstat(path);\n"
                  "      } catch (error) {\n"
                  "        throw new StateNativeError(\n"
                  "          'SIGNATURE_INVALID',\n"
                  "          'Durable state path changed while it was read.',\n"
                  "          { path },\n"
                  "          { cause: error },\n"
                  "        );\n"
                  "      }\n"
                  "      assertStateNative(\n"
                  "        current.isFile() &&\n"
                  "          !current.isSymbolicLink() &&\n"
                  "          current.dev === afterRead.dev &&\n"
                  "          current.ino === afterRead.ino,\n"
                  "        'SIGNATURE_INVALID',\n"
                  "        'Durable state path no longer identifies the opened record.',\n"
                  "        { path },\n"
                  "      );\n"
                  "      return Buffer.concat(chunks, byteLength).toString('utf8');\n"
                  "    } finally {\n"
                  "      await handle.close();\n"
                  "    }\n"
                  "  }",
              ),
              (
                  "  async #removeObjectFile(capsuleId: string): Promise<void> {\n"
                  "    const path = this.#objectPath(capsuleId);\n"
                  "    let metadata;\n"
                  "    try {\n"
                  "      metadata = await lstat(path);\n"
                  "    } catch (error) {\n"
                  "      if (errorCode(error) === 'ENOENT') return;\n"
                  "      throw error;\n"
                  "    }\n"
                  "    assertStateNative(\n"
                  "      metadata.isFile() && !metadata.isSymbolicLink(),\n"
                  "      'SIGNATURE_INVALID',\n"
                  "      'Durable state object removal refused a link or special file.',\n"
                  "      { path },\n"
                  "    );\n"
                  "    await rm(path, { force: true });\n"
                  "    await this.#syncDirectory(dirname(path));\n"
                  "  }",
                  "  async #removeObjectFile(capsuleId: string): Promise<void> {\n"
                  "    const path = this.#objectPath(capsuleId);\n"
                  "    try {\n"
                  "      await unlink(path);\n"
                  "    } catch (error) {\n"
                  "      if (errorCode(error) === 'ENOENT') return;\n"
                  "      throw new StateNativeError(\n"
                  "        'RECEIPT_WRITE_FAILED',\n"
                  "        'Durable state object entry could not be unlinked.',\n"
                  "        { path },\n"
                  "        { cause: error },\n"
                  "      );\n"
                  "    }\n"
                  "    await this.#syncDirectory(dirname(path));\n"
                  "  }",
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one exact source replacement, found {source.count(old)}')
              source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path('packages/a11oy-runtime/test/state-native-filesystem-transport.test.mjs')
          tests = test_path.read_text()
          old_import = (
              "import { mkdir, mkdtemp, readFile, readdir, rm, symlink, writeFile } "
              "from 'node:fs/promises';"
          )
          new_import = (
              "import { lstat, mkdir, mkdtemp, readFile, readdir, rm, symlink, writeFile } "
              "from 'node:fs/promises';"
          )
          if tests.count(old_import) != 1:
              raise SystemExit('filesystem test import shape changed')
          tests = tests.replace(old_import, new_import)
          marker = "\ntest(\n  'filesystem links cannot redirect state records or shard directories',"
          addition = r'''

test(
  'terminal deletion unlinks only the canonical directory entry',
  { skip: process.platform === 'win32' },
  async () => {
    const root = await mkdtemp(join(tmpdir(), 'szl-state-'));
    const object = portableObject('unlink safety');
    try {
      const adapter = new FileSystemStateTransportAdapter({
        rootDirectory: root,
        masterKey: randomBytes(32),
      });
      await adapter.put(object);
      await adapter.delete(object.capsule.capsuleId);

      const recordPath = storagePath(root, object.capsule.capsuleId);
      const outsideRecord = join(root, 'outside-must-survive.json');
      await mkdir(dirname(recordPath), { recursive: true });
      await writeFile(outsideRecord, 'outside survives\n', 'utf8');
      await symlink(outsideRecord, recordPath);

      await adapter.delete(object.capsule.capsuleId);
      assert.equal(await readFile(outsideRecord, 'utf8'), 'outside survives\n');
      await assert.rejects(
        lstat(recordPath),
        (error) => error && typeof error === 'object' && error.code === 'ENOENT',
      );
    } finally {
      await rm(root, { recursive: true, force: true });
    }
  },
);
'''
          if tests.count(marker) != 1:
              raise SystemExit('filesystem link-test marker changed')
          tests = tests.replace(marker, addition + marker)
          test_path.write_text(tests)

          proof_path = Path('audit/frontier/ALLOY_DURABLE_STATE_TRANSPORT_PROOF_2026-08-17.md')
          proof = proof_path.read_text()
          proof_old = '- link and special-file rejection for records and every created shard component;'
          proof_new = (
              '- descriptor-bound, bounded no-follow reads with post-read path identity checks;\n'
              '- link and special-file rejection for records and every created shard component;\n'
              '- direct unlink cleanup that removes a replaced link entry without following its target;'
          )
          if proof.count(proof_old) != 1:
              raise SystemExit('proof hardening marker changed')
          proof_path.write_text(proof.replace(proof_old, proof_new))

          architecture_path = Path('docs/architecture/alloy-state-native-runtime.md')
          architecture = architecture_path.read_text()
          architecture_old = '- bounded payload and record sizes;'
          architecture_new = (
              '- bounded payload and record sizes;\n'
              '- descriptor-bound no-follow reads with post-read path identity verification;'
          )
          if architecture.count(architecture_old) != 1:
              raise SystemExit('architecture hardening marker changed')
          architecture_path.write_text(architecture.replace(architecture_old, architecture_new))
          PY

      - name: Install the protected workspace exactly
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate the exact state-native package
        run: pnpm --filter @workspace/a11oy-runtime test

      - name: Prove the one-use controller is absent from the successor
        shell: bash
        run: |
          git rm .github/workflows/harden-state-read-once.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "audit/frontier/ALLOY_DURABLE_STATE_TRANSPORT_PROOF_2026-08-17.md docs/architecture/alloy-state-native-runtime.md packages/a11oy-runtime/src/state-native/filesystem-transport.ts packages/a11oy-runtime/test/state-native-filesystem-transport.test.mjs "

      - name: Publish the reviewed hardening commit
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add audit/frontier/ALLOY_DURABLE_STATE_TRANSPORT_PROOF_2026-08-17.md \
            docs/architecture/alloy-state-native-runtime.md \
            packages/a11oy-runtime/src/state-native/filesystem-transport.ts \
            packages/a11oy-runtime/test/state-native-filesystem-transport.test.mjs
          git commit -s -m 'fix(state): bind durable reads to opened descriptors'
          git push origin "HEAD:${BRANCH_NAME}"
