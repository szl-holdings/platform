name: refresh-pr718-lockfile

on:
  push:
    branches:
      - fix/warm-flagships-canonical-seven-20260902
    paths:
      - .github/workflows/refresh-pr718-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/warm-flagships-canonical-seven-20260902
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.26.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate frozen lock metadata
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit deterministic lockfile
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh dependency lockfile"
          git push origin HEAD:fix/warm-flagships-canonical-seven-20260902
