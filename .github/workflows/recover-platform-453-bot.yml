name: Repair platform replacement commit formatting

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: write

jobs:
  amend-message:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: c11291e09702c86f3f8995fffcae6167155c7240
      OLD_HEAD: ea0e6537d056eb7237374eb9c270e6614a0f2053
      TARGET_BRANCH: dependabot/npm_and_yarn/opentelemetry/core-2.8.0
    steps:
      - name: Checkout exact replacement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          show-progress: false

      - name: Verify immutable parent, tree, and source scope
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

          changed=$(git diff --name-only "$BASE_SHA" "$OLD_HEAD" | sort)
          expected=$(printf '%s\n' \
            .github/workflows/audit-full.yml \
            package.json \
            pnpm-lock.yaml | sort)
          test "$changed" = "$expected"

          git rev-parse "$OLD_HEAD^{tree}" > /tmp/tree-before

      - name: Amend only the Conventional Commit message
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --amend \
            -m 'fix(security): pin vulnerable dependencies and audit server' \
            -m 'Pin adm-zip and js-yaml to patched versions.' \
            -m 'Run runtime-audit servers from frozen-lockfile serve@14.2.6.' \
            -m 'Keep SPA rewrites compatible with scoped path-to-regexp@3.3.0.' \
            -m 'Supersedes #453 after independent review.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/tree-before)"

      - name: Push amended bot commit with lease
        shell: bash
        run: |
          set -euxo pipefail
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${OLD_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
