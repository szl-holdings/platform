name: Rebuild platform 405 on current main

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: dependabot/npm_and_yarn/opentelemetry/core-2.8.0
      EXPECTED_MAIN: 284b49a4fdacb57b3f7a31f6a01f75f993b4bc0b
      EXPECTED_SOURCE: 902f3178ce150acbebffcf8e70a4737a9788c2e5
    steps:
      - name: Checkout staging control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/recover-platform-453-bot
          fetch-depth: 0

      - name: Reconstruct one clean security commit on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_SOURCE"
          git checkout -B clean-security "$EXPECTED_MAIN"
          git checkout "$EXPECTED_SOURCE" -- \
            .github/workflows/audit-full.yml \
            package.json \
            pnpm-lock.yaml
          grep -F 'name = "pillow"' -A2 scripts/media/uv.lock | grep -F 'version = "12.3.0"'
          files=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/audit-full.yml \
            package.json \
            pnpm-lock.yaml | sort)
          test "$files" = "$expected"
          git diff --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Validate frozen lockfile and patched resolutions
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          grep -F 'brace-expansion: 2.1.2' pnpm-lock.yaml
          grep -F 'shell-quote: 1.9.0' pnpm-lock.yaml
          grep -F 'tar: 7.5.19' pnpm-lock.yaml
          ! grep -F 'brace-expansion@2.1.0' pnpm-lock.yaml
          ! grep -F 'shell-quote@1.8.4' pnpm-lock.yaml
          ! grep -F 'tar@7.5.16' pnpm-lock.yaml
          git diff --check

      - name: Download the repository-pinned Grype binary
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: false

      - name: Prove the HIGH and CRITICAL gate is clear
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        shell: bash
        run: |
          set -euo pipefail
          "$GRYPE" dir:. --fail-on high

      - name: Commit and replace the branch with leased force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-full.yml package.json pnpm-lock.yaml
          git commit \
            -m 'fix(security): clear current supply-chain findings' \
            -m 'Pin all current HIGH and CRITICAL dependency fixes.' \
            -m 'Run audit servers from the frozen lockfile.' \
            -m 'Preserve secure SPA rewrite compatibility.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_SOURCE}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
