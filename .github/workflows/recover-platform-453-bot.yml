name: Approve exact platform replacement workflow runs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: read

jobs:
  approve-runs:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_PR: '405'
      EXPECTED_BASE: c11291e09702c86f3f8995fffcae6167155c7240
      EXPECTED_HEAD: df1c5141b2ee6243a07d7cbc9d1a55496a51457f
      ADMIN_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
    steps:
      - name: Verify exact live PR identity and source scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"

          pr=$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")

          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.user.login' <<<"$pr")" = 'dependabot[bot]'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"

          files=$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}/files?per_page=100" \
            | jq -r '.[].filename' | sort)
          expected=$(printf '%s\n' \
            .github/workflows/audit-full.yml \
            package.json \
            pnpm-lock.yaml | sort)
          test "$files" = "$expected"

      - name: Approve only the exact action-required workflow runs
        shell: bash
        run: |
          set -euo pipefail
          runs=(
            29840480068 29840480090 29840479966 29840480354
            29840479118 29840479059 29840479032 29840479201
            29840479146 29840479182 29840479246 29840479424
            29840479065 29840479151 29840479135 29840479144
            29840479224 29840479277 29840479300 29840479328
          )

          for run_id in "${runs[@]}"; do
            before=$(curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            test "$(jq -r '.head_sha' <<<"$before")" = "$EXPECTED_HEAD"
            test "$(jq -r '.pull_requests[0].number' <<<"$before")" = "$TARGET_PR"
            test "$(jq -r '.conclusion' <<<"$before")" = 'action_required'

            status=$(curl --silent --show-error --output "/tmp/approve-${run_id}.json" \
              --write-out '%{http_code}' --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve")
            if [ "$status" != '201' ]; then
              cat "/tmp/approve-${run_id}.json" >&2 || true
              echo "approval failed for run ${run_id}: HTTP ${status}" >&2
              exit 1
            fi
            echo "approved run ${run_id}"
          done

      - name: Prove approvals released the runs
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          for run_id in \
            29840480068 29840480090 29840479966 29840480354 \
            29840479118 29840479059 29840479032 29840479201 \
            29840479146 29840479182 29840479246 29840479424 \
            29840479065 29840479151 29840479135 29840479144 \
            29840479224 29840479277 29840479300 29840479328; do
            after=$(curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            test "$(jq -r '.head_sha' <<<"$after")" = "$EXPECTED_HEAD"
            test "$(jq -r '.conclusion // "released"' <<<"$after")" != 'action_required'
          done
