name: Diagnose exact Grype findings for platform 405

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: write

jobs:
  diagnose-grype:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact platform replacement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ec527694e1362e79c7fd283dd1b0fe14a9768749
          persist-credentials: false

      - name: Download the same pinned Grype binary
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: false

      - name: Persist exact HIGH and CRITICAL findings to staging
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ops/recover-platform-453-bot
        shell: bash
        run: |
          set -euo pipefail
          "$GRYPE" dir:. -o json > /tmp/grype.json
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | [
                .artifact.name,
                .artifact.version,
                .artifact.type,
                .vulnerability.id,
                .vulnerability.severity,
                ((.vulnerability.fix.versions // []) | join(",")),
                ((.artifact.locations // []) | map(.path) | unique | join(","))
              ]
            | @tsv
          ' /tmp/grype.json | sort -u > /tmp/high-critical.tsv
          test -s /tmp/high-critical.tsv
          content=$(base64 -w0 /tmp/high-critical.tsv)
          jq -n \
            --arg message 'docs: record exact Grype diagnostic for platform 405' \
            --arg content "$content" \
            --arg branch "$TARGET_BRANCH" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/put.json
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/diagnostics/platform-405-grype.tsv" \
            --data-binary @/tmp/put.json
