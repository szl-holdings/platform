name: Diagnose exact Grype findings for platform 405

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose-grype:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact platform replacement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ec527694e1362e79c7fd283dd1b0fe14a9768749
          persist-credentials: false

      - name: Produce Grype JSON without changing the gate
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: '.'
          fail-build: false
          severity-cutoff: high
          output-format: json

      - name: Publish only HIGH and CRITICAL findings
        env:
          REPORT: ${{ steps.scan.outputs.json }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | [
                .artifact.name,
                .artifact.version,
                .artifact.type,
                .vulnerability.id,
                .vulnerability.severity,
                ((.vulnerability.fix.versions // []) | join(",")),
                ((.artifact.locations // []) | map(.path) | unique | join(","))
              ]
            | @tsv
          ' "$REPORT" | sort -u > /tmp/high-critical.tsv
          test -s /tmp/high-critical.tsv
          body=$(printf 'Exact Grype HIGH/CRITICAL findings for Platform #405 head `ec527694e1362e79c7fd283dd1b0fe14a9768749`:\n\n```text\n%s\n```\n' "$(cat /tmp/high-critical.tsv)")
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/comment.json
