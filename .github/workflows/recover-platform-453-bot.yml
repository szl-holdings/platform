name: Repair current Grype blockers on platform 405

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: dependabot/npm_and_yarn/opentelemetry/core-2.8.0
      EXPECTED_HEAD: ec527694e1362e79c7fd283dd1b0fe14a9768749
    steps:
      - name: Checkout exact Platform 405 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact starting head and import Pillow fix from PR 457
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin refs/pull/457/head
          git checkout FETCH_HEAD -- scripts/media/uv.lock
          grep -F 'version = "12.3.0"' scripts/media/uv.lock
          ! grep -F 'name = "pillow"' -A2 scripts/media/uv.lock | grep -F 'version = "12.2.0"'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Raise exact vulnerable Node packages and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const overrides = pkg.pnpm && pkg.pnpm.overrides;
          if (!overrides) throw new Error('pnpm.overrides missing');
          overrides['brace-expansion'] = '2.1.2';
          overrides['shell-quote'] = '1.9.0';
          overrides['tar'] = '7.5.19';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --ignore-scripts
          grep -F 'brace-expansion: 2.1.2' pnpm-lock.yaml
          grep -F 'shell-quote: 1.9.0' pnpm-lock.yaml
          grep -F 'tar: 7.5.19' pnpm-lock.yaml
          ! grep -F 'brace-expansion@2.1.0' pnpm-lock.yaml
          ! grep -F 'shell-quote@1.8.4' pnpm-lock.yaml
          ! grep -F 'tar@7.5.16' pnpm-lock.yaml
          git diff --check

      - name: Download the repository-pinned Grype binary
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: false

      - name: Prove the HIGH and CRITICAL gate is clear before pushing
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        shell: bash
        run: |
          set -euo pipefail
          "$GRYPE" dir:. --fail-on high

      - name: Commit and push the complete security repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml scripts/media/uv.lock
          git commit \
            -m 'fix(security): clear current Grype high and critical findings' \
            -m 'Raise brace-expansion to 2.1.2, shell-quote to 1.9.0, tar to 7.5.19, and import the Pillow 12.3.0 lockfile from PR 457.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin "HEAD:${TARGET_BRANCH}"
