name: Publish exact platform replacement tree SHA

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: read
  issues: write

jobs:
  publish-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_PR: '405'
      EXPECTED_BASE: c11291e09702c86f3f8995fffcae6167155c7240
      VERIFIED_BOT_COMMIT: df1c5141b2ee6243a07d7cbc9d1a55496a51457f
    steps:
      - name: Checkout exact verified bot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFIED_BOT_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify parent and exact source scope
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_BOT_COMMIT"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          changed=$(git diff --name-only "$EXPECTED_BASE" "$VERIFIED_BOT_COMMIT" | sort)
          expected=$(printf '%s\n' \
            .github/workflows/audit-full.yml \
            package.json \
            pnpm-lock.yaml | sort)
          test "$changed" = "$expected"

      - name: Publish immutable tree identifier to the target PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tree=$(git rev-parse "$VERIFIED_BOT_COMMIT^{tree}")
          body="<!-- platform-405-verified-tree -->\nVERIFIED_TREE_SHA=${tree}\nVERIFIED_COMMIT=${VERIFIED_BOT_COMMIT}\nVERIFIED_PARENT=${EXPECTED_BASE}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- platform-405-verified-tree -->")) | .id' | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$body" >/dev/null
          fi
          echo "published verified tree ${tree}"
