name: Print exact platform replacement tree SHA

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-platform-453-bot.yml

permissions:
  contents: read

jobs:
  print-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-platform-453-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_BASE: c11291e09702c86f3f8995fffcae6167155c7240
      VERIFIED_BOT_COMMIT: df1c5141b2ee6243a07d7cbc9d1a55496a51457f
    steps:
      - name: Verify parent and print immutable tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${VERIFIED_BOT_COMMIT}")
          test "$(jq -r '.sha' <<<"$commit")" = "$VERIFIED_BOT_COMMIT"
          test "$(jq -r '.parents[0].sha' <<<"$commit")" = "$EXPECTED_BASE"
          tree=$(jq -r '.tree.sha' <<<"$commit")
          test "$tree" != 'null'
          echo "VERIFIED_TREE_SHA=${tree}"
