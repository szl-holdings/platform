name: PRISM Counsel CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/routes/prism-counsel-*'
      - 'artifacts/api-server/src/services/prism-*'
      - 'lib/db/src/schema/prism_counsel*'
      - 'infra/modules/servicebus.bicep'
      - 'infra/modules/docintell.bicep'
      - 'infra/modules/blobstorage.bicep'
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/routes/prism-counsel-*'
      - 'artifacts/api-server/src/services/prism-*'
      - 'lib/db/src/schema/prism_counsel*'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  AZURE_RESOURCE_GROUP: szlholdings-prod
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run build
      - run: pnpm --filter @workspace/api-server run typecheck

  build:
    name: Build API Server
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run build
      - run: pnpm --filter @workspace/api-server run build

  validate-bicep:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: |
          az deployment group validate \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters pgAdminLogin=${{ secrets.PG_ADMIN_LOGIN }} \
            --parameters pgAdminPassword=${{ secrets.PG_ADMIN_PASSWORD }}

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build, validate-bicep]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters pgAdminLogin=${{ secrets.PG_ADMIN_LOGIN }} \
            --parameters pgAdminPassword=${{ secrets.PG_ADMIN_PASSWORD }} \
            --parameters apiImageTag=${{ github.sha }}

  deploy-api:
    name: Deploy API Server
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/szl-api:${{ github.sha }} -f Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/szl-api:${{ github.sha }}
      - run: |
          az containerapp update \
            --name szlholdings-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/szl-api:${{ github.sha }}

  db-migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run build
      - run: pnpm --filter @workspace/db run db:push
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          
          echo "Testing PRISM Counsel health..."
          curl -sf "${API_URL}/api/prism-counsel/health" | jq .
          
          echo "Testing PRISM Counsel readiness..."
          curl -sf "${API_URL}/api/prism-counsel/readiness" | jq .
          
          echo "Testing PRISM Counsel NY health..."
          curl -sf "${API_URL}/api/prism-counsel/ny/health" | jq .
          
          echo "All smoke tests passed."
