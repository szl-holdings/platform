name: Verify Source-of-Truth Metrics

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
    paths:
      - 'audit/source-of-truth.json'
      - 'audit/verify.sh'
      - 'artifacts/api-server/src/routes/**'
      - 'packages/**'
      - 'lib/**'
      - 'screenshots/approved/**'
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: verify-sot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-metrics:
    name: Source-of-Truth Metric Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python (for JSON parsing in verify.sh)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run source-of-truth verification
        run: bash audit/verify.sh

      - name: Upload verification output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-output
          path: audit/source-of-truth.json
          retention-days: 7
