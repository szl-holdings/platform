name: refresh-pr718-estate-manifest

on:
  push:
    branches:
      - fix/warm-flagships-canonical-seven-20260902
    paths:
      - .github/workflows/refresh-pr718-estate-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/warm-flagships-canonical-seven-20260902
          fetch-depth: 1
      - name: Regenerate source-bound estate manifest
        run: node packages/estate-contract-release/src/build.mjs
      - name: Verify and commit generated manifest
        run: |
          set -euo pipefail
          node packages/estate-contract-release/src/build.mjs --check
          git diff --check
          if git diff --quiet -- packages/estate-contract-release/manifest.json; then
            echo "estate manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/estate-contract-release/manifest.json
          git commit -m "fix(governance): refresh estate contract manifest"
          git push origin HEAD:fix/warm-flagships-canonical-seven-20260902
