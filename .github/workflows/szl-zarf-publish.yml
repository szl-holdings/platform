name: Publish SZL Zarf packages and UDS bundle

# Builds and publishes the three SZL Zarf packages (a11oy, sentra, amaru)
# and the top-level UDS bundle (szl-mesh) to ghcr.io/szl-holdings on tag push.
#
# Trigger:
#   - Push of a tag matching `szl-v*` (e.g. `szl-v1.0.0-alpha.2`) publishes
#     all three packages + the bundle at their currently-declared versions
#     in the zarf.yaml / uds-bundle.yaml files.
#   - Or via workflow_dispatch for manual runs / re-publishes.
#
# Auth:
#   - Built-in GITHUB_TOKEN with `packages: write` for GHCR pushes — no PAT.
#   - Cosign signing uses OIDC keyless signing (Sigstore Rekor transparency log).
#     No private key stored in secrets. Every signature is publicly verifiable
#     via: cosign verify --certificate-identity-regexp github.com/szl-holdings
#           --certificate-oidc-issuer https://token.actions.githubusercontent.com
#           <image>
#
# Migration note (2026-05-28): Previously used PEM key from ZARF_COSIGN_PRIVATE_KEY
# secret. Migrated to keyless OIDC signing for Sigstore Rekor transparency.
# The ZARF_COSIGN_PRIVATE_KEY and COSIGN_PASSWORD secrets can be removed after
# this PR is merged and validated.

on:
  push:
    tags:
      - 'szl-v*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign packages with cosign keyless (OIDC, Rekor transparency)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ORG: szl-holdings
  SZL_ROOT: docs/proposals/defense-unicorns/szl-holdings

jobs:
  # ---------------------------------------------------------------------------
  # 0. Guardrail: package versions in each zarf.yaml MUST match the
  #    corresponding ref: in uds-mesh/uds-bundle.yaml.
  # ---------------------------------------------------------------------------
  check-version-sync:
    name: Check package ↔ bundle version sync
    runs-on: ubuntu-latest
    outputs:
      a11oy: ${{ steps.read.outputs.a11oy }}
      sentra: ${{ steps.read.outputs.sentra }}
      amaru: ${{ steps.read.outputs.amaru }}
      bundle: ${{ steps.read.outputs.bundle }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read & compare versions
        id: read
        run: |
          set -euo pipefail
          ROOT="${{ env.SZL_ROOT }}"
          a11oy=$(yq '.metadata.version'   "$ROOT/a11oy/deploy/zarf.yaml")
          sentra=$(yq '.metadata.version'  "$ROOT/sentra/deploy/zarf.yaml")
          amaru=$(yq '.metadata.version'   "$ROOT/amaru/deploy/zarf.yaml")
          bundle=$(yq '.metadata.version'  "$ROOT/uds-mesh/uds-bundle.yaml")

          ref_a11oy=$(yq  '.packages[] | select(.name=="a11oy")  | .ref' "$ROOT/uds-mesh/uds-bundle.yaml")
          ref_sentra=$(yq '.packages[] | select(.name=="sentra") | .ref' "$ROOT/uds-mesh/uds-bundle.yaml")
          ref_amaru=$(yq  '.packages[] | select(.name=="amaru")  | .ref' "$ROOT/uds-mesh/uds-bundle.yaml")

          echo "a11oy zarf=$a11oy  bundle ref=$ref_a11oy"
          echo "sentra zarf=$sentra bundle ref=$ref_sentra"
          echo "amaru zarf=$amaru   bundle ref=$ref_amaru"
          echo "bundle version=$bundle"

          fail=0
          [[ "$a11oy"  == "$ref_a11oy"  ]] || { echo "::error::a11oy version drift: zarf=$a11oy bundle=$ref_a11oy";   fail=1; }
          [[ "$sentra" == "$ref_sentra" ]] || { echo "::error::sentra version drift: zarf=$sentra bundle=$ref_sentra"; fail=1; }
          [[ "$amaru"  == "$ref_amaru"  ]] || { echo "::error::amaru version drift: zarf=$amaru bundle=$ref_amaru";   fail=1; }
          [[ "$fail" == "0" ]] || exit 1

          {
            echo "a11oy=$a11oy"
            echo "sentra=$sentra"
            echo "amaru=$amaru"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Build + (keyless) sign + publish each Zarf package in parallel.
  # ---------------------------------------------------------------------------
  publish-packages:
    name: zarf publish ${{ matrix.package }}
    needs: check-version-sync
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [a11oy, sentra, amaru]
    permissions:
      contents: read
      packages: write
      id-token: write   # Required for keyless cosign signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install zarf
        uses: defenseunicorns/setup-zarf@745f0990f3d0611774b552930ea053ac61ebf0a6 # main
        with:
          download-init-package: false

      - name: Install cosign (keyless OIDC)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | zarf tools registry login ${{ env.REGISTRY }} \
                -u "${{ github.actor }}" --password-stdin

      - name: zarf package create
        working-directory: ${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy
        run: |
          set -euo pipefail
          zarf package create . --confirm --output .

      - name: zarf package publish
        working-directory: ${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy
        run: |
          set -euo pipefail
          pkg=$(ls zarf-package-${{ matrix.package }}-*.tar.zst | head -n1)
          echo "Publishing $pkg → oci://${REGISTRY}/${ORG}/packages"
          zarf package publish "$pkg" "oci://${REGISTRY}/${ORG}/packages"

      - name: Sign with cosign keyless (Sigstore Rekor transparency)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          pkg_path="${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy"
          pkg=$(ls "$pkg_path"/zarf-package-${{ matrix.package }}-*.tar.zst | head -n1)
          echo "Signing $pkg with keyless cosign (OIDC → Rekor)"
          # Sign the OCI artifact in the registry (keyless — no private key required)
          cosign sign --yes \
            "${REGISTRY}/${ORG}/packages/${{ matrix.package }}:$(yq '.metadata.version' "${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy/zarf.yaml")"
          # Also sign the local tarball for release attachment
          cosign sign-blob --yes \
            --bundle "${pkg}.cosign.bundle" \
            "$pkg"
          echo "Signature bundle: ${pkg}.cosign.bundle"
          echo "Verify OCI: cosign verify --certificate-identity-regexp github.com/szl-holdings --certificate-oidc-issuer https://token.actions.githubusercontent.com ${REGISTRY}/${ORG}/packages/${{ matrix.package }}"

      - name: Upload package artifact (for auditing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zarf-package-${{ matrix.package }}
          path: |
            ${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy/zarf-package-${{ matrix.package }}-*.tar.zst
            ${{ env.SZL_ROOT }}/${{ matrix.package }}/deploy/*.cosign.bundle
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Build + publish the szl-mesh UDS bundle once all three packages are up.
  # ---------------------------------------------------------------------------
  publish-bundle:
    name: uds bundle publish szl-mesh
    needs: [check-version-sync, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install zarf
        uses: defenseunicorns/setup-zarf@745f0990f3d0611774b552930ea053ac61ebf0a6 # main
        with:
          download-init-package: false

      - name: Install uds-cli
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # main

      - name: Install cosign (keyless OIDC)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | zarf tools registry login ${{ env.REGISTRY }} \
                -u "${{ github.actor }}" --password-stdin

      - name: uds create bundle
        working-directory: ${{ env.SZL_ROOT }}/uds-mesh
        run: uds create . --confirm --output .

      - name: uds publish bundle
        working-directory: ${{ env.SZL_ROOT }}/uds-mesh
        run: |
          set -euo pipefail
          bundle=$(ls uds-bundle-szl-mesh-*.tar.zst | head -n1)
          echo "Publishing $bundle → oci://${REGISTRY}/${ORG}/bundles"
          uds publish "$bundle" "oci://${REGISTRY}/${ORG}/bundles"

      - name: Sign bundle with cosign keyless (Sigstore Rekor transparency)
        working-directory: ${{ env.SZL_ROOT }}/uds-mesh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          bundle=$(ls uds-bundle-szl-mesh-*.tar.zst | head -n1)
          bundle_version=$(yq '.metadata.version' uds-bundle.yaml)
          echo "Signing UDS bundle with keyless cosign"
          cosign sign --yes \
            "${REGISTRY}/${ORG}/bundles/szl-mesh:${bundle_version}"
          cosign sign-blob --yes \
            --bundle "${bundle}.cosign.bundle" \
            "$bundle"

      - name: Upload bundle artifact (for auditing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uds-bundle-szl-mesh
          path: |
            ${{ env.SZL_ROOT }}/uds-mesh/uds-bundle-szl-mesh-*.tar.zst
            ${{ env.SZL_ROOT }}/uds-mesh/*.cosign.bundle
          retention-days: 30
          if-no-files-found: error

