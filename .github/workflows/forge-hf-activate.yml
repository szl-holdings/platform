name: forge-hf-activate (Chaski live + wake dark Spaces)

# FORGE: manual trigger. Prereqs (set once in repo/org Actions secrets — NEVER commit):
#   HF_WRITE_TOKEN   = Forge's HF token with WRITE access to SZLHOLDINGS Spaces
#   CHASKI_HF_TOKEN  = HF Router INFERENCE token to install as the a11oy Space's HF_TOKEN
# Then: Actions -> "forge-hf-activate" -> Run workflow.
# This sets the Space secret, restarts a11oy (factory) + anatomy, and polls for mode:live.
# Doctrine v11: never prints tokens; no-key path stays an honest stub; Lambda = Conjecture 1.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub>=0.25"
      - name: Activate Chaski + wake Spaces
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          CHASKI_HF_TOKEN: ${{ secrets.CHASKI_HF_TOKEN }}
        run: python replit-sync/forge_hf_activate.py
