name: Dependency Review

# Dependency review gate — KG012.
# Scans dependency manifest changes on pull requests and fails the check when a
# pull request would introduce a vulnerable dependency at high severity or
# above, or a disallowed license. Set as a required status check in branch
# protection to block such merges.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the PR on any newly introduced vulnerability at high or above.
          fail-on-severity: high
          # Block copyleft/unknown licenses that are incompatible with the
          # platform's distribution model. Adjust the allow/deny list as policy
          # evolves; the gate itself stays in place.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1
          comment-summary-in-pr: on-failure
