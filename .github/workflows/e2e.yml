name: E2E Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-app:
    name: e2e-app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: szl-holdings
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist
            port: 3000
            spec: szl-holdings.spec.ts
          - app: lyte-command-center
            filter: "@workspace/lyte-command-center"
            dist: artifacts/lyte-command-center/dist
            port: 3001
            spec: lyte.spec.ts
          - app: firestorm
            filter: "@workspace/firestorm"
            dist: artifacts/firestorm/dist
            port: 3002
            spec: aegis.spec.ts
          - app: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist
            port: 3003
            spec: terra.spec.ts
          - app: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist
            port: 3004
            spec: vessels.spec.ts
          - app: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist
            port: 3005
            spec: carlota-jo.spec.ts
          - app: stephen-site
            filter: "@workspace/stephen-site"
            dist: artifacts/stephen-site/dist
            port: 3006
            spec: stephen-site.spec.ts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} run build

      - name: Serve ${{ matrix.app }} on port ${{ matrix.port }}
        run: |
          npm install -g serve
          serve ${{ matrix.dist }} -l ${{ matrix.port }} &
          sleep 3
        shell: bash

      - name: Run E2E tests for ${{ matrix.app }}
        run: pnpm exec playwright test tests/e2e/${{ matrix.spec }} --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}
          SZL_BASE_PATH: /
          LYTE_BASE_PATH: /
          AEGIS_BASE_PATH: /
          TERRA_BASE_PATH: /
          VESSELS_BASE_PATH: /
          CARLOTA_BASE_PATH: /
          STEPHEN_BASE_PATH: /

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.app }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.app }}
          path: test-results/**/*.png
          retention-days: 7

  e2e:
    name: E2E Gate
    needs: e2e-app
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all E2E jobs passed
        run: |
          if [[ "${{ needs.e2e-app.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          echo "All E2E checks passed"
