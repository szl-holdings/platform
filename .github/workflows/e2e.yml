name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  e2e-app:
    name: e2e-app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist/public
            port: 3002
            spec: terra.spec.ts
          - app: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist/public
            port: 3003
            spec: vessels.spec.ts
          - app: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 3004
            spec: carlota-jo.spec.ts
          # Sentra — Cyber Resilience Command, port 3007.
          - app: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist/public
            port: 3007
            spec: sentra.spec.ts
          # Counsel — Legal Matter Command, port 3008.
          - app: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist/public
            port: 3008
            spec: counsel.spec.ts
          # a11oy — genetic AI substrate, port 3010.
          - app: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist/public
            port: 3010
            spec: a11oy.spec.ts
          # NOTE (2026-05-02): The monorepo was shrunk to six product artifacts
          # (a11oy, sentra, terra, carlota-jo, counsel, vessels). Specs that
          # targeted szl-holdings, command, pulse, mockup-sandbox,
          # lyte-command-center, conduit, etc. were removed alongside their apps.
          # See docs/TESTING_MATRIX.md §4a for the current coverage map.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} run build
        env:
          BASE_PATH: /

      - name: Serve ${{ matrix.app }} on port ${{ matrix.port }}
        run: |
          npm install -g serve
          # -s (single-page application mode) rewrites unmatched routes to
          # index.html. Without it `serve` returns its own 404 page for deep
          # client-side routes (e.g. /deals, /fleet-dashboard), so the SPA never
          # boots and route content never renders — only the `/` smoke tests pass.
          serve ${{ matrix.dist }} -s -l ${{ matrix.port }} &
          sleep 3
        shell: bash

      - name: Run E2E tests for ${{ matrix.app }}
        run: pnpm exec playwright test tests/e2e/${{ matrix.spec }} --project=chromium
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) != '' }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}
          TERRA_BASE_PATH: /
          VESSELS_BASE_PATH: /
          CARLOTA_BASE_PATH: /
          SENTRA_BASE_PATH: /
          COUNSEL_BASE_PATH: /
          A11OY_BASE_PATH: /

      - name: Skip notice (spec missing)
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) == '' }}
        run: echo "::notice::Spec tests/e2e/${{ matrix.spec }} not present — skipping ${{ matrix.app }} E2E."

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces-${{ matrix.app }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.app }}
          path: test-results/**/*.png
          retention-days: 7

  e2e:
    name: E2E Gate
    needs: [e2e-app]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all E2E jobs passed
        run: |
          if [[ "${{ needs.e2e-app.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          echo "All E2E checks passed"
