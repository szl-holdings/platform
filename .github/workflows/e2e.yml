name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-app:
    name: e2e-app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist/public
            port: 3002
            spec: terra.spec.ts
          - app: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist/public
            port: 3003
            spec: vessels.spec.ts
          - app: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 3004
            spec: carlota-jo.spec.ts
          # Sentra — Cyber Resilience Command, port 3007.
          - app: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist/public
            port: 3007
            spec: sentra.spec.ts
          # Counsel — Legal Matter Command, port 3008.
          - app: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist/public
            port: 3008
            spec: counsel.spec.ts
          # a11oy — genetic AI substrate, port 3010.
          - app: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist/public
            port: 3010
            spec: a11oy.spec.ts
          # NOTE (2026-05-02): The monorepo was shrunk to six product artifacts
          # (a11oy, sentra, terra, carlota-jo, counsel, vessels). Specs that
          # targeted szl-holdings, command, pulse, mockup-sandbox,
          # lyte-command-center, conduit, etc. were removed alongside their apps.
          # See docs/TESTING_MATRIX.md §4a for the current coverage map.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} run build
        env:
          BASE_PATH: /

      - name: Serve ${{ matrix.app }} on port ${{ matrix.port }}
        run: |
          npm install -g serve
          serve ${{ matrix.dist }} -l ${{ matrix.port }} &
          sleep 3
        shell: bash

      - name: Run E2E tests for ${{ matrix.app }}
        run: pnpm exec playwright test tests/e2e/${{ matrix.spec }} --project=chromium
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) != '' }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}
          TERRA_BASE_PATH: /
          VESSELS_BASE_PATH: /
          CARLOTA_BASE_PATH: /
          SENTRA_BASE_PATH: /
          COUNSEL_BASE_PATH: /
          A11OY_BASE_PATH: /

      - name: Skip notice (spec missing)
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) == '' }}
        run: echo "::notice::Spec tests/e2e/${{ matrix.spec }} not present — skipping ${{ matrix.app }} E2E."

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.app }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.app }}
          path: test-results/**/*.png
          retention-days: 7

  e2e:
    name: E2E Gate
    needs: [e2e-app]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all E2E jobs passed
        run: |
          if [[ "${{ needs.e2e-app.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          echo "All E2E checks passed"
