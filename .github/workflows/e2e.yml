name: E2E Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-app:
    name: e2e-app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: szl-holdings
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: szl-holdings.spec.ts
          # forge.spec.ts runs against the SZL Holdings build — Nuro Forge is
          # embedded at /nuro-forge within the SZL Holdings app (no standalone artifact).
          - app: forge
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: forge.spec.ts
          - app: aegis
            filter: "@workspace/aegis"
            dist: artifacts/aegis/dist/public
            port: 3001
            spec: aegis.spec.ts
          - app: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist/public
            port: 3002
            spec: terra.spec.ts
          - app: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist/public
            port: 3003
            spec: vessels.spec.ts
          - app: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 3004
            spec: carlota-jo.spec.ts
          - app: command
            filter: "@workspace/command"
            dist: artifacts/command/dist/public
            port: 3005
            spec: command.spec.ts
          # The governed-decision-loop spec targets the same command build
          # but is kept as a separate matrix entry so it can fail independently
          # and is easy to identify in CI run summaries.
          - app: governed-decision-loop
            filter: "@workspace/command"
            dist: artifacts/command/dist/public
            port: 3005
            spec: governed-decision-loop.spec.ts
          # IMPERIUM is embedded in the command artifact at /infrastructure/imperium-map.
          # Runs against the same @workspace/command build as command.spec.ts.
          - app: imperium
            filter: "@workspace/command"
            dist: artifacts/command/dist/public
            port: 3005
            spec: imperium.spec.ts
          # Lyte Command Center is embedded in the szl-holdings artifact at /lyte.
          # Runs against the same @workspace/szl-holdings build as szl-holdings.spec.ts.
          - app: lyte
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: lyte.spec.ts
          # Lyte onboarding wizard E2E. Targets the standalone
          # @workspace/lyte-command-center build (which owns /onboarding and
          # /overview), served on its own port so the wizard's localStorage
          # state cannot collide with the szl-holdings smoke tests.
          - app: lyte-onboarding
            filter: "@workspace/lyte-command-center"
            dist: artifacts/lyte-command-center/dist/public
            port: 3007
            spec: lyte-onboarding.spec.ts
          # Auth E2E: tests the full client-side session cycle (login wall,
          # Sign In redirect, session persistence, logout) via page.route()
          # interception against the SZL Holdings static build.  No live API
          # server is required; server-side session logic is covered separately
          # in tests/api/auth.test.ts.
          - app: auth
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: auth.spec.ts
          # RBAC E2E: tests the admin-only access gate (RequireAdmin) by
          # mocking /api/auth/user (authenticated) and /api/auth/my-roles
          # (role set) and visiting an admin-gated route.  Runs against the
          # same SZL Holdings static build as auth.spec.ts.
          - app: rbac
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: rbac.spec.ts
          # PRISM Counsel — Legal Command is its own standalone artifact.
          # Built from @workspace/prism-counsel and served on port 3006.
          # ARCHIVED: @workspace/prism-counsel is deprecated (see artifacts/prism-counsel/ARCHIVED.md).
          # This matrix entry is kept while the source directory exists; it will be removed
          # once the directory is fully deleted. The artifact is NOT in the registered artifact
          # registry. Track: RES-001 in audit/deployment-readiness-report.md.
          - app: prism-counsel
            filter: "@workspace/prism-counsel"
            dist: artifacts/prism-counsel/dist/public
            port: 3006
            spec: prism-counsel.spec.ts
          # Sentra — Cyber Resilience Command is its own standalone artifact.
          # Built from @workspace/sentra and served on port 3007.
          - app: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist/public
            port: 3007
            spec: sentra.spec.ts
          # Counsel — Legal Matter Command is its own standalone artifact.
          # Built from @workspace/counsel and served on port 3008.
          - app: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist/public
            port: 3008
            spec: counsel.spec.ts
          # Pulse — AI Executive Briefing is its own standalone artifact.
          # Built from @workspace/pulse and served on port 3009.
          - app: pulse
            filter: "@workspace/pulse"
            dist: artifacts/pulse/dist/public
            port: 3009
            spec: pulse.spec.ts
          # Stephen Lutar's personal site is embedded in the SZL Holdings app
          # at /stephen.  Runs against the same @workspace/szl-holdings build
          # used by szl-holdings.spec.ts.
          - app: stephen-site
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: stephen-site.spec.ts
          # correlation-deeplinks.spec.ts targets multiple artifacts
          # (Vessels, Terra, Command + secondary aegis/carlota/prism/lyte).
          # We bind this matrix entry to the command build because the
          # cross-platform evidence registry and correlation pages live there;
          # the spec uses isReachable() / appAvailable guards so the
          # vessels/terra/aegis/carlota detail-page tests skip cleanly when
          # those artifacts are not being served on this runner.
          - app: correlation-deeplinks
            filter: "@workspace/command"
            dist: artifacts/command/dist/public
            port: 3005
            spec: correlation-deeplinks.spec.ts
          # decision-theater.spec.ts exercises the nine-stage governed
          # decision loop embedded at /core in the SZL Holdings build.
          - app: decision-theater
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: decision-theater.spec.ts
          # a11y.spec.ts runs axe-core checks against the SZL Holdings public
          # routes. A dedicated `a11y` job below also runs this spec; keeping
          # both surfaces the failure inside the e2e-app matrix view too.
          - app: a11y
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: a11y.spec.ts
          # health-and-404.spec.ts covers two Phase C baselines:
          #   1. GET /api/health returns 200 (skipped when API server not running)
          #   2. Unknown routes don't show an error boundary crash
          # Runs against the SZL Holdings static build; the API health probe
          # self-skips since no API server is present in the static-serve job.
          # The live-server assertion is covered by the readiness-gate in ci.yml.
          - app: health-and-404
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: health-and-404.spec.ts
          # billing.spec.ts covers the billing event flows previously absent
          # from the test suite (KG010 / TG-001 resolution):
          #   - Pricing/pilot page CTAs render without error
          #   - SubscriptionManager: no-subscription state
          #   - SubscriptionManager: active subscription state (mocked Stripe)
          #   - Checkout initiation, billing portal, and cancel confirmation
          # All Stripe API calls are intercepted via page.route(); no live
          # API server or Stripe account is required.
          - app: billing
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist/public
            port: 3000
            spec: billing.spec.ts
          # No specs are currently excluded from this matrix.
          # All registered specs use appAvailable guards and call testInfo.skip()
          # when the target path is unavailable — they will not cause false failures.
          # See docs/TESTING_MATRIX.md §4a for the full coverage map.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} run build
        env:
          BASE_PATH: /

      - name: Serve ${{ matrix.app }} on port ${{ matrix.port }}
        run: |
          npm install -g serve
          serve ${{ matrix.dist }} -l ${{ matrix.port }} &
          sleep 3
        shell: bash

      - name: Run E2E tests for ${{ matrix.app }}
        run: pnpm exec playwright test tests/e2e/${{ matrix.spec }} --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}
          SZL_BASE_PATH: /
          AEGIS_BASE_PATH: /
          TERRA_BASE_PATH: /
          VESSELS_BASE_PATH: /
          CARLOTA_BASE_PATH: /
          COMMAND_BASE_PATH: /
          LYTE_BASE_PATH: /
          IMPERIUM_BASE_PATH: /
          PRISM_BASE_PATH: /
          STEPHEN_BASE_PATH: /stephen
          SENTRA_BASE_PATH: /
          COUNSEL_BASE_PATH: /
          PULSE_BASE_PATH: /

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.app }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.app }}
          path: test-results/**/*.png
          retention-days: 7

  a11y:
    name: Accessibility (axe-core) — SZL Holdings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 9 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build szl-holdings
        run: pnpm --filter @workspace/szl-holdings run build
        env:
          BASE_PATH: /

      - name: Serve szl-holdings on port 3000
        run: |
          npm install -g serve
          serve artifacts/szl-holdings/dist/public -l 3000 &
          sleep 3
        shell: bash

      - name: Run axe-core a11y checks
        run: pnpm exec playwright test tests/e2e/a11y.spec.ts --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          SZL_BASE_PATH: /

      - name: Upload a11y report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 14

      - name: Upload a11y traces on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces-a11y
          path: test-results/
          retention-days: 7

  nexus-smoke:
    name: NEXUS Smoke (mocked APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d # v4.0.0
        with: { version: 10 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The NEXUS sandbox spec hardcodes the path "/nexus/" (matching its
      # production base path). Build with the default BASE_PATH=/nexus/ so
      # asset URLs resolve, then stage the dist under a /nexus/ directory
      # so `serve` exposes the app at http://localhost:3010/nexus/.
      - name: Build mockup-sandbox (NEXUS) with /nexus/ base
        run: pnpm --filter @workspace/mockup-sandbox run build
        env:
          BASE_PATH: /nexus/

      - name: Stage build under /nexus/ and serve on port 3010
        run: |
          mkdir -p served-nexus/nexus
          cp -r artifacts/mockup-sandbox/dist/public/. served-nexus/nexus/
          npm install -g serve
          serve served-nexus -l 3010 &
          sleep 3
        shell: bash

      - name: Run NEXUS smoke tests (mocked API routes)
        run: pnpm exec playwright test tests/e2e/nexus-smoke.spec.ts --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3010

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-nexus-smoke
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces-nexus-smoke
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E Gate
    needs: [e2e-app, a11y, nexus-smoke]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all E2E jobs passed
        run: |
          if [[ "${{ needs.e2e-app.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          if [[ "${{ needs.a11y.result }}" != "success" ]]; then
            echo "Accessibility checks failed"
            exit 1
          fi
          if [[ "${{ needs.nexus-smoke.result }}" != "success" ]]; then
            echo "NEXUS smoke tests failed"
            exit 1
          fi
          echo "All E2E checks passed"
