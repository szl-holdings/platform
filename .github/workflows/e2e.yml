name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  e2e-app:
    name: e2e-app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Terra retired 2026-07-05 (a11oy `realestate` vertical). Consolidation
          # cleanup 2026-07-08: counsel, sentra, and vessels are PRE-consolidation
          # standalone copies whose live homes have moved. They are dropped from the
          # active E2E matrix so the E2E Gate stops gating superseded apps. Each keeps
          # its source in-place with a DEPRECATED.md. This retires superseded apps — it
          # does NOT disable a check for a live surface; the live surfaces are governed
          # and verified in a11oy + killinchu (each has its own CI/readiness harness):
          #   - counsel -> a11oy `legal`  vertical  (GET /api/a11oy/v1/vert/legal  -> consolidated_from:"Counsel")
          #   - sentra  -> a11oy `cyber`  vertical  (GET /api/a11oy/v1/vert/cyber  -> consolidated_from:"Sentra")
          #   - vessels -> killinchu maritime       (GET /api/killinchu/v1/fleet/* + /api/killinchu/v1/maritime/*)
          # carlota-jo REMAINS gated: its a11oy `carlota` vertical is still [seed] with
          # no live feed pack, so this standalone app is still its only live home.
          - app: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 3004
            spec: carlota-jo.spec.ts
          # a11oy — genetic AI substrate, port 3010.
          - app: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist/public
            port: 3010
            spec: a11oy.spec.ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Install dependencies for E2E
        run: |
          echo "Applying ONNXRUNTIME_NODE_INSTALL=skip to the workspace install to avoid the NuGet-dependent postinstall flake."
          ONNXRUNTIME_NODE_INSTALL=skip pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} run build
        env:
          BASE_PATH: /
          # Vessels gates its dashboard behind PrivateAppGuard. Enable the app's
          # built-in demo mode for the vessels build only so the static E2E
          # harness (no auth backend) can render private routes; the spec seeds
          # the demo token. Other apps build without this flag, and production
          # builds never set it, so the real auth guard is unchanged.
          VITE_DEMO_ALLOWED: ${{ matrix.app == 'vessels' && 'true' || '' }}

      - name: Serve ${{ matrix.app }} on port ${{ matrix.port }}
        run: |
          npm install -g serve
          # -s (single-page application mode) rewrites unmatched routes to
          # index.html. Without it `serve` returns its own 404 page for deep
          # client-side routes (e.g. /deals, /fleet-dashboard), so the SPA never
          # boots and route content never renders — only the `/` smoke tests pass.
          serve ${{ matrix.dist }} -s -l ${{ matrix.port }} &
          sleep 3
        shell: bash

      - name: Run E2E tests for ${{ matrix.app }}
        run: pnpm exec playwright test tests/e2e/${{ matrix.spec }} --project=chromium --reporter=list
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) != '' }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}
          VESSELS_BASE_PATH: /
          CARLOTA_BASE_PATH: /
          SENTRA_BASE_PATH: /
          COUNSEL_BASE_PATH: /
          A11OY_BASE_PATH: /

      - name: Skip notice (spec missing)
        if: ${{ hashFiles(format('tests/e2e/{0}', matrix.spec)) == '' }}
        run: echo "::notice::Spec tests/e2e/${{ matrix.spec }} not present — skipping ${{ matrix.app }} E2E."

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces-${{ matrix.app }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.app }}
          path: test-results/**/*.png
          retention-days: 7

  e2e:
    name: E2E Gate
    needs: [e2e-app]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all E2E jobs passed
        run: |
          if [[ "${{ needs.e2e-app.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          echo "All E2E checks passed"
