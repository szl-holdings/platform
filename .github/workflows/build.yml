name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-all:
    name: Build All Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm --filter @workspace/a11oy run build
      - run: pnpm --filter @workspace/sentra run build
      - run: pnpm --filter @workspace/terra run build
      - run: pnpm --filter @workspace/vessels run build
      - run: pnpm --filter @workspace/carlota-jo run build
      - run: pnpm --filter @workspace/counsel run build
