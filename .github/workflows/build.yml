name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-all:
    name: Build All Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm --filter @workspace/a11oy run build
      - run: pnpm --filter @workspace/sentra run build
      - run: pnpm --filter @workspace/terra run build
      - run: pnpm --filter @workspace/vessels run build
      - run: pnpm --filter @workspace/carlota-jo run build
      - run: pnpm --filter @workspace/counsel run build
