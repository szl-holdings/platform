name: Agent Eval Gate

# Blocks model version promotion when evals fail.
#
# EVAL_API_URL + EVAL_API_KEY repo secrets are required. The gate calls
# /api/evals/promote which runs real gateway inference against the candidate
# model. If either secret is missing or the endpoint is unreachable the gate
# hard-blocks (exit 1). No synthetic local inference is used for promotion.
#
# To enforce this as a branch protection required check:
#   GitHub → Settings → Branches → Branch protection rules → main
#   → "Require status checks to pass" → add "Agent Eval Gate / eval-gate"

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'lib/pulse-evals/**'
      - 'artifacts/api-server/**'
      - 'scripts/ci-eval-gate.ts'
      - '.github/workflows/eval-gate.yml'
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent ID to evaluate (e.g. sentinel-maritime, prism-ai)'
        required: false
        default: 'sentinel-maritime'
      model_version:
        description: 'Candidate model version — must be a resolvable gateway model name (e.g. gpt-4o, claude-3-5-sonnet) or a label that includes one as a prefix (e.g. gpt-4o:v2-rc1). Opaque SHA labels are forwarded but may not pin routing.'
        required: false
        default: 'gpt-4o'

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Cache node_modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build pulse-evals library
        run: pnpm --filter @szl-holdings/pulse-evals run build

      # Use the workflow_dispatch input when triggered manually, otherwise fall
      # back to EVAL_MODEL_VERSION repo variable (Settings → Variables), then to
      # gpt-4o. Must be a resolvable gateway model alias — opaque SHA labels will
      # not pin routing and will emit a warning from /evals/promote.
      - name: Run eval gate — sentinel-maritime
        run: |
          pnpm tsx scripts/ci-eval-gate.ts \
            --agent-id ${{ github.event.inputs.agent_id || 'sentinel-maritime' }} \
            --model-version ${{ github.event.inputs.model_version || vars.EVAL_MODEL_VERSION || 'gpt-4o' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}

      - name: Run eval gate — prism-ai
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm tsx scripts/ci-eval-gate.ts \
            --agent-id prism-ai \
            --model-version ${{ vars.EVAL_MODEL_VERSION || 'gpt-4o' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
