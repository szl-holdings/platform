name: Ovis Evaluation Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovis-evaluation-contracts.yml'
      - 'docs/aef/manifests/ovis-omni-embedding-3b.v1.json'
      - 'services/substrate-py-workers/**'
      - 'substrate/docker-compose.gpu.yml'
      - 'substrate/docker-compose.ovis-evaluation.yml.template'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ovis-evaluation-contracts.yml'
      - 'docs/aef/manifests/ovis-omni-embedding-3b.v1.json'
      - 'services/substrate-py-workers/**'
      - 'substrate/docker-compose.gpu.yml'
      - 'substrate/docker-compose.ovis-evaluation.yml.template'

permissions:
  contents: read

concurrency:
  group: ovis-evaluation-contracts-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Locked CPU contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.19
      - name: Verify lock is current
        run: uv lock --check --project services/substrate-py-workers
      - name: Install locked CPU and test dependencies
        run: uv sync --project services/substrate-py-workers --locked --extra dev
      - name: Run substrate worker contracts
        env:
          OTEL_SDK_DISABLED: 'true'
        run: >-
          uv run --project services/substrate-py-workers --locked --extra dev
          pytest services/substrate-py-workers/tests -q
