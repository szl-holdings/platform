name: READINESS-OPERABILITY

# Scores rollback readiness, active maintenance, Docker + env docs.
# Doctrine v11 (LOCKED) 749/14/163. Additive readiness agent — read-only.
# Author: Yachay <yachay@szlholdings.dev>

on:
  schedule:
    - cron: "30 3 * * *"   # daily (UTC)
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: readiness-operability
  cancel-in-progress: false

jobs:
  run:
    name: READINESS-OPERABILITY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir huggingface_hub pynacl

      - name: Run READINESS-OPERABILITY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KHIPU_SIGNING_KEY_B64: ${{ secrets.KHIPU_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11OY_URL: ${{ vars.A11OY_URL }}
          AMARU_URL: ${{ vars.AMARU_URL }}
          SENTRA_URL: ${{ vars.SENTRA_URL }}
          KILLINCHU_URL: ${{ vars.KILLINCHU_URL }}
          ROSIE_URL: ${{ vars.ROSIE_URL }}
          OTEL_COLLECTOR_URL: ${{ vars.OTEL_COLLECTOR_URL }}
        run: python platform/agents/readiness/readiness-operability/executor.py
