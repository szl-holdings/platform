name: Secret Scan (Scheduled — main)

# Daily Gitleaks sweep against the default branch. Complements the
# PR-time Gitleaks gate in `secret-scan.yml` and GitHub-native secret
# scanning + push protection (enabled in repo Settings → Code security).
#
# Why this exists:
# - PR-time gate only catches secrets in the diff of an open PR.
# - GitHub-native secret scanning only matches partner-known patterns.
# - This scheduled job runs the full Gitleaks ruleset against the
#   entire `main` history every day and uploads SARIF so any positive
#   finding shows up in the repo's Security tab and pages CODEOWNERS
#   via the standard GitHub notification channel.
#
# Triage: see `ops/github/secret-scanning-runbook.md`.

on:
  schedule:
    # 06:17 UTC daily — odd minute to avoid the top-of-hour runner spike.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secret-scan-scheduled.yml"
      - ".gitleaks.toml"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  gitleaks-main:
    name: Gitleaks — full history scan of main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (full history) → SARIF
        id: gitleaks
        run: |
          set +e
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Always succeed this step so we can upload the SARIF report;
          # the dedicated `enforce` step below fails the job on findings.
          exit 0

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-scheduled

      - name: Archive SARIF report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif-${{ github.run_id }}
          path: gitleaks.sarif
          retention-days: 90

      - name: Open triage issue on positive finding
        if: steps.gitleaks.outputs.exit_code != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `[security] Scheduled Gitleaks found a potential secret on main (${context.runId})`;
            const body = [
              `The daily scheduled secret scan flagged one or more potential secrets on \`main\`.`,
              ``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- SARIF report: see the **Security → Code scanning** tab (category \`gitleaks-scheduled\`) or the run artifact \`gitleaks-sarif-${context.runId}\`.`,
              ``,
              `Triage steps: \`ops/github/secret-scanning-runbook.md\`.`,
              ``,
              `Do **not** close this issue without rotating any confirmed-leaked credential and recording the rotation in the runbook.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,secret-scan',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'secret-scan'],
            });

      - name: Fail job if Gitleaks reported findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "Gitleaks exited with code ${{ steps.gitleaks.outputs.exit_code }} — see SARIF report and triage issue."
          exit 1
