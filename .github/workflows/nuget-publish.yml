name: Publish NuGet packages to GitHub Packages

# Template workflow — activate when .NET packages are added.
# See docs/github/packages/nuget/SETUP.md

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Path to .NET package directory (e.g. lib/dotnet/SzlHoldings.Core)'
        required: true
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

jobs:
  publish:
    name: NuGet publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure NuGet source
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/szl-holdings/index.json \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Set version from input
        run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Restore dependencies
        run: |
          dotnet restore "${{ github.event.inputs.package_path }}" \
            --configfile docs/github/packages/nuget/nuget.config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build
        run: |
          dotnet build "${{ github.event.inputs.package_path }}" \
            --configuration Release \
            -p:Version=${{ env.RELEASE_VERSION }} \
            --no-restore

      - name: Pack
        run: |
          dotnet pack "${{ github.event.inputs.package_path }}" \
            --configuration Release \
            -p:PackageVersion=${{ env.RELEASE_VERSION }} \
            --no-build \
            --output ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "github" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Summary
        run: |
          echo "## NuGet Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "Published NuGet package(s) to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`https://nuget.pkg.github.com/szl-holdings\`" >> $GITHUB_STEP_SUMMARY
          ls -la ./nupkg/ >> $GITHUB_STEP_SUMMARY
