name: Flagship Health Exact Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/flagship-health-exact-recovery.yml
  workflow_run:
    workflows: [warm-flagships]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: flagship-health-exact-recovery-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CONTROLLER_REVISION: 4946389762f44e84a2c22b5cfc16f5a5d751670f
  REPORT_ROOT: reports/flagship-health-exact-recovery

jobs:
  verify-controller:
    name: Verify exact recovery controller
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.id == 30221104485 &&
       github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out proposed or exact protected controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && env.CONTROLLER_REVISION || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test exact incident transitions
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(git rev-parse HEAD)" = "$CONTROLLER_REVISION"
          fi
          python -m py_compile \
            .github/scripts/warm_flagships.py \
            .github/scripts/test_warm_flagships.py
          python .github/scripts/test_warm_flagships.py
          git diff --check

  reconcile:
    name: Reconcile recovered incident — ${{ matrix.organ }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 30221104485 &&
      github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    needs: verify-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - organ: a11oy
            probe: https://szlholdings-a11oy.hf.space/healthz
          - organ: killinchu
            probe: https://szlholdings-killinchu.hf.space/healthz
          - organ: yarqa
            probe: https://szlholdings-yarqa.hf.space/healthz
          - organ: hatun-mcp
            probe: https://szlholdings-hatun-mcp.hf.space/healthz
          - organ: anatomy
            probe: https://szlholdings-anatomy.hf.space/healthz
    steps:
      - name: Check out the exact protected controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CONTROLLER_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Probe and reconcile only from repeated current evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROLLER_REVISION"
          python .github/scripts/warm_flagships.py \
            --organ "${{ matrix.organ }}" \
            --probe-url "${{ matrix.probe }}" \
            --attempts 3 \
            --confirmations 2 \
            --timeout 25 \
            --interval 2 \
            --report "$REPORT_ROOT/${{ matrix.organ }}.json" \
            --mutate-issues

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flagship-health-exact-recovery-${{ matrix.organ }}-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/${{ matrix.organ }}.json
          if-no-files-found: error
          retention-days: 90

  wake-receipt:
    name: Record bounded post-recovery wake receipt
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 30221104485 &&
      github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
      github.event.workflow_run.conclusion == 'success'
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: POST bounded wake receipt
        run: |
          set +e
          curl -sS -X POST --max-time 25 \
            "https://szlholdings-a11oy.hf.space/api/a11oy/v3/kernels/wake-receipt" \
            -H "content-type: application/json" \
            -d "{\"source\":\"github-actions/flagship-health-exact-recovery\",\"run\":\"${GITHUB_RUN_ID}\",\"ts\":\"$(date -u +%FT%TZ)\"}" \
            -o /tmp/wake \
            -w "wake-receipt -> %{http_code}\n"
          head -c 500 /tmp/wake || true
