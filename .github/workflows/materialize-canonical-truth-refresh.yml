name: Materialize canonical truth refresh

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-canonical-truth-refresh.yml

permissions:
  contents: write

concurrency:
  group: materialize-canonical-truth-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/refresh-canonical-truth-current-main-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.26.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Regenerate, validate, and publish one-file successor
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        shell: bash
        run: |
          set -euo pipefail
          protected_main='48b0ea169de75990e44b6ec924e59fe7d76e6020'
          test "$(git rev-parse origin/main)" = "$protected_main"
          git merge-base --is-ancestor '693f519ef0c529b60063fadfd6c5a6d67d3c1f18' origin/main

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff origin/main \
            -m 'chore(truth): integrate current protected main' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'

          rm -f .github/workflows/materialize-canonical-truth-refresh.yml
          pnpm install --frozen-lockfile
          pnpm truth:generate
          pnpm truth:generate -- --verify-local
          pnpm claims:validate
          node - <<'NODE'
          const fs = require('fs');
          const truth = JSON.parse(fs.readFileSync('artifacts/SOURCE_OF_TRUTH.json', 'utf8'));
          if (truth.schema !== 'szl.truth/v1') throw new Error('unexpected truth schema');
          if (truth.generated_by !== 'tools/truth/generate-truth.ts@szl.truth/v1') {
            throw new Error('unexpected truth generator');
          }
          const age = Date.now() - Date.parse(truth.generated_at);
          if (!Number.isFinite(age) || age < -300000 || age > 900000) {
            throw new Error(`generated_at is not current: ${truth.generated_at}`);
          }
          if (truth.metrics.ci_workflows.value !== 45) {
            throw new Error(`unexpected permanent workflow count: ${truth.metrics.ci_workflows.value}`);
          }
          console.log(JSON.stringify({
            generated_at: truth.generated_at,
            workflows: truth.metrics.ci_workflows,
            hf_models: truth.metrics.hf_models,
            hf_datasets: truth.metrics.hf_datasets,
            hf_spaces: truth.metrics.hf_spaces,
            hf_collections: truth.metrics.hf_collections,
            receipt_chain_depth: truth.metrics.receipt_chain_depth,
          }, null, 2));
          NODE
          git add -A
          git diff --cached --check origin/main
          test ! -e .github/workflows/materialize-canonical-truth-refresh.yml
          changed="$(git diff --cached --name-only origin/main)"
          test "$changed" = 'artifacts/SOURCE_OF_TRUTH.json'

          git commit -m 'chore(truth): refresh canonical evidence' \
            -m 'Regenerate local metrics and live public evidence.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin HEAD:chore/refresh-canonical-truth-current-main-20260820
