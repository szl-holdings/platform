name: Materialize provider-neutral screenshot successor

on:
  push:
    branches:
      - fix/provider-neutral-screenshot-proof-successor-20260818

permissions:
  contents: write

concurrency:
  group: materialize-provider-neutral-screenshot-successor
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build clean current-main successor
        shell: bash
        run: |
          set -euo pipefail
          source_revision='c228fe4fc9a0ef364dde3144e6d4af508d3a529e'
          source_branch='fix/provider-neutral-screenshot-proof-20260818'

          git fetch --no-tags origin "$source_branch"
          git checkout "$source_revision" -- \
            .github/workflows/screenshot-proof.yml \
            AGENTS.md \
            SOURCE_OF_TRUTH.md \
            artifacts/SOURCE_OF_TRUTH.json \
            audit/PROVIDER_NEUTRAL_SCREENSHOT_PROOF_2026-08-18.md \
            audit/README.md \
            audit/screenshot-capture-plan.json \
            audit/screenshot-proof-selftest-plan.json \
            audit/source-of-truth.json \
            docs/A11OY_EXECUTION_ENVIRONMENT_DOCTRINE.md \
            docs/A11OY_SCREENSHOT_DOCTRINE.md \
            scripts/qa/capture-screenshot-proof.mjs \
            scripts/qa/fixtures/screenshot-proof/index.html

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'content/demos/executive-tour.md': [
                  ('45 CI/CD workflows', '46 CI/CD workflows'),
              ],
              'content/docs/architecture.md': [
                  ('Replit managed hosting', 'Provider-neutral deployment and evidence rails'),
                  ('GitHub Actions CI/CD (45 workflows', 'GitHub Actions CI/CD (46 workflows'),
              ],
              'content/trust/architecture-overview.md': [
                  ('GitHub Actions (45 workflows', 'GitHub Actions (46 workflows'),
                  ('| Hosting | Replit managed infrastructure |',
                   '| Hosting | Provider-neutral; current state requires exact-source readback |'),
              ],
              'content-package/posts/medium-a11oy-definition.html': [
                  ('45 GitHub Actions workflows', '46 GitHub Actions workflows'),
              ],
              'content-package/posts/medium-a11oy-definition.md': [
                  ('45 GitHub Actions workflows', '46 GitHub Actions workflows'),
              ],
              'docs/a11oy/A11OY.md': [
                  ('45 GitHub Actions workflows', '46 GitHub Actions workflows'),
              ],
              'docs/operations/github-setup.md': [
                  ('45 workflows measured', '46 workflows measured'),
                  ('| Environment secrets | ⬜ Manual — add `REPLIT_DEPLOY_TOKEN`, '
                   '`REPLIT_APP_ID`, staging variants |',
                   '| Environment secrets | ⬜ Configure only credentials required by '
                   'the selected active provider |'),
                  ('- [ ] Add secrets: `REPLIT_STAGING_DEPLOY_TOKEN`, '
                   '`REPLIT_STAGING_APP_ID`',
                   '- [ ] Add only credentials required by the selected staging provider'),
                  ('- [ ] Add secrets: `REPLIT_DEPLOY_TOKEN`, `REPLIT_APP_ID`',
                   '- [ ] Add only credentials required by the selected production provider'),
                  ('- [ ] `REPLIT_DEPLOY_TOKEN` — Replit deploy token for production\n'
                   '- [ ] `REPLIT_APP_ID` — Replit app ID for production\n'
                   '- [ ] `REPLIT_STAGING_DEPLOY_TOKEN` — Replit deploy token for staging\n'
                   '- [ ] `REPLIT_STAGING_APP_ID` — Replit app ID for staging',
                   'No Replit credential is required. Configure provider-specific '
                   'credentials only in protected GitHub environments, and record '
                   'their names in the environment inventory.'),
              ],
              'ops/frontier/current-vs-target-architecture.md': [
                  ('- **Host:** Replit (Autoscale deployment)\n'
                   '- **DB:** Replit-managed PostgreSQL 16 (561+ tables in `lib/db`)\n'
                   '- **Secrets:** Mix of Replit Secrets panel + hardcoded values in '
                   '`.replit [userenv.shared]` — **NON-COMPLIANT**\n'
                   '- **CI/CD:** 45 GitHub workflows are measured in '
                   '`artifacts/SOURCE_OF_TRUTH.json`; archival workflow state is '
                   'tracked separately',
                   '- **Host:** Provider-neutral; identify the active deployment through '
                   'current exact-source readback\n'
                   '- **DB:** Managed PostgreSQL; provider and live table count are '
                   '`UNAVAILABLE` in this historical document\n'
                   '- **Secrets:** Protected environment or secret stores only; no Replit '
                   'credential is required\n'
                   '- **CI/CD:** 46 GitHub workflows are measured in '
                   '`artifacts/SOURCE_OF_TRUTH.json`; archival workflow state is '
                   'tracked separately'),
                  ('| `OAUTH_STATE_SECRET` | Replit Secrets panel only (NOT in .replit) |',
                   '| `OAUTH_STATE_SECRET` | Protected environment secret store |'),
                  ('| `VAPID_PRIVATE_KEY` | Replit Secrets panel only (NOT in .replit) |',
                   '| `VAPID_PRIVATE_KEY` | Protected environment secret store |'),
                  ('| `VAPID_PUBLIC_KEY` | .replit [userenv.shared] (public key — safe) |',
                   '| `VAPID_PUBLIC_KEY` | Versioned public configuration |'),
                  ('| `VAPID_SUBJECT` | .replit [userenv.shared] (email — safe) |',
                   '| `VAPID_SUBJECT` | Versioned non-secret configuration |'),
                  ('| All other secrets | Replit Secrets panel |',
                   '| All other secrets | Protected environment secret store |'),
              ],
              'ops/frontier/repo-topology-map.md': [
                  ('Generated: 2026-04-16 (updated)\n',
                   'Generated: 2026-04-16 (historical snapshot)\n\n'
                   '> Replit references below describe historical repository structure. '
                   'They are not current execution requirements.\n'),
                  ('.github/workflows/            # 45 CI/CD workflows (MEASURED)',
                   '.github/workflows/            # 46 CI/CD workflows (MEASURED)'),
                  ('.replit                       # Replit workspace config',
                   '.replit                       # Historical compatibility config only'),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          bcp = Path('content/trust/bcp-dr.md')
          bcp.write_text('''# Business Continuity & Disaster Recovery — SZL Holdings

## Evidence status

The active hosting provider, managed database provider, backup retention,
restore test date, RTO, and RPO require current provider readback. This
source-only document does not manufacture those values.

## Backup strategy

- **Database:** Require provider-native encrypted backups, retention evidence,
  and a tested restore receipt before publishing an RPO claim.
- **Codebase:** GitHub is the canonical source repository with protected history.
- **Configuration:** Infrastructure and deployment policy are versioned in source.
- **Secrets:** Protected environment or secret stores only; values are never
  committed or reported.

## Recovery objectives

| Metric | Target | Current evidence |
|---|---:|---|
| Recovery Time Objective (RTO) | < 4 hours | UNAVAILABLE — provider readback required |
| Recovery Point Objective (RPO) | < 24 hours | UNAVAILABLE — backup evidence required |
| Maximum Tolerable Downtime | 8 hours | ROADMAP target, not a measured result |

## Disaster scenarios

### Database failure

- Restore from the active provider's verified backup.
- Validate schema, receipt continuity, and application health before reopening.

### Application failure

- Roll back to an exact known-good source and immutable artifact digest.
- Require health, source-binding, and evidence readback after restart.

### Code compromise

- Use GitHub code scanning and dependency evidence.
- Revert through a protected pull request and rotate affected credentials.

### Infrastructure failure

- Activate the documented provider-independent recovery path.
- Report `UNAVAILABLE` until the replacement deployment is source-bound and healthy.

## Continuity measures

- Full Git history and protected merge controls.
- 46 GitHub workflows are inventoried in `artifacts/SOURCE_OF_TRUTH.json`;
  current results remain separate evidence.
- Health and readiness endpoints with bounded terminal states.
- Structured audit and receipt evidence for forensic reconstruction.

*Last updated: August 18, 2026*
''', encoding='utf-8')
          PY

          rm -f .github/workflows/materialize-provider-neutral-screenshot-successor.yml
          git add -A
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'docs(doctrine): publish provider-neutral proof successor' \
            -m 'Replace the retired Replit-only screenshot requirement with an exact-source rail.' \
            -m 'Reconcile the measured 46-workflow truth and remove current Replit requirements.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar@gmail.com>'
          git push origin HEAD:fix/provider-neutral-screenshot-proof-successor-20260818
