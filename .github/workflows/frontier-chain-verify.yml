name: frontier-chain-verify

# Receipt-chain gate for tools/a11oy_frontier.py (Token-State Frontier).
#
# The tool's whole claim is that ingress/state measurements are accountable:
# every measurement emits a content-addressed receipt chained to its
# predecessor, evidence labels cannot be laundered into MEASURED, and reusable
# state blocks are gated against the locked formula set at kernel c7c0ba17.
# This workflow makes that claim testable on every change.
#
# Four gates, in order of strictness:
#   1. self-test the guard  -- 60+ invariant assertions (I1..I6), offline
#   2. real sweep            -- run the tool and re-verify its own ledger
#   3. NEGATIVE CONTROL      -- tamper a receipt and require verify to go RED
#   4. egress guard          -- no private mesh address in published output
#
# Gate 3 is the important one. A verifier that has never been observed failing
# is not a verifier. If tampering ever stops turning this red, the gate is
# broken even when everything else is green.
#
# Trigger scope is limited to the tool, its test, its doc, and this workflow,
# so it acts as a forcing function for the frontier tooling specifically.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/a11oy_frontier.py'
      - 'tools/test_a11oy_frontier.py'
      - 'docs/A11OY_TOKEN_STATE_FRONTIER.md'
      - '.github/workflows/frontier-chain-verify.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'tools/a11oy_frontier.py'
      - 'tools/test_a11oy_frontier.py'
      - 'docs/A11OY_TOKEN_STATE_FRONTIER.md'
      - '.github/workflows/frontier-chain-verify.yml'

permissions:
  contents: read

concurrency:
  group: frontier-chain-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Invariants, sweep, tamper negative control, egress guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outputs land outside the repo tree so a CI run can never commit its own
      # receipts back into the source of truth. This is set in a step, not in a
      # workflow-level `env:`, because the `runner` context is only available
      # inside steps — referencing it at workflow level is a startup failure.
      - name: Resolve the output root
        run: echo "A11OY_ROOT=$RUNNER_TEMP/frontier-run" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # No engine is installed on purpose in this step's environment: the tool
      # must degrade to UNAVAILABLE receipts rather than crash or invent zeros.
      - name: Gate 1 — self-test the guard (I1..I6, offline)
        run: python tools/test_a11oy_frontier.py

      # tiktoken gives the sweep at least one REAL measured engine, so gate 2
      # exercises the MEASURED path and not only the UNAVAILABLE path.
      - name: Install one real ingress engine (tiktoken)
        run: python -m pip install --disable-pip-version-check --quiet tiktoken

      - name: Gate 2 — full sweep, then re-verify the emitted chain
        run: |
          set -eu
          mkdir -p "$A11OY_ROOT"
          python tools/a11oy_frontier.py all --mb 2 --engines tiktoken
          python tools/a11oy_frontier.py verify

      - name: Gate 2b — assert the sweep produced at least one MEASURED receipt
        run: |
          set -eu
          python - <<'PY'
          import json, os, pathlib, sys
          led = pathlib.Path(os.environ["A11OY_ROOT"]) / "output" / "receipts.jsonl"
          recs = [json.loads(l) for l in led.read_text().splitlines() if l.strip()]
          measured = [r for r in recs if r["label"] == "MEASURED"]
          print(f"{len(recs)} receipts, {len(measured)} MEASURED")
          if not measured:
              sys.exit("no MEASURED receipt: the sweep measured nothing")
          kernels = {r["kernel"] for r in recs}
          if kernels != {"c7c0ba17"}:
              sys.exit(f"foreign kernel in ledger: {kernels}")
          PY

      # ---------------------------------------------------------------------
      # NEGATIVE CONTROL. Mutate one receipt body, then require the verifier to
      # exit non-zero. `verify` returning 0 here means the chain gate is inert
      # and every green run above is meaningless.
      # ---------------------------------------------------------------------
      - name: Gate 3 — tampered receipt MUST fail verification
        run: |
          set -eu
          python - <<'PY'
          import json, os, pathlib
          led = pathlib.Path(os.environ["A11OY_ROOT"]) / "output" / "receipts.jsonl"
          lines = led.read_text().splitlines()
          rec = json.loads(lines[0])
          rec["body"]["tampered_overclaim_gb_per_sec"] = 999.0
          lines[0] = json.dumps(rec, sort_keys=True, separators=(",", ":"))
          led.write_text("\n".join(lines) + "\n")
          print("injected an overclaim into receipt 0")
          PY
          if python tools/a11oy_frontier.py verify; then
            echo "::error::receipt-chain gate is INERT: a tampered ledger verified clean"
            exit 1
          fi
          echo "negative control passed: tampering turned the chain red as designed"

      - name: Gate 4 — egress guard on published output
        run: |
          set -eu
          # Re-run on a clean root so the tampered ledger is not what we scan.
          rm -rf "$A11OY_ROOT"
          mkdir -p "$A11OY_ROOT"
          python tools/a11oy_frontier.py all --mb 1 --engines tiktoken >/dev/null
          if grep -rnE '\b(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01])|127\.0\.0)\.[0-9.]+' \
               "$A11OY_ROOT/output" ; then
            echo "::error::private address reached published output (I6 violated)"
            exit 1
          fi
          if grep -rniE '[a-z0-9-]+\.(internal|ts\.net|lan)\b' "$A11OY_ROOT/output" ; then
            echo "::error::internal hostname reached published output (I6 violated)"
            exit 1
          fi
          echo "egress guard passed"
          python tools/a11oy_frontier.py verify

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-evidence
          path: ${{ env.A11OY_ROOT }}/output
          if-no-files-found: warn
          retention-days: 14
