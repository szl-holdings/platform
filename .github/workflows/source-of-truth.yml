name: Source of Truth

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'SOURCE_OF_TRUTH.md'
      - 'audit/README.md'
      - 'audit/source-of-truth.json'
      - 'docs/GLOSSARY.md'
      - 'scripts/audit/validate-source-of-truth.js'
      - '.github/workflows/**'
      - '.env.example'
      - 'apps/**'
      - 'artifacts/**'
      - 'lib/**'
      - 'packages/**'
      - 'services/**'
      - 'workers/**'
  push:
    branches: [main]
    paths:
      - 'SOURCE_OF_TRUTH.md'
      - 'audit/README.md'
      - 'audit/source-of-truth.json'
      - 'docs/GLOSSARY.md'
      - 'scripts/audit/validate-source-of-truth.js'
      - '.github/workflows/**'
      - '.env.example'
      - 'apps/**'
      - 'artifacts/**'
      - 'lib/**'
      - 'packages/**'
      - 'services/**'
      - 'workers/**'

permissions:
  contents: read

concurrency:
  group: source-of-truth-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical metrics and vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/audit/validate-source-of-truth.js
