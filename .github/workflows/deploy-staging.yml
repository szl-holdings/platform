name: Staging — Provider-Neutral Validation

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: staging-validation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-validation:
    name: Staging source validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: \${{ github.sha }}

      - name: Validate staging source
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -d .github/workflows
          echo "Staging source validation passed for $GITHUB_SHA"
          echo "External deployment provider is disabled. No Replit request was sent."

      - name: Deployment summary
        if: always()
        env:
          VALIDATION_OUTCOME: \${{ steps.validate.outcome }}
        run: |
          echo "## Staging Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source validation:** $VALIDATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment provider:** disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment request:** skipped by configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runtime readiness:** unverified because no external provider is configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** \${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** \${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"