name: Deploy — Staging

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Determine deploy info
        run: |
          echo "Deploying to staging"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Verify staging configuration
        id: verify
        run: |
          if [ -z "${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}" ]; then
            echo "::warning::REPLIT_STAGING_DEPLOY_TOKEN not configured — staging deployment skipped"
            echo "Configure this secret in Settings → Environments → staging"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Staging deployment configuration verified"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger staging deployment
        if: steps.verify.outputs.skip != 'true'
        run: |
          echo "Triggering Replit staging deployment..."
          REPLIT_APP_ID="${{ secrets.REPLIT_STAGING_APP_ID }}"
          REPLIT_DEPLOY_TOKEN="${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}"

          if [ -n "$REPLIT_APP_ID" ] && [ -n "$REPLIT_DEPLOY_TOKEN" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $REPLIT_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              "https://replit.com/api/v1/repls/$REPLIT_APP_ID/deployments" \
              2>/dev/null || echo "000")

            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "Staging deployment triggered successfully (HTTP $RESPONSE)"
            elif [ "$RESPONSE" = "000" ]; then
              echo "::warning::Could not reach Replit API — staging deployment may need to be triggered manually"
            else
              echo "::error::Replit staging deployment API returned HTTP $RESPONSE"
              exit 1
            fi
          else
            echo "::warning::REPLIT_STAGING_APP_ID not configured — staging deployment skipped"
            echo "To enable automated staging deployment, set REPLIT_STAGING_APP_ID and REPLIT_STAGING_DEPLOY_TOKEN"
            echo "in Settings → Environments → staging"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Staging Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To configure staging deployment secrets, see Settings → Environments → staging." >> "$GITHUB_STEP_SUMMARY"
