name: Deploy — Staging

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Determine deploy info
        run: |
          echo "Deploying to staging"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Verify staging configuration
        id: verify
        shell: bash
        env:
          REPLIT_APP_ID: ${{ secrets.REPLIT_STAGING_APP_ID }}
          REPLIT_DEPLOY_TOKEN: ${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REPLIT_APP_ID" ] || [ -z "$REPLIT_DEPLOY_TOKEN" ]; then
            echo "::error::BLOCKED: staging app ID or deployment token is not configured; no request sent"
            exit 1
          fi
          echo "Required staging configuration is present; provider authority remains unverified"

      - name: Trigger staging deployment
        id: trigger
        shell: bash
        env:
          REPLIT_APP_ID: ${{ secrets.REPLIT_STAGING_APP_ID }}
          REPLIT_DEPLOY_TOKEN: ${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REPLIT_APP_ID" ] || [ -z "$REPLIT_DEPLOY_TOKEN" ]; then
            echo "::error::BLOCKED: staging app ID or deployment token is not configured; no request sent"
            exit 1
          fi

          # One bounded request; do not retry or follow redirects after rejection.
          if RESPONSE=$(curl -q --globoff --silent --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $REPLIT_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            "https://replit.com/api/v1/repls/$REPLIT_APP_ID/deployments"); then
            if ! [[ "$RESPONSE" =~ ^[0-9]{3}$ ]]; then
              echo "::error::Replit staging API returned an invalid HTTP status; request acceptance is unverified"
              exit 1
            fi
          else
            CURL_EXIT=$?
            echo "::error::Replit staging request failed (curl exit=$CURL_EXIT); request acceptance is unverified"
            exit 1
          fi

          if [[ "$RESPONSE" =~ ^2[0-9]{2}$ ]]; then
            echo "Staging deployment request accepted (HTTP $RESPONSE); deployment readiness is unverified"
          else
            echo "::error::Replit staging API returned HTTP $RESPONSE; request rejected or acceptance unverified"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        env:
          CONFIGURATION_OUTCOME: ${{ steps.verify.outcome }}
          REQUEST_OUTCOME: ${{ steps.trigger.outcome }}
        run: |
          echo "## Staging Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Configuration check:** $CONFIGURATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment request step:** $REQUEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment readiness:** UNKNOWN (request acceptance is not runtime verification)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To configure staging deployment secrets, see Settings → Environments → staging." >> "$GITHUB_STEP_SUMMARY"
