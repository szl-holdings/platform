name: Deploy — Staging

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Determine deploy info
        run: |
          echo "Deploying to staging"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Verify staging configuration
        id: verify
        run: |
          if [ -z "${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}" ]; then
            echo "::warning::REPLIT_STAGING_DEPLOY_TOKEN not configured — staging deployment skipped"
            echo "Configure this secret in Settings → Environments → staging"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Staging deployment configuration verified"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger staging deployment
        if: steps.verify.outputs.skip != 'true'
        # Fail-soft: emit warnings on Replit API failures but never fail the
        # GitHub Actions job. Staging is best-effort — a 403 from an expired
        # token should be reported, not block the release pipeline.
        shell: bash
        run: |
          set +e
          echo "Triggering Replit staging deployment..."
          REPLIT_APP_ID="${{ secrets.REPLIT_STAGING_APP_ID }}"
          REPLIT_DEPLOY_TOKEN="${{ secrets.REPLIT_STAGING_DEPLOY_TOKEN }}"

          if [ -z "$REPLIT_APP_ID" ] || [ -z "$REPLIT_DEPLOY_TOKEN" ]; then
            echo "::warning::REPLIT_STAGING_APP_ID or REPLIT_STAGING_DEPLOY_TOKEN not configured — staging deployment skipped"
            echo "To enable automated staging deployment, set both secrets in Settings → Environments → staging"
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $REPLIT_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            "https://replit.com/api/v1/repls/$REPLIT_APP_ID/deployments" \
            2>/dev/null)
          CURL_EXIT=$?
          # Default RESPONSE to a sentinel if curl produced nothing
          if [ -z "$RESPONSE" ] || ! [[ "$RESPONSE" =~ ^[0-9]+$ ]]; then
            RESPONSE="000"
          fi

          if [ "$CURL_EXIT" -ne 0 ] || [ "$RESPONSE" = "000" ]; then
            echo "::warning::Could not reach Replit API (curl exit=$CURL_EXIT, http=$RESPONSE) — trigger staging manually if needed"
            exit 0
          fi

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Staging deployment triggered successfully (HTTP $RESPONSE)"
            exit 0
          fi

          if [ "$RESPONSE" = "401" ] || [ "$RESPONSE" = "403" ]; then
            echo "::warning::Replit staging deployment API returned HTTP $RESPONSE — REPLIT_STAGING_DEPLOY_TOKEN is likely expired. Rotate it in Settings → Environments → staging. (fail-soft, not blocking release)"
          else
            echo "::warning::Replit staging deployment API returned HTTP $RESPONSE — unexpected response, investigate. (fail-soft, not blocking release)"
          fi
          exit 0

      - name: Deployment summary
        if: always()
        run: |
          echo "## Staging Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To configure staging deployment secrets, see Settings → Environments → staging." >> "$GITHUB_STEP_SUMMARY"
