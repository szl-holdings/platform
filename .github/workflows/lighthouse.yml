name: Lighthouse CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lighthouse:
    name: Lighthouse / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: terra
            filter: "@workspace/terra"
            dist: artifacts/terra/dist/public
            port: 3002
          - name: vessels
            filter: "@workspace/vessels"
            dist: artifacts/vessels/dist/public
            port: 3003
          - name: carlota-jo
            filter: "@workspace/carlota-jo"
            dist: artifacts/carlota-jo/dist/public
            port: 3004
          - name: sentra
            filter: "@workspace/sentra"
            dist: artifacts/sentra/dist/public
            port: 3007
          - name: counsel
            filter: "@workspace/counsel"
            dist: artifacts/counsel/dist/public
            port: 3008
          - name: a11oy
            filter: "@workspace/a11oy"
            dist: artifacts/a11oy/dist/public
            port: 3010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build
        env:
          # Build with root base so the standalone `serve` at localhost:<port>/
          # resolves assets. Production serves each app under /<app>/ via BASE_PATH.
          BASE_PATH: /

      - name: Install static file server
        run: npm install -g serve

      - name: Serve ${{ matrix.app.name }} on port ${{ matrix.app.port }}
        run: |
          serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} &
          sleep 3
        shell: bash

      - name: Run Lighthouse CI (warnings only — not a hard gate)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            http://localhost:${{ matrix.app.port }}/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.app.name }}
          runs: 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse-gate:
    name: Lighthouse Gate (accessibility enforced)
    needs: lighthouse
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce Lighthouse accessibility gate
        run: |
          echo "Lighthouse audits completed."
          echo "Thresholds: Performance ≥ 80 (warn), Accessibility ≥ 90 (error/hard), Best Practices ≥ 90 (warn), SEO ≥ 90 (warn)"
          echo "See audit/performance/lighthouse-baseline.md for baseline scores."
          echo "See audit/A11OY_ACCESSIBILITY_AUDIT.md for current WCAG 2.1 AA audit findings."
          if [[ "${{ needs.lighthouse.result }}" == "failure" ]]; then
            echo "::error::One or more Lighthouse jobs failed. Accessibility threshold (≥ 90) is enforced — fix WCAG violations before merge."
            exit 1
          fi
          echo "All Lighthouse checks passed."
