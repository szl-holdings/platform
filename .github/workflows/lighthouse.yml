name: Lighthouse CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse / ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: szl-holdings
            filter: "@workspace/szl-holdings"
            dist: artifacts/szl-holdings/dist
            port: 4000
          - name: lyte-command-center
            filter: "@workspace/lyte-command-center"
            dist: artifacts/lyte-command-center/dist
            port: 4001
          - name: firestorm
            filter: "@workspace/firestorm"
            dist: artifacts/firestorm/dist
            port: 4002
          - name: stephen-site
            filter: "@workspace/stephen-site"
            dist: artifacts/stephen-site/dist
            port: 4003
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fe52bf0ad0164d2310b5e4d5d7bfec47b67e3f9d
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app.name }}
        run: pnpm --filter ${{ matrix.app.filter }} run build

      - name: Install static file server
        run: npm install -g serve

      - name: Serve ${{ matrix.app.name }} on port ${{ matrix.app.port }}
        run: |
          serve ${{ matrix.app.dist }} -l ${{ matrix.app.port }} &
          sleep 3
        shell: bash

      # treosh/lighthouse-ci-action pinned to SHA — verify at github.com/treosh/lighthouse-ci-action/releases
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@1b0e7c33270fbba31a18a0fca0bc3d8ea4ae3e79
        with:
          urls: |
            http://localhost:${{ matrix.app.port }}/
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.app.name }}
          runs: 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
