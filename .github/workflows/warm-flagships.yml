# SPDX-License-Identifier: Apache-2.0
# Keep the live Hugging Face flagship Spaces warm and maintain one honest,
# de-duplicated incident per organ. The controller requires repeated HTTP
# evidence, treats network-only failures as UNKNOWN, and closes an existing
# incident only after repeated HTTP 200 recovery evidence.
name: warm-flagships

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/scripts/warm_flagships.py
      - .github/scripts/test_warm_flagships.py
      - .github/workflows/warm-flagships.yml
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/warm_flagships.py
      - .github/scripts/test_warm_flagships.py
      - .github/workflows/warm-flagships.yml
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: warm-flagships-${{ github.event.workflow_run.id || (github.event_name == 'pull_request' && github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  CONTROLLER_REVISION: 4946389762f44e84a2c22b5cfc16f5a5d751670f
  REPORT_ROOT: reports/flagship-health

jobs:
  controller-contract:
    name: Flagship health state-machine contract
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.id == 30221104515 &&
       github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the exact controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && env.CONTROLLER_REVISION || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test the complete incident lifecycle
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(git rev-parse HEAD)" = "$CONTROLLER_REVISION"
          fi
          python -m py_compile \
            .github/scripts/warm_flagships.py \
            .github/scripts/test_warm_flagships.py
          python .github/scripts/test_warm_flagships.py
          git diff --check

  probe-pull-request:
    name: Read-only live probe — ${{ matrix.organ }}
    if: github.event_name == 'pull_request'
    needs: controller-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - organ: a11oy
            probe: https://szlholdings-a11oy.hf.space/healthz
          - organ: killinchu
            probe: https://szlholdings-killinchu.hf.space/healthz
          - organ: yarqa
            probe: https://szlholdings-yarqa.hf.space/healthz
          - organ: hatun-mcp
            probe: https://szlholdings-hatun-mcp.hf.space/healthz
          - organ: anatomy
            probe: https://szlholdings-anatomy.hf.space/healthz
    steps:
      - name: Check out proposed controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect live evidence without issue or Space mutation
        run: |
          python .github/scripts/warm_flagships.py \
            --organ "${{ matrix.organ }}" \
            --probe-url "${{ matrix.probe }}" \
            --attempts 3 \
            --confirmations 2 \
            --timeout 25 \
            --interval 2 \
            --report "$REPORT_ROOT/${{ matrix.organ }}.json"

      - name: Upload immutable pull-request probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flagship-health-pr-${{ matrix.organ }}-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/${{ matrix.organ }}.json
          if-no-files-found: error
          retention-days: 30

  warm:
    name: Warm and reconcile incident — ${{ matrix.organ }}
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.id == 30221104515 &&
        github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'))
    needs: controller-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - organ: a11oy
            probe: https://szlholdings-a11oy.hf.space/healthz
          - organ: killinchu
            probe: https://szlholdings-killinchu.hf.space/healthz
          - organ: yarqa
            probe: https://szlholdings-yarqa.hf.space/healthz
          - organ: hatun-mcp
            probe: https://szlholdings-hatun-mcp.hf.space/healthz
          - organ: anatomy
            probe: https://szlholdings-anatomy.hf.space/healthz
    steps:
      - name: Check out the exact protected controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && env.CONTROLLER_REVISION || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Probe and reconcile the exact incident lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(git rev-parse HEAD)" = "$CONTROLLER_REVISION"
          fi
          python .github/scripts/warm_flagships.py \
            --organ "${{ matrix.organ }}" \
            --probe-url "${{ matrix.probe }}" \
            --attempts 3 \
            --confirmations 2 \
            --timeout 25 \
            --interval 2 \
            --report "$REPORT_ROOT/${{ matrix.organ }}.json" \
            --mutate-issues

      - name: Upload immutable protected-run health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flagship-health-${{ matrix.organ }}-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/${{ matrix.organ }}.json
          if-no-files-found: error
          retention-days: 90

  wake-receipt:
    name: Record the wake attempt in A11oy
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.id == 30221104515 &&
        github.event.workflow_run.head_sha == 'beca8354fef69711e9f96c849a16d0b9138da271' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'))
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: POST bounded wake receipt
        run: |
          set +e
          curl -sS -X POST --max-time 25 \
            "https://szlholdings-a11oy.hf.space/api/a11oy/v3/kernels/wake-receipt" \
            -H "content-type: application/json" \
            -d "{\"source\":\"github-actions/warm-flagships\",\"run\":\"${GITHUB_RUN_ID}\",\"ts\":\"$(date -u +%FT%TZ)\"}" \
            -o /tmp/wake \
            -w "wake-receipt -> %{http_code}\n"
          head -c 500 /tmp/wake || true
