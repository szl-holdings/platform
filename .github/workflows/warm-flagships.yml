# SPDX-License-Identifier: Apache-2.0
# Warm the 5 flagship Spaces so HF never sleeps them (Option A: external cron heartbeat).
# Every 10 min: GET /healthz on each flagship. On 5xx/unreachable, open a de-duped issue.
# A final job POSTs a wake-receipt to a11oy so the wake itself is signed into the Khipu.
# Doctrine v11 (749/14/163). Sign: Yachay <yachay@szlholdings.dev>.
name: warm-flagships
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (UTC)
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organ: [amaru, a11oy, sentra, rosie, killinchu]
    steps:
      - name: Ping flagship /healthz
        id: ping
        run: |
          set +e
          BASE="https://szlholdings-${{ matrix.organ }}.hf.space"
          # a11oy/amaru/sentra/killinchu namespace healthz under /api/<organ>/healthz; rosie at /healthz
          for path in "/healthz" "/api/${{ matrix.organ }}/healthz"; do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 25 "$BASE$path")
            echo "GET $BASE$path -> $CODE"
            if [ "$CODE" = "200" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; cat /tmp/body | head -c 400; exit 0; fi
          done
          echo "ok=0" >> "$GITHUB_OUTPUT"
          echo "last_code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Open de-duped issue on failure
        if: steps.ping.outputs.ok != '1'
        uses: actions/github-script@v9
        with:
          script: |
            const organ = '${{ matrix.organ }}';
            const title = `flagship ${organ} unhealthy (warm-flagships)`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const body = `Automated warm-flagships probe could not reach a 200 /healthz on **${organ}** ` +
                         `(last code ${{ steps.ping.outputs.last_code }}). Kernels may have stopped emitting heartbeats. ` +
                         `Check the Space logs and /api/${organ}/v3/kernels. Doctrine v11. — Yachay`;
            if (found.data.total_count === 0) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['flagship','availability'] });
            }
  wake-receipt:
    needs: warm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: POST signed wake-receipt to a11oy
        run: |
          set +e
          curl -s -X POST --max-time 25 \
            "https://szlholdings-a11oy.hf.space/api/a11oy/v3/kernels/wake-receipt" \
            -H "content-type: application/json" \
            -d "{\"source\":\"github-actions/warm-flagships\",\"run\":\"${GITHUB_RUN_ID}\",\"ts\":\"$(date -u +%FT%TZ)\"}" \
            -o /tmp/wake -w "wake-receipt -> %{http_code}\n"
          head -c 500 /tmp/wake || true
