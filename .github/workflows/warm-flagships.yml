# SPDX-License-Identifier: Apache-2.0
# Warm the flagship Spaces so HF never sleeps them (Option A: external cron heartbeat).
# Every 10 min: probe each LIVE flagship. On non-200/unreachable, open a de-duped issue.
# A final job POSTs a wake-receipt to a11oy so the wake itself is signed into the Khipu.
#
# Roster honesty (Doctrine v11, 749/14/163):
#   LIVE docker organs (probe /healthz): a11oy, killinchu, yarqa.
#   LIVE docker organ serving a static asset (no /healthz; probe index.html):
#     anatomy (re-homed from sdk:static -> sdk:docker 2026-06-15; the .static.hf.space
#     host 404s after the re-home, the canonical .hf.space host serves it).
#   RETIRED — consolidated into a11oy, intentionally NOT probed (no Space exists):
#     amaru -> a11oy Memory, sentra -> a11oy Sentinel, rosie -> a11oy Operator.
#   hatun-mcp (the great context MCP gateway): LIVE docker Space (probe /healthz).
# Sign: Yachay <yachay@szlholdings.dev>.
name: warm-flagships
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (UTC)
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - organ: a11oy
            probe: "https://szlholdings-a11oy.hf.space/healthz"
          - organ: killinchu
            probe: "https://szlholdings-killinchu.hf.space/healthz"
          - organ: yarqa
            probe: "https://szlholdings-yarqa.hf.space/healthz"
          - organ: hatun-mcp
            probe: "https://szlholdings-hatun-mcp.hf.space/healthz"
          - organ: anatomy
            probe: "https://szlholdings-anatomy.hf.space/index.html"
    steps:
      - name: Ping flagship
        id: ping
        run: |
          set +e
          CODE=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 25 "${{ matrix.probe }}")
          echo "GET ${{ matrix.probe }} -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            head -c 400 /tmp/body
            exit 0
          fi
          echo "ok=0" >> "$GITHUB_OUTPUT"
          echo "last_code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Open de-duped issue on failure
        if: steps.ping.outputs.ok != '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const organ = '${{ matrix.organ }}';
            const probe = '${{ matrix.probe }}';
            const title = `flagship ${organ} unhealthy (warm-flagships)`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const body = `Automated warm-flagships probe could not reach a 200 on **${organ}** ` +
                         `(\`${probe}\`, last code ${{ steps.ping.outputs.last_code }}). ` +
                         `The Space may be down, still building, or sleeping. ` +
                         `Check the HF Space build logs. Doctrine v11. — Yachay`;
            if (found.data.total_count === 0) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['flagship','availability'] });
            }
  wake-receipt:
    needs: warm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: POST signed wake-receipt to a11oy
        run: |
          set +e
          curl -s -X POST --max-time 25 \
            "https://szlholdings-a11oy.hf.space/api/a11oy/v3/kernels/wake-receipt" \
            -H "content-type: application/json" \
            -d "{\"source\":\"github-actions/warm-flagships\",\"run\":\"${GITHUB_RUN_ID}\",\"ts\":\"$(date -u +%FT%TZ)\"}" \
            -o /tmp/wake -w "wake-receipt -> %{http_code}\n"
          head -c 500 /tmp/wake || true
