name: repro-check

# Reproducible-build verification for the platform monorepo.
# Builds the same candidate in two clean checkouts, then compares the complete
# path + SHA-256 manifest for every Turbo-declared build-output directory.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC
  pull_request:

permissions:
  contents: read

env:
  CI: true
  ONNXRUNTIME_NODE_INSTALL: skip
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout build A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Install build A dependencies
        run: pnpm install --frozen-lockfile

      - name: Build A without Turbo cache reuse
        run: pnpm exec turbo run build --force

      - name: Record complete build A output manifest
        shell: bash
        run: |
          set -euo pipefail
          find . \
            \( -path './.git' -o -path '*/.git' -o \
               -path './node_modules' -o -path '*/node_modules' -o \
               -path './.turbo' -o -path '*/.turbo' \) -prune -o \
            -type f \( -path '*/dist/*' -o -path '*/build/*' -o -path '*/.next/*' \) \
            -print0 \
            | LC_ALL=C sort -z \
            | while IFS= read -r -d '' artifact; do sha256sum "$artifact"; done \
            > /tmp/repro-build-a.sha256
          test -s /tmp/repro-build-a.sha256
          echo "Build A output files: $(wc -l < /tmp/repro-build-a.sha256)"

      - name: Checkout build B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repro-build-b
          fetch-depth: 1
          persist-credentials: false

      - name: Verify both checkouts use the candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C repro-build-b rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install build B dependencies
        working-directory: repro-build-b
        run: pnpm install --frozen-lockfile

      - name: Build B without Turbo cache reuse
        working-directory: repro-build-b
        run: pnpm exec turbo run build --force

      - name: Record complete build B output manifest
        working-directory: repro-build-b
        shell: bash
        run: |
          set -euo pipefail
          find . \
            \( -path './.git' -o -path '*/.git' -o \
               -path './node_modules' -o -path '*/node_modules' -o \
               -path './.turbo' -o -path '*/.turbo' \) -prune -o \
            -type f \( -path '*/dist/*' -o -path '*/build/*' -o -path '*/.next/*' \) \
            -print0 \
            | LC_ALL=C sort -z \
            | while IFS= read -r -d '' artifact; do sha256sum "$artifact"; done \
            > /tmp/repro-build-b.sha256
          test -s /tmp/repro-build-b.sha256
          echo "Build B output files: $(wc -l < /tmp/repro-build-b.sha256)"

      - name: Verify exact output-path and byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          diff --unified=3 /tmp/repro-build-a.sha256 /tmp/repro-build-b.sha256
          echo "Reproducible build verified across complete nonempty output manifests."
