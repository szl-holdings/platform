name: repro-check

# Compare declared build/codegen output bytes from two clean same-source builds.
# This is a same-run reproducibility check, not a release or SLSA attestation.
# Doctrine v11 LOCKED 749/14/163 locked_at c7c0ba17

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/ci/repro-*'
      - 'scripts/ci/verify-onnx-cpu.mjs'
      - 'packages/storybook/.storybook/main.ts'
      - '.github/workflows/repro-check.yml'

permissions:
  contents: read

concurrency:
  group: repro-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # RuntimeAudit and Lighthouse use this same narrow opt-out. CPU binaries
      # remain in the locked npm package; all approved lifecycle scripts run.
      ONNXRUNTIME_NODE_INSTALL: skip
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      # Match RuntimeAudit/build/typecheck's reviewed compiler memory budget.
      NODE_OPTIONS: --max-old-space-size=6144
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Fresh checkout for A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      # The monorepo requires Node >=24 (package.json engines). Without an
      # explicit setup the runner's default Node is used and every
      # `pnpm install` aborts with ERR_PNPM_UNSUPPORTED_ENGINE before the
      # build can run. Pin Node 24 to match the rest of the CI matrix.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'pnpm' }

      - name: Verify proof contracts
        run: node --test scripts/ci/repro-artifacts.test.mjs

      - name: Install A from lockfile
        run: |
          pnpm install --frozen-lockfile --side-effects-cache=false
          git diff --exit-code

      - name: Verify bundled CPU runtime A
        run: node scripts/ci/verify-onnx-cpu.mjs

      - name: Build and capture A
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/platform-repro"
          pnpm exec turbo run build --cache=local:,remote: --dry=json > "$RUNNER_TEMP/platform-repro/plan_A.json"
          node scripts/ci/repro-artifacts.mjs prepare "$RUNNER_TEMP/platform-repro/plan_A.json" > "$RUNNER_TEMP/platform-repro/preparation_A.json"
          pnpm exec turbo run build --cache=local:,remote: --concurrency=2
          node scripts/ci/repro-artifacts.mjs capture A "$RUNNER_TEMP/platform-repro/plan_A.json" "$RUNNER_TEMP/platform-repro"

      # checkout's clean/reset removes A's generated files, workspace dependency
      # links and incremental state. Proof files live outside the checkout.
      - name: Fresh checkout for B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Install B from lockfile
        run: |
          pnpm install --frozen-lockfile --side-effects-cache=false
          git diff --exit-code

      - name: Verify bundled CPU runtime B
        run: node scripts/ci/verify-onnx-cpu.mjs

      - name: Build and capture B
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm exec turbo run build --cache=local:,remote: --dry=json > "$RUNNER_TEMP/platform-repro/plan_B.json"
          node scripts/ci/repro-artifacts.mjs prepare "$RUNNER_TEMP/platform-repro/plan_B.json" > "$RUNNER_TEMP/platform-repro/preparation_B.json"
          pnpm exec turbo run build --cache=local:,remote: --concurrency=2
          node scripts/ci/repro-artifacts.mjs capture B "$RUNNER_TEMP/platform-repro/plan_B.json" "$RUNNER_TEMP/platform-repro"

      - name: Verify reproducibility
        run: node scripts/ci/repro-artifacts.mjs compare "$RUNNER_TEMP/platform-repro"

      - name: Preserve available proof metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-repro/*.json
          if-no-files-found: warn
          retention-days: 14
