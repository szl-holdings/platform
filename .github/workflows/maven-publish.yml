name: Publish Maven packages to GitHub Packages

# Template workflow — activate when Java/Kotlin packages are added.
# See docs/github/packages/maven/SETUP.md

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Path to Maven package directory (e.g. lib/java/szl-core)'
        required: true
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

jobs:
  publish:
    name: Maven publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version from input
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          cd "${{ github.event.inputs.package_path }}"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Build with Maven
        run: |
          cd "${{ github.event.inputs.package_path }}"
          mvn --batch-mode clean verify \
            -s $GITHUB_WORKSPACE/docs/github/packages/maven/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          cd "${{ github.event.inputs.package_path }}"
          mvn --batch-mode deploy \
            -s $GITHUB_WORKSPACE/docs/github/packages/maven/settings.xml \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Summary
        run: |
          echo "## Maven Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "Published Maven package to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`https://maven.pkg.github.com/szl-holdings/szl-holdings-platform\`" >> $GITHUB_STEP_SUMMARY
