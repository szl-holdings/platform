name: Post-Deploy Smoke Tests

# Runs automatically after every successful production deployment.
# Can also be triggered manually to validate any live URL.
on:
  workflow_run:
    workflows: ["Deploy — Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run smoke tests against (e.g. https://your-app.replit.app)"
        required: false
        default: ""

permissions:
  contents: read

# Note: jobs that need checks:write use job-level permissions.

concurrency:
  group: post-deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Only proceed when the triggering deployment succeeded (not applicable for
  # manual dispatches, which always run).
  gate:
    name: Check deploy status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Determine whether to run smoke tests
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — running smoke tests unconditionally"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$WORKFLOW_RUN_CONCLUSION" == "success" ]]; then
            echo "Upstream deploy succeeded — running smoke tests"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream deploy did not succeed (conclusion: $WORKFLOW_RUN_CONCLUSION) — skipping smoke tests"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Artifact smoke (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    # environment: production is required so that environment-scoped secrets
    # (PRODUCTION_BASE_URL, SLACK_WEBHOOK_URL) are available to this job.
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each entry maps to the 'name' field in artifact-smoke.config.ts via
        # --grep so failures are isolated per artifact and visible individually
        # in the GitHub Actions matrix view.
        # IMPORTANT: grep values must match the test.describe() string in the spec
        # (case-sensitive Playwright regex).
        include:
          - artifact: a11oy
            grep: "A11oy"
          - artifact: sentra
            grep: "Sentra"
          - artifact: counsel
            grep: "Counsel"
          - artifact: terra
            grep: "Terra"
          - artifact: vessels
            grep: "Vessels"
          - artifact: carlota-jo
            grep: "Carlota Jo"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: $WORKFLOW_RUN_HEAD_SHA

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "24", cache: "pnpm" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Resolve smoke target URL
        id: url
        run: |
          # Manual dispatch: use the provided base_url input if set.
          # Workflow_run: fall back to the PRODUCTION_BASE_URL secret.
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${{ secrets.PRODUCTION_BASE_URL }}"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::No smoke target URL found. Set PRODUCTION_BASE_URL in the 'production' environment secrets, or supply base_url when dispatching manually."
            exit 1
          fi
          # Strip trailing slash for consistency
          BASE_URL="${BASE_URL%/}"
          echo "Smoke target: $BASE_URL"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests — ${{ matrix.artifact }}
        id: smoke
        # Capture output so we can surface the failing assertion in the alert.
        # set +e prevents immediate exit so we can store the output first.
        run: |
          set +e
          OUTPUT=$(pnpm exec playwright test tests/e2e/post-deploy-smoke.spec.ts \
            --project=chromium \
            --grep "${{ matrix.grep }}" \
            --reporter=list,github,html,junit 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          # Store last 40 lines (enough to capture assertion failure messages)
          TAIL=$(echo "$OUTPUT" | tail -n 40)
          {
            echo "output<<SMOKE_EOF"
            echo "$TAIL"
            echo "SMOKE_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          CI: "true"
          SMOKE_BASE_URL: ${{ steps.url.outputs.base_url }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-traces-${{ matrix.artifact }}
          path: test-results/
          retention-days: 7

      # Per-artifact targeted alert: fires immediately when this artifact fails,
      # naming the artifact and including the Playwright failure output so the
      # team knows exactly what broke without opening GitHub Actions.
      - name: Alert — ${{ matrix.artifact }} smoke failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTIFACT: ${{ matrix.artifact }}
          SMOKE_OUTPUT: ${{ steps.smoke.outputs.output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_URL: ${{ steps.url.outputs.base_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — Slack alerts inactive"
            echo ""
            echo "Smoke FAILED for artifact: $ARTIFACT"
            echo "Target URL: $BASE_URL"
            echo ""
            echo "=== Playwright output (last 40 lines) ==="
            echo "$SMOKE_OUTPUT"
            exit 0
          fi

          ESCAPED_OUTPUT=$(echo "$SMOKE_OUTPUT" | head -n 20 | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')

          PAYLOAD=$(cat <<EOF
          {
            "text": "🔴 *Post-Deploy Smoke Failed — ${ARTIFACT}*",
            "attachments": [
              {
                "color": "danger",
                "fields": [
                  { "title": "Artifact", "value": "${ARTIFACT}", "short": true },
                  { "title": "Target", "value": "${BASE_URL}", "short": true },
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Ref", "value": "$WORKFLOW_RUN_HEAD_SHA", "short": true },
                  { "title": "Failing Assertion (last 20 lines)", "value": "\`\`\`\n${ESCAPED_OUTPUT}\n\`\`\`", "short": false },
                  { "title": "Action", "value": "Download \`smoke-report-${ARTIFACT}\` from the Actions run for the full Playwright report.", "short": false }
                ],
                "footer": "<${RUN_URL}|View smoke run in GitHub Actions>"
              }
            ]
          }
          EOF
          )

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            && echo "Slack alert sent for $ARTIFACT" \
            || echo "Slack post failed — check SLACK_WEBHOOK_URL secret"

  # Single gate job that aggregates the matrix results.
  # Downstream jobs (e.g. post-release notifications) should depend on this.
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: [gate, smoke]
    if: always() && needs.gate.outputs.should_run == 'true'
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Evaluate smoke results
        id: result
        run: |
          if [[ "${{ needs.smoke.result }}" == "success" ]]; then
            echo "All artifact smoke tests passed."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "One or more artifact smoke tests FAILED (result: ${{ needs.smoke.result }})"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Post-Deploy Smoke Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.smoke.result }}" == "success" ]]; then
            echo "**Status:** All artifact smoke tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** One or more smoke tests FAILED — see matrix jobs above for per-artifact Playwright output." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Triage" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Open the failing matrix job to read the Playwright output and assertion details." >> "$GITHUB_STEP_SUMMARY"
            echo "2. Download the \`smoke-report-<artifact>\` HTML report for full trace + screenshot." >> "$GITHUB_STEP_SUMMARY"
            echo "3. Consult \`docs/SMOKE_RUNBOOK.md\` for triage steps." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "**Deploy ref:** $WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Triggered by:** manual dispatch (${{ github.actor }})" >> "$GITHUB_STEP_SUMMARY"
          fi
