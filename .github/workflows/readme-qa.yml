name: README QA

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readme-assets:
    name: Validate README images and badge workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check root README assets
        run: pnpm readme:check

      - name: Check README portfolio table is in sync with artifact registry
        run: pnpm readme:portfolio:check

      - name: Check profile README assets
        run: node scripts/validate-readme-assets.js --readme profile-readme/README.md
