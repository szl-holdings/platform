name: README QA

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "artifacts/*/.replit-artifact/artifact.toml"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "artifacts/*/.replit-artifact/artifact.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readme-assets:
    name: Validate README images and badge workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check root README assets
        run: pnpm readme:check

      - name: Check artifact inventory is in sync
        run: pnpm readme:generate:check

      - name: Check profile README assets
        run: node scripts/validate-readme-assets.js --readme profile-readme/README.md
