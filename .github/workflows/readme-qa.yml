name: README QA

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate-readme-assets:
    name: Validate README images and badge workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check root README assets
        run: pnpm readme:check

      - name: Check README portfolio table is in sync with artifact registry
        run: pnpm readme:portfolio:check

      - name: Check profile README assets
        run: node scripts/validate-readme-assets.js --readme profile-readme/README.md
