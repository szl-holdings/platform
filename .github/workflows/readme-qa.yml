name: README QA

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "profile-readme/README.md"
      - "*.md"
      - "docs/**/*.md"
      - "assets/readme/**"
      - ".github/workflows/**"
      - "scripts/validate-readme-assets.js"
      - "scripts/generate-readme-product-table.js"
      - "scripts/portfolio.config.json"
      - "artifacts/*/.replit-artifact/artifact.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate-readme-assets:
    name: Validate README images and badge workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # These validators use only Node built-ins; no workspace install is needed.
      - name: Check root README assets
        run: node scripts/validate-readme-assets.js

      - name: Check README portfolio table is in sync with artifact registry
        run: node scripts/generate-readme-product-table.js --check

      - name: Check profile README assets
        run: node scripts/validate-readme-assets.js --readme profile-readme/README.md
