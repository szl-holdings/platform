name: Materialize durable-state race fix on review

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.head_ref == 'fix/state-race-materializer-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Apply the bounded descriptor hardening
        run: python scripts/materialize_state_race_fix.py

      - name: Install the protected workspace exactly
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate the state-native package
        run: pnpm --filter @workspace/a11oy-runtime test

      - name: Seal and publish the source-only successor
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git rm .github/workflows/materialize-state-race-fix.yml \
            .github/workflows/materialize-state-race-ready.yml \
            scripts/materialize_state_race_fix.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "audit/frontier/ALLOY_DURABLE_STATE_TRANSPORT_PROOF_2026-08-17.md docs/architecture/alloy-state-native-runtime.md packages/a11oy-runtime/src/state-native/filesystem-transport.ts packages/a11oy-runtime/test/state-native-filesystem-transport.test.mjs "
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add audit/frontier/ALLOY_DURABLE_STATE_TRANSPORT_PROOF_2026-08-17.md \
            docs/architecture/alloy-state-native-runtime.md \
            packages/a11oy-runtime/src/state-native/filesystem-transport.ts \
            packages/a11oy-runtime/test/state-native-filesystem-transport.test.mjs
          git commit -s -m 'fix(state): bind durable reads to opened descriptors'
          git push origin "HEAD:${BRANCH_NAME}"
