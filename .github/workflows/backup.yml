name: Database Backup

# BACKUP TARGETS:
#   1. Object storage (Azure Blob) — primary durable target. Configured via
#      BACKUP_REMOTE_BACKEND=azure-blob and the AZURE_STORAGE_* secrets below.
#      Enforces 30-day daily / 90-day weekly retention against the remote store.
#      The job FAILS if the secrets are configured and the upload does not
#      succeed.
#   2. GitHub Actions artifacts — short-lived secondary copy (7-day retention)
#      kept for fast access during incident response. Not the system of record.
#
# If the AZURE_STORAGE_* secrets are unset, the workflow falls back to
# artifact-only mode (legacy behavior). This keeps CI green for forks and
# preview environments where production credentials are intentionally absent.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual pg_dump)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pg_dump and Azure CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client jq
          # Azure CLI ships preinstalled on ubuntu-latest runners; verify.
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi
          az --version | head -1

      - name: Determine remote backend
        id: backend
        run: |
          if [[ -n "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
             || ( -n "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
               && -n "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}" ) ]] \
             && [[ -n "${{ secrets.AZURE_STORAGE_CONTAINER }}" ]]; then
            echo "backend=azure-blob" >> "$GITHUB_OUTPUT"
            echo "Remote backend: azure-blob (durable object storage)"
          else
            echo "backend=none" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_STORAGE_* secrets not configured — running in artifact-only mode (7-day retention only). Configure object storage to meet stated 30/90-day retention."
          fi

      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: /tmp/szl-backups
          BACKUP_REMOTE_BACKEND: ${{ steps.backend.outputs.backend }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_PREFIX: ${{ secrets.AZURE_STORAGE_PREFIX }}
          BACKUP_REMOTE_DAILY_RETENTION_DAYS: '30'
          BACKUP_REMOTE_WEEKLY_RETENTION_DAYS: '90'
        run: |
          chmod +x scripts/backup-db.sh scripts/backup-upload.sh scripts/backup-restore.sh
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/backup-db.sh --dry-run
          else
            ./scripts/backup-db.sh
          fi

      - name: Verify backup manifest (local + remote)
        run: |
          if [[ ! -f /tmp/szl-backups/backup_manifest.json ]]; then
            echo "ERROR: No backup manifest found"
            exit 1
          fi
          cat /tmp/szl-backups/backup_manifest.json
          STATUS=$(jq -r '.status' /tmp/szl-backups/backup_manifest.json)
          if [[ "$STATUS" != "ok" ]]; then
            echo "ERROR: Backup manifest status is not ok: $STATUS"
            exit 1
          fi
          SIZE=$(jq '.lastBackupSizeBytes' /tmp/szl-backups/backup_manifest.json)
          if [[ "${{ inputs.dry_run }}" != "true" && "$SIZE" == "0" ]]; then
            echo "ERROR: Backup file is empty (0 bytes)"
            exit 1
          fi

          # Remote upload check — required when backend != none
          REMOTE_STATUS=$(jq -r '.remoteUpload.status // "missing"' /tmp/szl-backups/backup_manifest.json)
          REMOTE_BACKEND=$(jq -r '.remoteUpload.backend // "missing"' /tmp/szl-backups/backup_manifest.json)
          echo "Remote upload: backend=${REMOTE_BACKEND} status=${REMOTE_STATUS}"
          if [[ "${{ steps.backend.outputs.backend }}" == "azure-blob" \
             && "${{ inputs.dry_run }}" != "true" ]]; then
            if [[ "$REMOTE_STATUS" != "ok" ]]; then
              echo "ERROR: Remote upload to object storage did not succeed: $REMOTE_STATUS"
              exit 1
            fi
            REMOTE_URL=$(jq -r '.remoteUpload.remoteUrl' /tmp/szl-backups/backup_manifest.json)
            echo "Backup uploaded to: $REMOTE_URL"
          fi
          echo "Backup manifest status: ok, size: ${SIZE} bytes"

      - name: Upload backup artifact (secondary copy)
        # Object storage (configured above) is the durable system of record
        # with 30-day daily / 90-day weekly retention. The CI artifact below
        # is a short-lived secondary copy (7 days) kept for fast access during
        # incident response. LIMITATION: artifacts are stored unencrypted; the
        # repo must remain private.
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-${{ github.run_id }}
          path: /tmp/szl-backups/*.sql.gz
          retention-days: 7

      - name: Upload backup manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backup-manifest-${{ github.run_id }}
          path: /tmp/szl-backups/backup_manifest.json
          retention-days: 30
