name: READINESS-SECURITY

# Confirms supply-chain controls + signed releases across public repos.
# Doctrine v11 (LOCKED) 749/14/163. Additive readiness agent — read-only.
# Author: Yachay <yachay@szlholdings.dev>

on:
  schedule:
    - cron: "0 * * * *"   # hourly (UTC)
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: readiness-security
  cancel-in-progress: false

jobs:
  run:
    name: READINESS-SECURITY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir huggingface_hub pynacl

      - name: Run READINESS-SECURITY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KHIPU_SIGNING_KEY_B64: ${{ secrets.KHIPU_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11OY_URL: ${{ vars.A11OY_URL }}
          AMARU_URL: ${{ vars.AMARU_URL }}
          SENTRA_URL: ${{ vars.SENTRA_URL }}
          KILLINCHU_URL: ${{ vars.KILLINCHU_URL }}
          ROSIE_URL: ${{ vars.ROSIE_URL }}
          OTEL_COLLECTOR_URL: ${{ vars.OTEL_COLLECTOR_URL }}
        run: python platform/agents/readiness/readiness-security/executor.py
