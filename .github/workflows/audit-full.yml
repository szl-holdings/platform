name: Runtime Audit Harness

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths-ignore:
      - 'replit-sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-full-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  audit:
    name: Runtime Audit (audit:full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full audit pipeline
        run: pnpm audit:full:ci
        env:
          CI: 'true'
          NODE_ENV: test

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-evidence-${{ github.run_id }}
          path: artifacts/audit/evidence/
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          if [ -f artifacts/audit/evidence/latest/summary.md ]; then
            cat artifacts/audit/evidence/latest/summary.md
          else
            echo "No summary found — the audit pipeline may not have completed."
          fi
