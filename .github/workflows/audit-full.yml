name: Runtime Audit Harness

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Runtime Audit (audit:full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — repinned 2026-04-30 (fe52bf0a force-deleted upstream)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full audit pipeline
        run: pnpm audit:full:ci
        env:
          CI: 'true'
          NODE_ENV: test

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-evidence-${{ github.run_id }}
          path: artifacts/audit/evidence/
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          if [ -f artifacts/audit/evidence/latest/summary.md ]; then
            cat artifacts/audit/evidence/latest/summary.md
          else
            echo "No summary found — the audit pipeline may not have completed."
          fi
