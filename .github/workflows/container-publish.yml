name: Build and publish container images to GitHub Container Registry

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (default: sha)'
        required: false

env:
  REGISTRY: ghcr.io
  ORG: szl-holdings

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-server
            context: .
            dockerfile: artifacts/api-server/Dockerfile
            image: ghcr.io/szl-holdings/api-server

          - service: szl-holdings
            context: .
            dockerfile: artifacts/szl-holdings/Dockerfile
            image: ghcr.io/szl-holdings/szl-holdings-web

          - service: vessels
            context: .
            dockerfile: artifacts/vessels/Dockerfile
            image: ghcr.io/szl-holdings/vessels

          - service: terra
            context: .
            dockerfile: artifacts/terra/Dockerfile
            image: ghcr.io/szl-holdings/terra

          - service: aegis
            context: .
            dockerfile: artifacts/aegis/Dockerfile
            image: ghcr.io/szl-holdings/aegis

          - service: carlota-jo
            context: .
            dockerfile: artifacts/carlota-jo/Dockerfile
            image: ghcr.io/szl-holdings/carlota-jo

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  summary:
    name: Publish summary
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Container Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| api-server | \`ghcr.io/szl-holdings/api-server\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| szl-holdings | \`ghcr.io/szl-holdings/szl-holdings-web\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| vessels | \`ghcr.io/szl-holdings/vessels\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| terra | \`ghcr.io/szl-holdings/terra\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| aegis | \`ghcr.io/szl-holdings/aegis\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| carlota-jo | \`ghcr.io/szl-holdings/carlota-jo\` | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
