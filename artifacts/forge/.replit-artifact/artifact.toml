kind = "web"
previewPath = "/forge/"
title = "Forge — Client & Investor Portal"
version = "1.0.0"
id = "artifacts/forge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/forge/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge", "run", "build" ]
publicDir = "artifacts/forge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/forge/"
