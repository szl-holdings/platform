kind = "web"
previewPath = "/forge/"
title = "Forge — Client & Investor Portal"
version = "1.0.0"
id = "artifacts/forge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/forge/" ]
localPort = 8000

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/forge && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge", "run", "build" ]
publicDir = "artifacts/forge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8000"
BASE_PATH = "/forge/"
