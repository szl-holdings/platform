kind = "web"
previewPath = "/msp/"
title = "[Retired] Rosie → Consolidated into Aegis"
version = "1.0.0"
id = "artifacts/msp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/msp/" ]
localPort = 25000

[services.development]
run = "pnpm --filter @workspace/msp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/msp", "run", "build" ]
publicDir = "artifacts/msp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25000"
BASE_PATH = "/msp/"
