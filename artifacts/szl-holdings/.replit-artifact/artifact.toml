kind = "web"
previewPath = "/"
title = "SZL Holdings"
version = "1.0.0"
id = "artifacts/szl-holdings"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "node /home/runner/workspace/artifacts/szl-holdings/fast-start.mjs"

[services.production]
build = [ "pnpm", "--filter", "@workspace/szl-holdings", "run", "build" ]
publicDir = "artifacts/szl-holdings/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
