kind = "web"
previewPath = "/"
title = "SZL Holdings Dashboard"
version = "1.0.0"
id = "artifacts/szl-holdings"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21130

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/szl-holdings && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/szl-holdings", "run", "build" ]
publicDir = "artifacts/szl-holdings/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21130"
BASE_PATH = "/"
