kind = "web"
previewPath = "/inca-lab/"
title = "INCA Lab — AI Model Command & Deployment"
version = "1.0.0"
id = "artifacts/inca-lab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/inca-lab/" ]
localPort = 5000

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/inca-lab && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inca-lab", "run", "build" ]
publicDir = "artifacts/inca-lab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/inca-lab/"
