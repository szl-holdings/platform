kind = "web"
previewPath = "/command/"
title = "Unified Command"
version = "1.0.0"
id = "artifacts/command"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/command/" ]
localPort = 9090
autoStart = true

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/command && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/command", "run", "build" ]
publicDir = "artifacts/command/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "5000"
BASE_PATH = "/command/"
EMBED_API_SERVER = "false"
