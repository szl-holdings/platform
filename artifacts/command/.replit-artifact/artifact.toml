kind = "web"
previewPath = "/command/"
title = "Ecosystem Command Portal"
version = "1.0.0"
id = "artifacts/command"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/command/" ]
localPort = 25201

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/command && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/command", "run", "build" ]
publicDir = "artifacts/command/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "25200"
PROXY_PORT = "25201"
BASE_PATH = "/command/"
