kind = "web"
previewPath = "/imperium/"
title = "IMPERIUM — Cloud Sovereignty Engine"
version = "1.0.0"
id = "artifacts/imperium"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/imperium/" ]
localPort = 9090

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/imperium && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imperium", "run", "build" ]
publicDir = "artifacts/imperium/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "22100"
BASE_PATH = "/imperium/"
