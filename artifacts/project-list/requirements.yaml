packages:
  "framer-motion": "For stunning page transitions, modal animations, and list staggering"
  "date-fns": "For formatting timestamps into human-readable relative times"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For Zod validation integration with react-hook-form"
  "clsx": "For conditional class merging"
  "tailwind-merge": "For resolving Tailwind class conflicts"

images:
  - path: "artifacts/project-list/public/images/empty-state.png"
