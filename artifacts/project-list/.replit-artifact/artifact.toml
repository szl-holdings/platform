kind = "web"
previewPath = "/"
title = "Project List"
version = "1.0.0"
id = "artifacts/project-list"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23816

[services.development]
run = "pnpm --filter @workspace/project-list run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/project-list", "run", "build" ]
publicDir = "artifacts/project-list/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23816"
BASE_PATH = "/"
