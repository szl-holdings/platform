kind = "web"
  previewPath = "/rosie/"
  title = "ROSIE — Unified Decision Fabric"
  version = "1.0.0"
  id = "artifacts/rosie"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/rosie/" ]
  localPort = 9090
  autoStart = true

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/rosie && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/rosie", "run", "build" ]
  publicDir = "artifacts/rosie/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  VITE_PORT = "5113"
  BASE_PATH = "/rosie/"
