<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — AI Executive Briefing</title>
    <meta name="description" content="AI-generated, confidence-scored executive briefings. Decision-grade intelligence across every domain." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      .skip-to-content {
        position: absolute;
        left: -9999px;
        top: 1rem;
        z-index: 99999;
        padding: 0.5rem 1.25rem;
        background: #c8d8e8;
        color: #060b12;
        font-weight: 600;
        font-size: 0.875rem;
        line-height: 1.5;
        border-radius: 4px;
        text-decoration: none;
        white-space: nowrap;
        border: 2px solid #4d8fcc;
      }
      .skip-to-content:focus {
        left: 1rem;
        outline: 3px solid #4d8fcc;
        outline-offset: 2px;
      }
      :focus-visible {
        outline: 3px solid #4d8fcc;
        outline-offset: 2px;
        border-radius: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
