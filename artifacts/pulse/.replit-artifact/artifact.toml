kind = "web"
previewPath = "/pulse/"
title = "Pulse — AI Executive Briefing"
version = "1.0.0"
id = "artifacts/pulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pulse/" ]
localPort = 9090

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/pulse && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulse", "run", "build" ]
publicDir = "artifacts/pulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "5201"
BASE_PATH = "/pulse/"
