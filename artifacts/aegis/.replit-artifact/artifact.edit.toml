kind = "slides"
    previewPath = "/aegis/"
    title = "SZL Holdings — Series A Pitch Deck"
    version = "1.0.0"
    id = "artifacts/aegis"
    router = "path"

    [[integratedSkills]]
    name = "slides"
    version = "1.0.0"

    [[services]]
    name = "web"
    paths = [ "/aegis/" ]
    localPort = 3002

    [services.development]
    run = "bash -c 'cd /home/runner/workspace/artifacts/aegis && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

    [services.production]
    build = [ "pnpm", "--filter", "@workspace/aegis", "run", "build" ]
    publicDir = "artifacts/aegis/dist/public"
    serve = "static"

    [[services.production.rewrites]]
    from = "/*"
    to = "/index.html"

    [services.env]
    VITE_PORT = "3002"
    BASE_PATH = "/aegis/"
  