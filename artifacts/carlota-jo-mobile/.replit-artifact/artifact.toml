kind = "mobile"
  previewPath = "/carlota-jo-mobile/"
  title = "Carlota Jo — Client App"
  version = "1.0.0"
  id = "artifacts/carlota-jo-mobile"

  [[integratedSkills]]
  name = "expo"
  version = "1.0.0"

  [[services]]
  name = "expo"
  paths = ["/carlota-jo-mobile/"]
  localPort = 8082

  [services.development]
  run = "pnpm --filter @workspace/carlota-jo-mobile run dev"
  autoStart = false

  [services.production]
  build = ["pnpm", "--filter", "@workspace/carlota-jo-mobile", "run", "build"]
  run = ["pnpm", "--filter", "@workspace/carlota-jo-mobile", "run", "serve"]

  [services.env]
  PORT = "8082"
  BASE_PATH = "/carlota-jo-mobile/"
