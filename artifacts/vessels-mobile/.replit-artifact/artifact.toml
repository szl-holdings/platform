kind = "mobile"
  previewPath = "/vessels-mobile/"
  title = "Vessels — Fleet Command Mobile"
  version = "1.0.0"
  id = "artifacts/vessels-mobile"

  [[integratedSkills]]
  name = "expo"
  version = "1.0.0"

  [[services]]
  name = "expo"
  paths = ["/vessels-mobile/"]
  localPort = 8087

  [services.development]
  run = "pnpm --filter @workspace/vessels-mobile run dev"
  autoStart = false

  [services.production]
  build = ["pnpm", "--filter", "@workspace/vessels-mobile", "run", "build"]
  run = ["pnpm", "--filter", "@workspace/vessels-mobile", "run", "serve"]

  [services.env]
  PORT = "8087"
  BASE_PATH = "/vessels-mobile/"
