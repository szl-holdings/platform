kind = "web"
    previewPath = "/vessels/"
    title = "Vessels Maritime Intelligence"
    version = "1.0.0"
    id = "artifacts/vessels"
    router = "path"

    [[integratedSkills]]
    name = "react-vite"
    version = "1.0.0"

    [[services]]
    name = "web"
    paths = [ "/vessels/" ]
    localPort = 9090
    autoStart = true

    [services.development]
    run = "bash -c 'cd /home/runner/workspace/artifacts/vessels && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

    [services.production]
    build = [ "pnpm", "--filter", "@workspace/vessels", "run", "build" ]
    publicDir = "artifacts/vessels/dist/public"
    serve = "static"

    [[services.production.rewrites]]
    from = "/*"
    to = "/index.html"

    [services.env]
    VITE_PORT = "8099"
    BASE_PATH = "/vessels/"
