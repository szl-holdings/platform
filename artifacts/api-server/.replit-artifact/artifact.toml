kind = "web"
previewPath = "/api/"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "api"
paths = [ "/api/", "/nexus/", "/mcp/", "/alloy-embedding-api/" ]
localPort = 8080
autoStart = true

[services.development]
run = "pnpm --filter @workspace/api-server run dev:fast"

[services.env]
PORT = "8080"

[[services]]
name = "agent-gateway"
paths = [ "/agent-gateway/" ]
localPort = 6800
autoStart = false

[services.development]
run = "bash -c 'cd /home/runner/workspace/platform/agent-gateway && exec node dist/server.js'"

[services.env]
PORT = "6800"
BASE_PATH = "/agent-gateway"
