kind = "web"
previewPath = "/api/"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "api"
paths = [ "/api/", "/nexus/", "/mcp/", "/alloy-embedding-api/", "/amaru/" ]
localPort = 8080
autoStart = true

[services.development]
run = "pnpm --filter @workspace/api-server run dev:fast"

[services.production]
build = "pnpm --filter @workspace/api-server run build && bash /home/runner/workspace/scripts/deploy-build.sh"

[services.env]
PORT = "8080"
