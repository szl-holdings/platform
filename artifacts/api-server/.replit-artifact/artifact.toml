kind = "web"
previewPath = "/api/"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "api"
paths = [ "/api/", "/nexus/", "/mcp/", "/alloy-embedding-api/" ]
localPort = 8080
autoStart = true

[services.development]
run = "pnpm --filter @workspace/api-server run dev:fast"

[services.env]
PORT = "8080"

[[services]]
name = "agent-gateway"
paths = [ "/agent-gateway/" ]
localPort = 6800
autoStart = false

[services.development]
run = "bash -c 'cd /home/runner/workspace/platform/agent-gateway && exec node dist/server.js'"

[services.env]
PORT = "6800"
BASE_PATH = "/agent-gateway"

[[services]]
name = "temporal-worker"
paths = []
localPort = 6801
autoStart = false

[services.development]
run = "pnpm --filter @szl-holdings/temporal-tests run worker:start"

[services.env]
PORT = "6801"
TEMPORAL_ENDPOINT = "localhost:7233"
TEMPORAL_NAMESPACE = "default"
TEMPORAL_TASK_QUEUE = "szl-platform"

[[services]]
name = "temporal-approval-worker"
paths = []
localPort = 6802
autoStart = false

[services.development]
run = "pnpm --filter @szl-holdings/temporal-tests run worker:approval:start"

[services.env]
PORT = "6802"
TEMPORAL_ENDPOINT = "localhost:7233"
TEMPORAL_NAMESPACE = "default"
TEMPORAL_APPROVAL_TASK_QUEUE = "approval-task-queue"

[[services]]
name = "amaru"
paths = [ "/amaru/" ]
localPort = 6810
autoStart = false

[services.development]
run = "bash -c 'cd /home/runner/workspace/services/amaru && bash scripts/bootstrap_venv.sh && PYTHONPATH=src exec .venv/bin/python -m uvicorn amaru.app:app --host 0.0.0.0 --port 6810'"

[services.env]
PORT = "6810"
AMARU_YAWAR_BUS_URL = "http://localhost:8080/api/prism-bus/publish"
AMARU_YAWAR_BUS_DOMAIN = "amaru"
