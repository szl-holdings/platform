kind = "web"
previewPath = "/api/"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "api"
paths = [ "/api/", "/nexus/", "/mcp/", "/alloy-embedding-api/" ]
localPort = 8080
autoStart = true

[services.development]
run = "pnpm --filter @workspace/api-server run dev:fast"

[services.production]
build = "pnpm --filter @workspace/api-server run build && bash /home/runner/workspace/scripts/deploy-build.sh"

[services.env]
PORT = "8080"

[[services]]
name = "amaru"
paths = [ "/amaru/" ]
localPort = 6810
autoStart = false

[services.development]
run = "bash -c 'cd /home/runner/workspace/services/amaru && bash scripts/bootstrap_venv.sh && PYTHONPATH=src exec .venv/bin/python scripts/serve_dualstack.py'"

[services.env]
PORT = "6810"
AMARU_YAWAR_BUS_URL = "http://localhost:8080/api/prism-bus/publish"
AMARU_YAWAR_BUS_DOMAIN = "amaru"

[[services]]
name = "sentra-sidecar"
paths = []
localPort = 8765
autoStart = false

[services.development]
run = "bash /home/runner/workspace/scripts/sentra-sidecar-dev.sh"

[services.env]
PORT = "8765"
SENTRA_SIDECAR_HOST = "127.0.0.1"
SENTRA_SIDECAR_ADVERTISED_HOST = "127.0.0.1"
SENTRA_API_SERVER_URL = "http://127.0.0.1:8080"
SENTRA_SIDECAR_HEARTBEAT_SECONDS = "30"
