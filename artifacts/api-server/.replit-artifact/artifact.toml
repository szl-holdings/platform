kind = "api"
  previewPath = "/api"
  title = "API Server"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8080
  name = "API Server"
  paths = ["/api"]

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/api-server && (test -f ./dist/index.mjs || node ./build.mjs) && exec node --max-old-space-size=512 --expose-gc --enable-source-maps ./dist/index.mjs'"

  [services.env]
  PORT = "8080"

  [services.production]

  [services.production.build]
  args = ["bash", "-c", "pnpm --filter @workspace/api-server run build && (timeout 90 pnpm --filter @workspace/api-server run db:push || echo 'db:push skipped')"]

  [services.production.build.env]
  NODE_ENV = "production"

  [services.production.run]
  args = ["node", "--max-old-space-size=1024", "--expose-gc", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

  [services.production.run.env]
  PORT = "8080"
  NODE_ENV = "production"
