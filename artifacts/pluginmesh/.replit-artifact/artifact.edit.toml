kind = "web"
previewPath = "/pluginmesh/"
title = "PluginMesh — Codex Plugin Broker"
version = "1.0.0"
id = "artifacts/pluginmesh"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pluginmesh/" ]
localPort = 9090
autoStart = true

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/pluginmesh && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pluginmesh", "run", "build" ]
publicDir = "artifacts/pluginmesh/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "8190"
BASE_PATH = "/pluginmesh/"
