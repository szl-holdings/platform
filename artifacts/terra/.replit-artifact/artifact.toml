kind = "web"
previewPath = "/terra/"
title = "Terra Real Estate Intelligence"
version = "1.0.0"
id = "artifacts/terra"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/terra/" ]
localPort = 25100

[services.development]
run = "pnpm --filter @workspace/terra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/terra", "run", "build" ]
publicDir = "artifacts/terra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25100"
BASE_PATH = "/terra/"
