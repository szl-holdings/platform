kind = "web"
  previewPath = "/terra/"
  title = "Terra — Real Estate Intelligence"
  version = "1.0.0"
  id = "artifacts/terra"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/terra/" ]
  localPort = 9090
  autoStart = true

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/terra && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/terra", "run", "build" ]
  publicDir = "artifacts/terra/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  VITE_PORT = "6000"
  BASE_PATH = "/terra/"
