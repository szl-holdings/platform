kind = "web"
previewPath = "/prism-counsel/"
title = "PRISM Counsel — Legal Matter Command"
version = "1.0.0"
id = "artifacts/prism-counsel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/prism-counsel/" ]
localPort = 6800

[services.development]
run = "pnpm --filter @workspace/prism-counsel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prism-counsel", "run", "build" ]
publicDir = "artifacts/prism-counsel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "6800"
BASE_PATH = "/prism-counsel/"
