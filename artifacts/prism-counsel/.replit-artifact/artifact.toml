kind = "web"
previewPath = "/prism-counsel/"
title = "PRISM Counsel — Legal Command"
version = "1.0.0"
id = "artifacts/prism-counsel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/prism-counsel/" ]
localPort = 9090

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/prism-counsel && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prism-counsel", "run", "build" ]
publicDir = "artifacts/prism-counsel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "7100"
BASE_PATH = "/prism-counsel/"
