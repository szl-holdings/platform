kind = "web"
  previewPath = "/firestorm/"
  title = "Aegis — Unified Defense & Intelligence Command"
  version = "1.0.0"
  id = "artifacts/firestorm"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/firestorm/" ]
  localPort = 23932

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/firestorm && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/firestorm", "run", "build" ]
  publicDir = "artifacts/firestorm/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "23932"
  BASE_PATH = "/firestorm/"
  