kind = "web"
  previewPath = "/lyte/"
  title = "Lyte — Decision Intelligence"
  version = "1.0.0"
  id = "artifacts/lyte-command-center"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/lyte/" ]
  localPort = 7099

  [services.development]
  run = "bash -c 'cd /home/runner/workspace/artifacts/lyte-command-center && exec node_modules/.bin/vite --config vite.config.ts --host 0.0.0.0'"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/lyte-command-center", "run", "build" ]
  publicDir = "artifacts/lyte-command-center/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "7099"
  VITE_PORT = "7099"
  BASE_PATH = "/lyte/"
