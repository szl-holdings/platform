kind: UDSBundle
metadata:
  name: vessels-uds-bundle
  description: "Reference UDS bundle that drops Vessels.UDS into a UDS-enabled cluster."
  version: 0.2.0
  authors: "Stephen P. Lutar Jr. / SZL Holdings"

packages:
  - name: vessels-uds
    repository: ghcr.io/szl-holdings/vessels-uds
    ref: 0.2.0
    # For air-gap: replace `repository`/`ref` with a `path:` to the local tarball.
    # path: ./vessels-uds-0.1.0.tar.zst   # (example shape)
    optionalComponents:
      - vessels-docs
