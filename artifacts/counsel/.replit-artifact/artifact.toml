kind = "web"
    previewPath = "/counsel/"
    title = "Counsel — Legal Matter Command"
    version = "1.0.0"
    id = "artifacts/counsel"
    router = "path"

    [[integratedSkills]]
    name = "react-vite"
    version = "1.0.0"

    [[services]]
    name = "web"
    paths = [ "/counsel/" ]
    localPort = 9090

    [services.development]
    run = "bash -c 'cd /home/runner/workspace/artifacts/counsel && exec node_modules/.bin/vite --config vite.config.ts --host ::'"

    [services.production]
    build = [ "pnpm", "--filter", "@workspace/counsel", "run", "build" ]
    publicDir = "artifacts/counsel/dist/public"
    serve = "static"

    [[services.production.rewrites]]
    from = "/*"
    to = "/index.html"

    [services.env]
    VITE_PORT = "4199"
    BASE_PATH = "/counsel/"
