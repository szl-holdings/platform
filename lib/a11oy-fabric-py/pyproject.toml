[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a11oy-fabric-py"
version = "0.1.0"
description = "A11oy Python Substrate Engine — pydantic contract + vertical-pack runtime alongside the TypeScript fabric"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
a11oy-fabric-py = "a11oy_fabric_py.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a11oy_fabric_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
