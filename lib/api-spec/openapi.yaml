openapi: 3.1.0
info:
  title: SZL Holdings DreamStack API
  version: 0.3.0
  description: |
    Platform API for the SZL Holdings DreamStack suite.
    Full coverage across all active domains: auth, billing, terra, vessels, alloy/AI, holdings,
    admin, reports, exports, notifications, connectors, projects, files, observability, and more.
servers:
  - url: /api
    description: Base API path
security:
  - {}
tags:
  - name: health
    description: Health operations
  - name: ai-engine
    description: Alloy AI engine — decisions, approvals, audit, retrieval
  - name: projects
    description: Project operations
  - name: auth
    description: Authentication and user management
  - name: connectors
    description: Integration connector management
  - name: notifications
    description: Notification management
  - name: audit
    description: Activity logs and audit events
  - name: billing
    description: Billing plans, subscriptions, and invoices
  - name: feature-flags
    description: Feature flag management
  - name: files
    description: File and asset management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: stephen
    description: Stephen L. portfolio site
  - name: vessels
    description: Vessel tracking and cargo management
  - name: firestorm
    description: Campaign and lead management
  - name: lyte
    description: E-commerce products and orders
  - name: dreamscape
    description: Creative project management
  - name: readiness
    description: Readiness assessments and compliance
  - name: observability
    description: Platform telemetry, web vitals, alerts, and health monitoring
  - name: terra
    description: Real estate intelligence — market data, listings, geocoding, MLS, and commercial properties
  - name: holdings
    description: SZL Holdings portfolio — ventures, milestones, metrics, leadership, and investor relations
  - name: a2a
    description: Agent-to-Agent (A2A) protocol — agent cards, tasks, delegation, discovery
  - name: agent-os
    description: AgentOS runtime — scheduler, knowledge store, event bus, agent feeds
  - name: copilot
    description: AI Copilot — domain-specific AI chat powered by OpenAI and Anthropic
  - name: alloy
    description: Alloy agentic runtime — workflows, runs, artifacts, signals, approvals, and factory floor
  - name: decisions
    description: Platform-level decision engine — create, approve, and reject autonomous decisions
  - name: skills
    description: Skill library — AI agent skill definitions, runs, and lifecycle management
  - name: admin
    description: Platform administration — users, roles, audit log, impersonation, and feature flags
  - name: reports
    description: Report builder — templates, generation, approval workflow, distribution, and scheduling
  - name: exports
    description: Data export builder — domain-specific exports, download history, and preview
  - name: webhooks
    description: Webhook management — register endpoints, list deliveries, and receive Stripe-style signed event notifications for decision lifecycle events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/live:
    get:
      operationId: livenessCheck
      tags: [health]
      summary: Liveness probe
      description: Returns ok if the server process is alive
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/ready:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness probe
      description: Returns ready if all critical dependencies are connected
      responses:
        "200":
          description: Server is ready
        "503":
          description: Server is not ready (degraded)
  /health/detailed:
    get:
      operationId: detailedHealthCheck
      tags: [health]
      summary: Detailed health status
      description: Returns structured health status with all dependency checks including database, job queue, and telemetry
      responses:
        "200":
          description: Healthy or warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthStatus"
        "503":
          description: Degraded — one or more dependencies unreachable
  /health/ai:
    get:
      operationId: aiProviderHealthCheck
      tags: [health]
      summary: AI provider health
      description: Returns health status of all AI providers (OpenAI, Anthropic, Gemini, HuggingFace), retrieval index stats, model slot config, and current execution mode
      responses:
        "200":
          description: AI provider health summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [operational, degraded, error]
                  degraded:
                    type: boolean
                  providers:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        latencyMs:
                          type: integer
                  executionMode:
                    type: string
                  retrieval:
                    type: object
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/websocket:
    get:
      operationId: websocketHealthCheck
      tags: [health]
      summary: WebSocket server health
      description: Returns active connection count, channel count, and uptime
      responses:
        "200":
          description: WebSocket health summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  connections:
                    type: integer
                  channels:
                    type: integer
                  uptime:
                    type: number
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/billing:
    get:
      operationId: billingHealthCheck
      tags: [health]
      summary: Billing provider health
      description: Returns Stripe connectivity status, mode, and latency
      responses:
        "200":
          description: Billing health summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unconfigured, error]
                  provider:
                    type: string
                  mode:
                    type: string
                  latencyMs:
                    type: integer
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai/decision:
    get:
      operationId: listDecisions
      tags: [ai-engine]
      summary: List Alloy decisions
      description: Returns a paginated list of AlloyDecision objects, optionally filtered by status or risk level
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: status
          schema: { type: string, enum: [proposed, pending_approval, approved, rejected, executed, expired] }
        - in: query
          name: riskLevel
          schema: { type: string, enum: [P0, P1, P2, P3, P4] }
      responses:
        "200":
          description: Paginated decision list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlloyDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDecision
      tags: [ai-engine]
      summary: Create an Alloy decision
      description: |
        Creates a schema-validated AlloyDecision (v2.0.0). P0/P1 decisions are routed for human approval
        per the approval matrix. rawInput triggers RAG evidence enrichment automatically.
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendedAction, rationaleSummary, riskLevel]
              properties:
                recommendedAction: { type: string }
                rationaleSummary: { type: string }
                riskLevel: { type: string, enum: [P0, P1, P2, P3, P4] }
                confidence: { type: number, minimum: 0, maximum: 1 }
                workflowId: { type: ["string", "null"] }
                signalIds: { type: array, items: { type: string } }
                ownerSuggestion: { type: ["string", "null"] }
                fallbackPlan: { type: ["string", "null"] }
                modelRoute: { type: string }
                rawInput: { type: string, description: "If provided, triggers RAG retrieval to enrich evidenceRefs" }
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    $ref: "#/components/schemas/AlloyDecision"
                  approvalPolicy:
                    $ref: "#/components/schemas/ApprovalPolicy"
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ai/decision/{id}:
    get:
      operationId: getDecision
      tags: [ai-engine]
      summary: Get a single Alloy decision
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Decision object with approval policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    $ref: "#/components/schemas/AlloyDecision"
                  approvalPolicy:
                    $ref: "#/components/schemas/ApprovalPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai/decision/{id}/approve:
    post:
      operationId: approveDecision
      tags: [ai-engine]
      summary: Approve a pending Alloy decision
      description: |
        Marks a decision as approved. Requires exec or ops role for P1, exec-only for P0.
        Records an immutable audit trail entry.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approverName: { type: string }
      responses:
        "200":
          description: Decision approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    $ref: "#/components/schemas/AlloyDecision"
                  message: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ai/decision/{id}/reject:
    post:
      operationId: rejectDecision
      tags: [ai-engine]
      summary: Reject a pending Alloy decision
      description: Marks a decision as rejected with optional reason. Requires exec or ops role.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectorName: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Decision rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    $ref: "#/components/schemas/AlloyDecision"
                  message: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ai/approval-matrix:
    get:
      operationId: getApprovalMatrix
      tags: [ai-engine]
      summary: Get decision approval matrix
      description: Returns the full P0–P4 approval matrix with required roles, SLAs, and the current AI execution mode
      responses:
        "200":
          description: Approval matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  matrix:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/ApprovalPolicy"
                  description: { type: string }
                  executionMode: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /observability:
    get:
      operationId: listObservabilityApps
      tags: [observability]
      summary: List all app observability snapshots
      description: Returns telemetry snapshots for all registered apps. Results are cached for 15 seconds.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Array of app telemetry snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appSlug:
                      type: string
                    appName:
                      type: string
                    status:
                      type: string
                      enum: [healthy, warning, degraded, unknown]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /observability/{appSlug}:
    get:
      operationId: getAppObservability
      tags: [observability]
      summary: Get observability snapshot for a specific app
      description: Returns full telemetry snapshot for the specified app. Results are cached for 10 seconds.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: appSlug
          required: true
          schema:
            type: string
          description: App identifier slug (e.g. "rosie", "terra", "alloy")
      responses:
        "200":
          description: Telemetry snapshot
          content:
            application/json:
              schema:
                type: object
        "404":
          description: App not found
  /observability/alerts:
    get:
      operationId: getActiveAlerts
      tags: [observability]
      summary: Get all active system alerts
      description: Returns all currently active (unresolved) alerts from the platform alert engine.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertRecord"
                  count:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
        "401":
          description: Unauthorized
  /observability/business-events:
    get:
      operationId: getBusinessEvents
      tags: [observability]
      summary: Get business event counts and domain breakdown
      description: Returns aggregated business event counts across all domains and job failure/success rates.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Business event telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEventCounts"
        "401":
          description: Unauthorized
  /observability/vitals:
    post:
      operationId: recordWebVitals
      tags: [observability]
      summary: Record web vital metrics
      description: Accepts Core Web Vitals measurements (LCP, FID, CLS, FCP, TTFB) from frontend apps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appSlug:
                  type: string
                name:
                  type: string
                  description: Metric name (LCP, FID, CLS, FCP, TTFB)
                value:
                  type: number
                rating:
                  type: string
                  enum: [good, needs-improvement, poor]
                id:
                  type: string
              required:
                - appSlug
                - name
                - value
      responses:
        "200":
          description: Vital recorded
        "400":
          description: Invalid metric data
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      description: Returns all projects ordered by creation date
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      description: Creates a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with a credential and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the returnTo path on success or /api/login on failure.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
        "401":
          description: Token did not contain usable claims.
        "500":
          description: Token exchange failed.
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: List available authentication providers
      responses:
        "200":
          description: Available providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/sessions:
    post:
      operationId: createSession
      tags: [auth]
      summary: Create a new session token
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [auth]
      summary: Revoke the current session (from Authorization header)
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/{id}:
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Revoke a session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/roles:
    get:
      operationId: listRoles
      tags: [auth]
      summary: List all roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List all connectors
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Create a new connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnector"
      responses:
        "201":
          description: Connector created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connectors/{id}:
    get:
      operationId: getConnector
      tags: [connectors]
      summary: Get a connector by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connector details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Connector not found
    patch:
      operationId: updateConnector
      tags: [connectors]
      summary: Update a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnector"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
