            application/json:
              schema:
                type: object
                properties:
                  record: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agent-os/runs:
    get:
      operationId: listAgentRuns
      tags: [agent-os]
      summary: Get agent run history
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: domain
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { type: object }
                  total: { type: integer }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /agent-os/knowledge:
    get:
      operationId: queryAgentKnowledge
      tags: [agent-os]
      summary: Query the agent knowledge store
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: domain
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: since
          schema: { type: integer }
        - in: query
          name: minConfidence
          schema: { type: number }
        - in: query
          name: tags
          schema: { type: string, description: "Comma-separated tag list" }
      responses:
        "200":
          description: Knowledge entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { type: object }
                  total: { type: integer }
                  stats: { type: object }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /agent-os/events:
    get:
      operationId: listAgentEvents
      tags: [agent-os]
      summary: Get agent event bus history
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: sourceDomain
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: since
          schema: { type: integer }
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { type: object }
                  stats: { type: object }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /agent-os/feed:
    get:
      operationId: getGlobalAgentFeed
      tags: [agent-os]
      summary: Get global agent intelligence feed
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Global agent intelligence feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  globalFeed:
                    type: object
                    properties:
                      recentFindings:
                        type: array
                        items: { type: object }
                      correlations:
                        type: array
                        items: { type: object }
                      recentEvents:
                        type: array
                        items: { type: object }
                  stats: { type: object }
                  lastUpdated: { type: string, format: date-time }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /agent-os/feed/{domain}:
    get:
      operationId: getDomainAgentFeed
      tags: [agent-os]
      summary: Get domain-specific agent intelligence feed
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Domain intelligence feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  feed: { type: object }
                  stats: { type: object }
                  lastUpdated: { type: string, format: date-time }

        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /agent-os/agent-stats:
    get:
      operationId: getAgentStats
      tags: [agent-os]
      summary: Get detailed per-agent statistics
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Agent statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRunning: { type: boolean }
                  totalAgents: { type: integer }
                  totalRuns: { type: integer }
                  agents:
                    type: array
                    items: { type: object }
                  knowledge: { type: object }
                  eventBus: { type: object }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /copilot/chat:
    post:
      operationId: copilotChat
      tags: [copilot]
      summary: Send a message to the AI copilot (domain-specific)
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotChatRequest"
      responses:
        "200":
          description: AI response (JSON) or SSE stream when stream=true
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
            text/event-stream:
              schema:
                type: string
                description: Server-sent event stream of content chunks
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded

  /webhooks:
    post:
      operationId: registerWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint
      description: |
        Registers a new webhook endpoint to receive Stripe-style signed event notifications.
        The response includes a `secret` (prefixed `whsec_`) used to verify the `X-SZL-Signature`
        header on every delivery. Store it securely — it is only returned once.
      security:
        - bearerAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRegistrationRequest"
      responses:
        "201":
          description: Webhook endpoint registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List registered webhook endpoints
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: List of registered webhook endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/endpoints:
    post:
      operationId: registerWebhookEndpoint
      tags: [webhooks]
      summary: Register a webhook endpoint (verbose path)
      description: Alias for POST /webhooks. Returns full endpoint object including signing secret.
      security:
        - bearerAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRegistrationRequest"
      responses:
        "201":
          description: Webhook endpoint registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: List registered webhook endpoints (verbose path)
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: List of endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/endpoints/{id}:
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Update a webhook endpoint
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                eventTypes:
                  oneOf:
                    - type: string
                      enum: ["*"]
                    - type: array
                      items: { type: string }
                active: { type: boolean }
                description: { type: string }
      responses:
        "200":
          description: Endpoint updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete a webhook endpoint
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Endpoint deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/endpoints/{id}/ping:
    post:
      operationId: pingWebhookEndpoint
      tags: [webhooks]
      summary: Send a test ping to a webhook endpoint
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      delivered: { type: boolean }
                      statusCode: { type: integer }
                      error: { type: string }

  /webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: List webhook delivery attempts
      description: Returns recent webhook delivery attempts, optionally filtered by endpoint or event type. Use `eventType=decision.*` to see all decision lifecycle events.
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: endpointId
          in: query
          schema: { type: string }
          description: Filter by endpoint ID
        - name: eventType
          in: query
          schema: { type: string }
          description: "Filter by event type. Supports prefix wildcard, e.g. `decision.*`"
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: List of delivery attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/event-types:
    get:
      operationId: listWebhookEventTypes
      tags: [webhooks]
      summary: List all supported webhook event types
      description: Returns all supported event type strings, including decision lifecycle events.
      responses:
        "200":
          description: Supported event types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      eventTypes:
                        type: array
                        items: { type: string }
                        example:
                          - decision.created
                          - decision.approved
                          - decision.executed
                          - decision.proved
                          - decision.outcome_recorded

  /decisioning/evaluate:
    post:
      operationId: evaluateDecisionSignals
      tags: [decisions]
      summary: Evaluate signals into ranked recommendations
      description: |
        Evaluates one or more signal groups through the decision engine and returns
        ranked recommendations with policy evaluations. Emits a `decision.created`
        webhook event after evaluation.
      security:
        - bearerAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    description: Signal group with domain context and business impact
                weights:
                  type: object
                  description: Optional custom ranking weights
      responses:
        "200":
          description: Ranked recommendations with policy evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      type: object
                  totalSignalsEvaluated: { type: integer }
                  evaluatedAt: { type: integer }
                  engineVersion: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /decisioning/execute:
    post:
      operationId: executeDecisionWorkflow
      tags: [decisions]
      summary: Execute a decision workflow
      description: |
        Runs a registered workflow definition through the governed execution pipeline.
        Policy is checked before execution. Emits `decision.approved` (when approved)
        and `decision.executed` webhook events.
      security:
        - bearerAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowId]
              properties:
                workflowId: { type: string }
                recommendationId: { type: string }
                isDryRun: { type: boolean, default: false }
                isSimulation: { type: boolean, default: false }
                approvedBy: { type: string }
                metadata: { type: object }
      responses:
        "201":
          description: Workflow run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    description: Workflow run record
                  requiresApproval: { type: boolean }
                  policyEvaluation: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /decisioning/runs/{runId}/outcome:
    post:
      operationId: recordDecisionOutcome
      tags: [decisions]
      summary: Record the outcome of a decision run
      description: |
        Logs the final outcome (success, partial, failed, or cancelled) for a completed
        workflow run. Emits a `decision.outcome_recorded` webhook event.
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionOutcomeRequest"
      responses:
        "200":
          description: Outcome recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string }
                  outcome: { type: string, enum: [success, partial, failed, cancelled] }
                  recordedBy: { type: string }
                  recordedAt: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /decisioning/runs/{runId}/prove:
    post:
      operationId: proveDecisionRun
      tags: [decisions]
      summary: Record proof for a decision run
      description: |
        Records cryptographic or human proof for a decision run (audit, verification,
        or compliance evidence). Emits a `decision.proved` webhook event.
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionProofRequest"
      responses:
        "200":
          description: Proof recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string }
                  proofType: { type: string }
                  provedBy: { type: string }
                  provedAt: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token for authenticated endpoints (roles: admin, user)"
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              statusCode: { type: integer }
              code: { type: string }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              statusCode: { type: integer }
              code: { type: string }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              statusCode: { type: integer }
              code: { type: string }
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              statusCode: { type: integer }
              code: { type: string }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              statusCode: { type: integer }
              code: { type: string }
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
        domain:
          type: string
          description: |
            Product domain for file type allowlist enforcement
            (e.g. "prism", "terra", "vessels", "aegis", "lyte", "szl", "carlota-jo").
            Omit or use "default" for the global allowlist.
        orgId:
          type: integer
          description: Org ID for quota enforcement. Required when uploading on behalf of an org.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AlloyDecision:
      type: object
      description: Schema-validated Alloy decision object (v2.0.0)
      required:
        - decisionId
        - recommendedAction
        - rationaleSummary
        - riskLevel
        - confidence
        - evidenceRefs
        - approvalRequired
        - modelRoute
        - schemaVersion
        - createdAt
        - status
      properties:
        decisionId: { type: string }
        workflowId: { type: ["string", "null"] }
        signalIds: { type: array, items: { type: string } }
        recommendedAction: { type: string }
        rationaleSummary: { type: string }
        evidenceRefs:
          type: array
          items:
            type: object
            properties:
              refId: { type: string }
              source: { type: string }
              sourceType: { type: string }
              content: { type: string }
              relevanceScore: { type: number }
              timestamp: { type: ["string", "null"] }
              objectId: { type: ["string", "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        ownerSuggestion: { type: ["string", "null"] }
        approvalRequired: { type: boolean }
        riskLevel: { type: string, enum: [P0, P1, P2, P3, P4] }
        fallbackPlan: { type: ["string", "null"] }
        modelRoute: { type: string }
        schemaVersion: { type: string, enum: ["2.0.0"] }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [proposed, pending_approval, approved, rejected, executed, expired] }
        approvedBy: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"], format: date-time }
        rejectedBy: { type: ["string", "null"] }
        rejectedAt: { type: ["string", "null"], format: date-time }
        rejectionReason: { type: ["string", "null"] }
        executedAt: { type: ["string", "null"], format: date-time }
        executionOutcome: { type: ["string", "null"], enum: [pending, executed, failed, rejected, expired] }
        rawInput: { type: ["string", "null"] }
        rawOutput: { type: ["string", "null"] }
    ApprovalPolicy:
      type: object
      properties:
        requiresApproval: { type: boolean }
        approverRole: { type: string }
        sla: { type: string }
        autoExpireHours: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
        status:
          type: string
          enum: [active, completed, on-hold, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt
    CreateProject:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, completed, on-hold, archived]
          default: active
      required:
        - name
    UpdateProject:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, completed, on-hold, archived]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          type: [object, "null"]
          allOf:
            - $ref: "#/components/schemas/AuthUser"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        roles:
          type: array
          items:
            type: string
      required:
        - id
        - displayName
        - roles
    SessionToken:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - isActive
    Connector:
      type: object
      properties:
        id:
          type: integer
        orgId:
