    # ─── Reports schemas ─────────────────────────────────────────────────────
    ReportTemplate:
      type: object
      properties:
        id: { type: integer }
        key: { type: ["string", "null"], description: "Non-null for built-in templates" }
        name: { type: string }
        description: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        sections: { type: array, items: { type: object } }
        isBuiltIn: { type: boolean }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - name
        - sections
        - isBuiltIn
    Report:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        templateId: { type: ["integer", "null"] }
        status: { type: string, enum: [draft, under_review, approved, published, archived] }
        generatedBy: { type: ["integer", "null"] }
        parameters: { type: ["object", "null"] }
        pdfUrl: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - title
        - status
        - version
        - createdAt

    # ─── Exports schemas ─────────────────────────────────────────────────────
    ExportRequest:
      type: object
      properties:
        format: { type: string, enum: [csv, json, xlsx], default: csv }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        filters: { type: object }
        columns: { type: array, items: { type: string } }
    ExportJob:
      type: object
      properties:
        id: { type: integer }
        domain: { type: string }
        format: { type: string, enum: [csv, json, xlsx] }
        status: { type: string, enum: [queued, running, completed, failed, expired] }
        rowCount: { type: ["integer", "null"] }
        fileSizeBytes: { type: ["integer", "null"] }
        downloadToken: { type: ["string", "null"] }
        downloadUrl: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        requestedBy: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
      required:
        - id
        - domain
        - format
        - status
        - requestedBy
        - createdAt
    WebhookRegistrationRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The HTTPS endpoint that will receive webhook deliveries
        eventTypes:
          description: |
            Event types to subscribe to. Use `"*"` for all events, or an array of specific
            event type strings such as `["decision.created", "decision.executed"]`.
          oneOf:
            - type: string
              enum: ["*"]
            - type: array
              items:
                type: string
                enum:
                  - decision.created
                  - decision.approved
                  - decision.executed
                  - decision.proved
                  - decision.outcome_recorded
                  - payment.succeeded
                  - payment.failed
                  - subscription.created
                  - subscription.updated
                  - subscription.cancelled
                  - alert.raised
                  - alert.resolved
                  - workflow.started
                  - workflow.completed
                  - workflow.failed
                  - user.created
                  - user.updated
                  - deal.created
                  - deal.updated
                  - vulnerability.detected
                  - vessel.anomaly
                  - health.degraded
                  - health.restored
                  - ingestion.completed
                  - api.error_spike
        description:
          type: string
          description: Human-readable label for this endpoint
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          description: Unique endpoint identifier (prefix `whe_`)
        url:
          type: string
          format: uri
        eventTypes:
          oneOf:
            - type: string
              enum: ["*"]
            - type: array
              items: { type: string }
        active:
          type: boolean
        description:
          type: string
        createdAt:
          type: integer
          description: Unix timestamp (ms)
        lastDeliveredAt:
          type: integer
          description: Unix timestamp of last successful delivery (ms)
        failureCount:
          type: integer
      required: [id, url, eventTypes, active, createdAt, failureCount]
    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          properties:
            secret:
              type: string
              description: HMAC-SHA256 signing secret (prefix `whsec_`). Only returned on creation.
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          description: Unique delivery attempt identifier (prefix `del_`)
        endpointId:
          type: string
        eventType:
          type: string
          description: The event type, e.g. `decision.executed`
        status:
          type: string
          enum: [pending, delivered, failed]
        statusCode:
          type: integer
          description: HTTP status code from the receiving server
        attempt:
          type: integer
          description: Delivery attempt number (1 = first, 2+ = retry)
        deliveredAt:
          type: integer
          description: Unix timestamp of delivery attempt (ms)
        error:
          type: string
          description: Error message if delivery failed
      required: [id, endpointId, eventType, status, attempt]
    WebhookEvent:
      type: object
      description: |
        Envelope sent to registered webhook endpoints. Verify authenticity using
        the `X-SZL-Signature` header: `t=<timestamp>,v1=<hmac-sha256-hex>` where
        the signed payload is `<timestamp>.<json-body>`.
      properties:
        id:
          type: string
          description: Unique event identifier (prefix `evt_`)
        type:
          type: string
          description: Event type string, e.g. `decision.executed`
        created:
          type: integer
          description: Unix timestamp (seconds) when the event was created
        correlation_id:
          type: string
          description: Optional correlation ID linking related events
        data:
          type: object
          description: Event-specific payload. Schema varies by event type.
      required: [id, type, created, data]
    DecisionCreatedEvent:
      type: object
      description: Payload for the `decision.created` event (emitted after POST /decisioning/evaluate)
      properties:
        recommendationCount: { type: integer }
        domains:
          type: array
          items: { type: string }
        totalSignalsEvaluated: { type: integer }
        evaluatedAt: { type: integer }
        initiatedBy: { type: string }
    DecisionApprovedEvent:
      type: object
      description: Payload for the `decision.approved` event
      properties:
        runId: { type: string }
        workflowId: { type: string }
        workflowName: { type: string }
        domain: { type: string }
        initiatedBy: { type: string }
        approvedBy: { type: string }
        policyEffect: { type: string, enum: [allow, block, require_approval] }
    DecisionExecutedEvent:
      type: object
      description: Payload for the `decision.executed` event (emitted after POST /decisioning/execute)
      properties:
        runId: { type: string }
        workflowId: { type: string }
        workflowName: { type: string }
        domain: { type: string }
        initiatedBy: { type: string }
        status: { type: string }
        isDryRun: { type: boolean }
        isSimulation: { type: boolean }
        requiresApproval: { type: boolean }
        stepCount: { type: integer }
    DecisionProvedEvent:
      type: object
      description: Payload for the `decision.proved` event (emitted after POST /decisioning/runs/{runId}/prove)
      properties:
        runId: { type: string }
        workflowId: { type: string }
        proofType:
          type: string
          enum: [human-verified, automated-check, audit-trail, cryptographic]
        proofHash: { type: string }
        provedBy: { type: string }
        provedAt: { type: integer }
        notes: { type: string }
        evidence:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
              source: { type: string }
    DecisionOutcomeRecordedEvent:
      type: object
      description: Payload for the `decision.outcome_recorded` event (emitted after POST /decisioning/runs/{runId}/outcome)
      properties:
        runId: { type: string }
        workflowId: { type: string }
        outcome:
          type: string
          enum: [success, partial, failed, cancelled]
        summary: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: integer }
        impact:
          type: object
          properties:
            financialUsd: { type: number }
            entitiesAffected: { type: integer }
            notes: { type: string }
    DecisionOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [success, partial, failed, cancelled]
        summary: { type: string }
        impact:
          type: object
          properties:
            financialUsd: { type: number }
            entitiesAffected: { type: integer }
            notes: { type: string }
        metadata: { type: object }
    DecisionProofRequest:
      type: object
      required: [proofType, provedBy]
      properties:
        proofType:
          type: string
          enum: [human-verified, automated-check, audit-trail, cryptographic]
        proofHash: { type: string, description: "Optional cryptographic hash of proof artifact" }
        provedBy: { type: string, description: "Identifier of the person or system providing proof" }
        notes: { type: string }
        evidence:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
              source: { type: string }
