        source: { type: string, description: "Originating system or integration (e.g. terra, vessels, alloy)" }
        domain: { type: string }
        eventType: { type: string }
        payload: { type: object }
        correlationId: { type: ["string", "null"] }
        priority: { type: string, enum: [low, normal, high, critical], default: normal }
        metadata: { type: object }
    A2AAgentCard:
      type: object
      properties:
        agentId: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        capabilities:
          type: array
          items: { type: string }
        domain: { type: string }
        availability: { type: string, enum: [available, busy, offline] }
        trustLevel: { type: string, enum: [public, internal, trusted, admin] }
        endpoints: { type: object }
        metadata: { type: object }
    A2ATask:
      type: object
      properties:
        taskId: { type: string }
        agentId: { type: string }
        status: { type: string, enum: [pending, running, completed, failed] }
        input: { type: object }
        output: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        callerAgentId: { type: ["string", "null"] }
        callerPlatform: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    CopilotChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant, system] }
              content: { type: string, minLength: 1, maxLength: 50000 }
        agentId:
          type: string
          maxLength: 100
          description: "Domain agent identifier (e.g. vessels, terra, command)"
        context:
          type: object
          description: "Additional context passed to the system prompt"
        stream:
          type: boolean
          default: true
          description: "If true, response is streamed as SSE; if false, returned as JSON"
    AlloySignal:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        domain: { type: string }
        eventType: { type: ["string", "null"] }
        payload: { type: object }
        priority: { type: string }
        status: { type: string, enum: [queued, processing, processed, failed, ignored] }
        workflowId: { type: ["string", "null"] }
        correlationId: { type: ["string", "null"] }
        ingestedAt: { type: string, format: date-time }
        processedAt: { type: ["string", "null"], format: date-time }
      required:
        - id
        - source
        - domain
        - payload
        - status
        - ingestedAt
    AlloyWorkflow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive, archived] }
        domain: { type: ["string", "null"] }
        steps: { type: array, items: { type: object } }
        triggers: { type: array, items: { type: object } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - name
        - status
        - createdAt
    CreateAlloyWorkflow:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        domain: { type: string }
        steps: { type: array, items: { type: object } }
        triggers: { type: array, items: { type: object } }
    AlloyRun:
      type: object
      properties:
        id: { type: string }
        workflowId: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        input: { type: ["object", "null"] }
        output: { type: ["object", "null"] }
        error: { type: ["string", "null"] }
        durationMs: { type: ["integer", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - workflowId
        - status
        - createdAt
    AlloyRunStep:
      type: object
      properties:
        stepId: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, skipped] }
        input: { type: ["object", "null"] }
        output: { type: ["object", "null"] }
        error: { type: ["string", "null"] }
        durationMs: { type: ["integer", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
      required:
        - stepId
        - name
        - status
    AlloyArtifact:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        workflowId: { type: string }
        type: { type: string }
        title: { type: ["string", "null"] }
        content: { type: object }
        status: { type: string, enum: [pending, approved, rejected] }
        approvedBy: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"], format: date-time }
        rejectedBy: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - runId
        - workflowId
        - type
        - content
        - status
        - createdAt
    AlloyApproval:
      type: object
