components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token for authenticated endpoints (roles: admin, user)"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, completed, on-hold, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt
    CreateProject:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, completed, on-hold, archived]
          default: active
      required:
        - name
    UpdateProject:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, completed, on-hold, archived]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
      required:
        - id
        - displayName
        - roles
    SessionToken:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - isActive
    Connector:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        name:
          type: string
        type:
          type: string
          enum: [stripe, slack, twilio, google, notion, github, shopify, custom]
        status:
          type: string
          enum: [active, inactive, error, pending]
        isEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - status
    CreateConnector:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [stripe, slack, twilio, google, notion, github, shopify, custom]
        orgId:
          type: integer
        config:
          type: object
      required:
        - name
        - type
    UpdateConnector:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, error, pending]
        config:
          type: object
        isEnabled:
          type: boolean
    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [info, success, warning, error, action_required]
        channel:
          type: string
          enum: [in_app, email, sms, slack]
        title:
          type: string
        message:
          type: string
        actionUrl:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - channel
        - title
        - message
        - isRead
