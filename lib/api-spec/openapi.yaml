openapi: 3.1.0
info:
  title: SZL Holdings DreamStack API
  version: 0.2.0
  description: Platform API for the SZL Holdings DreamStack suite
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: auth
    description: Authentication and user management
  - name: connectors
    description: Integration connector management
  - name: notifications
    description: Notification management
  - name: audit
    description: Activity logs and audit events
  - name: billing
    description: Billing plans, subscriptions, and invoices
  - name: feature-flags
    description: Feature flag management
  - name: files
    description: File and asset management
  - name: stephen
    description: Stephen L. portfolio site
  - name: vessels
    description: Vessel tracking and cargo management
  - name: firestorm
    description: Campaign and lead management
  - name: lyte
    description: E-commerce products and orders
  - name: dreamscape
    description: Creative project management
  - name: readiness
    description: Readiness assessments and compliance
  - name: observability
    description: Platform telemetry, web vitals, alerts, and health monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/live:
    get:
      operationId: livenessCheck
      tags: [health]
      summary: Liveness probe
      description: Returns ok if the server process is alive
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness probe
      description: Returns ready if all critical dependencies are connected
      responses:
        "200":
          description: Server is ready
        "503":
          description: Server is not ready (degraded)
  /health/detailed:
    get:
      operationId: detailedHealthCheck
      tags: [health]
      summary: Detailed health status
      description: Returns structured health status with all dependency checks including database, job queue, and telemetry
      responses:
        "200":
          description: Healthy or warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthStatus"
        "503":
          description: Degraded — one or more dependencies unreachable
  /observability:
    get:
      operationId: listObservabilityApps
      tags: [observability]
      summary: List all app observability snapshots
      description: Returns telemetry snapshots for all registered apps. Results are cached for 15 seconds.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Array of app telemetry snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appSlug:
                      type: string
                    appName:
                      type: string
                    status:
                      type: string
                      enum: [healthy, warning, degraded, unknown]
  /observability/{appSlug}:
    get:
      operationId: getAppObservability
      tags: [observability]
      summary: Get observability snapshot for a specific app
      description: Returns full telemetry snapshot for the specified app. Results are cached for 10 seconds.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: appSlug
          required: true
          schema:
            type: string
          description: App identifier slug (e.g. "rosie", "terra", "alloy")
      responses:
        "200":
          description: Telemetry snapshot
          content:
            application/json:
              schema:
                type: object
        "404":
          description: App not found
  /observability/alerts:
    get:
      operationId: getActiveAlerts
      tags: [observability]
      summary: Get all active system alerts
      description: Returns all currently active (unresolved) alerts from the platform alert engine.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertRecord"
                  count:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
        "401":
          description: Unauthorized
  /observability/business-events:
    get:
      operationId: getBusinessEvents
      tags: [observability]
      summary: Get business event counts and domain breakdown
      description: Returns aggregated business event counts across all domains and job failure/success rates.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Business event telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEventCounts"
        "401":
          description: Unauthorized
  /observability/vitals:
    post:
      operationId: recordWebVitals
      tags: [observability]
      summary: Record web vital metrics
      description: Accepts Core Web Vitals measurements (LCP, FID, CLS, FCP, TTFB) from frontend apps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appSlug:
                  type: string
                name:
                  type: string
                  description: Metric name (LCP, FID, CLS, FCP, TTFB)
                value:
                  type: number
                rating:
                  type: string
                  enum: [good, needs-improvement, poor]
                id:
                  type: string
              required:
                - appSlug
                - name
                - value
      responses:
        "200":
          description: Vital recorded
        "400":
          description: Invalid metric data
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      description: Returns all projects ordered by creation date
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      description: Creates a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with a credential and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
        "401":
          description: Token did not contain usable claims.
        "500":
          description: Token exchange failed.
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: List available authentication providers
      responses:
        "200":
          description: Available providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/sessions:
    post:
      operationId: createSession
      tags: [auth]
      summary: Create a new session token
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [auth]
      summary: Revoke the current session (from Authorization header)
      responses:
        "204":
          description: Session revoked
  /auth/sessions/{id}:
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Revoke a session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session revoked
  /auth/roles:
    get:
      operationId: listRoles
      tags: [auth]
      summary: List all roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
  /auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List all connectors
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Create a new connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnector"
      responses:
        "201":
          description: Connector created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
  /connectors/{id}:
    get:
      operationId: getConnector
      tags: [connectors]
      summary: Get a connector by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connector details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Connector not found
    patch:
      operationId: updateConnector
      tags: [connectors]
      summary: Update a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnector"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
    delete:
      operationId: deleteConnector
      tags: [connectors]
      summary: Delete a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Connector deleted
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: createNotification
      tags: [notifications]
      summary: Create a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotification"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /audit/activity:
    get:
      operationId: listActivityLogs
      tags: [audit]
      summary: List activity logs
      responses:
        "200":
          description: List of activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events
      responses:
        "200":
          description: List of audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List billing plans
      responses:
        "200":
          description: List of billing plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPlan"
  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [billing]
      summary: List subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
  /billing/invoices:
    get:
      operationId: listInvoices
      tags: [billing]
      summary: List invoices
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /billing/products:
    get:
      operationId: listStripeProducts
      tags: [billing]
      summary: List Stripe products with prices
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StripeProduct"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
  /billing/subscription-status:
    get:
      operationId: getSubscriptionStatus
      tags: [billing]
      summary: Get subscription status for a customer
      parameters:
        - name: email
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
  /billing/customer-portal:
    post:
      operationId: createCustomerPortal
      tags: [billing]
      summary: Create a Stripe Customer Portal session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                returnUrl:
                  type: string
              required:
                - customerId
                - returnUrl
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
  /billing/checkout-session/{sessionId}:
    get:
      operationId: getCheckoutSession
      tags: [billing]
      summary: Get a checkout session by ID
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCheckoutSession"
  /billing/stripe-invoices:
    get:
      operationId: listStripeInvoices
      tags: [billing]
      summary: List Stripe invoices
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of Stripe invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StripeInvoice"
  /feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [feature-flags]
      summary: List feature flags
      responses:
        "200":
          description: List of feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"
    post:
      operationId: createFeatureFlag
      tags: [feature-flags]
      summary: Create a feature flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureFlag"
      responses:
        "201":
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"
  /feature-flags/{id}:
    patch:
      operationId: updateFeatureFlag
      tags: [feature-flags]
      summary: Update a feature flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeatureFlag"
      responses:
        "200":
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"
    delete:
      operationId: deleteFeatureFlag
      tags: [feature-flags]
      summary: Delete a feature flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Feature flag deleted
  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List files
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileRecord"
  /files/{id}:
    get:
      operationId: getFile
      tags: [files]
      summary: Get a file by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
        "404":
          description: File not found
  /assets:
    get:
      operationId: listAssets
      tags: [files]
      summary: List assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
  /stephen/contacts:
    get:
      operationId: listStephenContacts
      tags: [stephen]
      summary: List contact submissions
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StephenContact"
    post:
      operationId: createStephenContact
      tags: [stephen]
      summary: Submit a contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStephenContact"
      responses:
        "201":
          description: Contact submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StephenContact"
  /stephen/testimonials:
    get:
      operationId: listStephenTestimonials
      tags: [stephen]
      summary: List testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StephenTestimonial"
  /stephen/case-studies:
    get:
      operationId: listStephenCaseStudies
      tags: [stephen]
      summary: List case studies
      responses:
        "200":
          description: List of case studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StephenCaseStudy"
  /stephen/profile:
    get:
      operationId: getStephenProfile
      tags: [stephen]
      summary: Get Stephen's profile data
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StephenProfile"
  /stephen/content-blocks:
    get:
      operationId: listStephenContentBlocks
      tags: [stephen]
      summary: List all content blocks
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [achievement, about, service, stat, skill]
      responses:
        "200":
          description: Content blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StephenContentBlock"
    post:
      operationId: createStephenContentBlock
      tags: [stephen]
      summary: Create a content block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStephenContentBlock"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
