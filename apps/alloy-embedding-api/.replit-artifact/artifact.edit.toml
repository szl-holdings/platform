kind = "web"
previewPath = "/alloy-embedding-api/"
title = "AEF — Alloy Embedding Fabric API"
version = "0.1.0"
id = "apps/alloy-embedding-api"
router = "path"

[[services]]
name = "web"
paths = [ "/alloy-embedding-api/" ]
localPort = 8766

[services.development]
run = "env NODE_ENV=development AEF_AUTH_BYPASS=true pnpm --filter @workspace/alloy-embedding-api run dev"

[services.production]
build = "pnpm --filter @workspace/alloy-embedding-api run build"
run = "pnpm --filter @workspace/alloy-embedding-api run start"

[services.env]
PORT = "8766"
BASE_PATH = "/alloy-embedding-api"
AEF_AUTH_BYPASS = "false"
NODE_ENV = "production"
