[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollm"
version = "0.4.2"
description = "oLLM — run 80B+ parameter models on consumer GPUs via SSD-offloaded KV cache"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
cuda = [
    "flash-attn>=2.8.3.post1",
]

[tool.setuptools.packages.find]
include = ["ollm*"]
