[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollm"
version = "0.4.2"
description = "oLLM — run 80B+ parameter models on consumer GPUs via SSD-offloaded KV cache"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.2",
    "transformers>=4.38",
]

[project.optional-dependencies]
cuda = [
    "flash-attn>=2.5",
]

[tool.setuptools.packages.find]
include = ["ollm*"]
