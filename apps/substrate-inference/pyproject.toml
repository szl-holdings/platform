[project]
name = "substrate-inference"
version = "0.1.0"
description = "Substrate Edge Inference — oLLM-powered local GPU inference service with OpenAI-compatible API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "structlog>=24.0.0,<26.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "flash-attn>=2.7.0",
    "accelerate>=1.2.0",
    "safetensors>=0.5.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.44.0",
]
