[project]
name = "substrate-inference"
version = "0.1.0"
description = "Substrate Edge Inference — governed local GPU transformer service with an OpenAI-shaped API"
readme = "README.md"
license = { text = "LicenseRef-SZL-Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.4,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
    "httpx>=0.28.1,<1.0.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10.0.0",
]
gpu = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "flash-attn>=2.8.3.post1",
    "accelerate>=1.2.0",
    "safetensors>=0.5.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.44.0",
]
