name: 'Mythos Doctrine — PR Governance Check'
description: >
  Runs the Mythos Doctrine PR-time governance subset against changed agents:
  Constitution DSL lint (suggest-only), a Petri-style behavioral-audit subset,
  and an Adversarial Robustness delta vs. the baseline snapshot. Posts a single
  PR comment summarizing findings. Never blocks; never auto-merges.
author: 'A11oy'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  spec-version:
    description: 'Mythos Doctrine Open Spec version this run targets.'
    required: false
    default: '0.1.0'
  agent-id:
    description: 'Agent operator id under change (e.g. op-cascade). If omitted, the action infers from changed files.'
    required: false
    default: ''
  baseline-snapshot:
    description: 'Snapshot fingerprint id to compare against. If omitted, the latest tagged baseline is used.'
    required: false
    default: ''
  audit-suite:
    description: 'Behavioral-audit subset to run.'
    required: false
    default: 'petri-pr-subset@1.4.0'
  trust-portal-base:
    description: 'Public Trust Portal base URL where full results will be linked.'
    required: false
    default: 'https://a11oy.io/trust'
  comment-on-pr:
    description: 'Whether to post the structured comment to the PR.'
    required: false
    default: 'true'
  github-token:
    description: 'GITHUB_TOKEN for posting the PR comment.'
    required: false
    default: ${{ github.token }}

outputs:
  composite-robustness:
    description: 'Composite adversarial-robustness score for the changed agent (0-100).'
  robustness-delta:
    description: 'Signed change vs. baseline snapshot.'
  audit-findings-count:
    description: 'Number of behavioral-audit findings produced by this run.'
  cavd-related:
    description: 'Comma-separated CAVD advisory ids related to clauses changed in this PR.'
  affected-agents:
    description: 'Comma-separated agent ids inferred from the changed files in this PR.'

runs:
  using: 'node20'
  main: 'dist/index.js'
